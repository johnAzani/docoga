<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DocOga Owner — offline</title>
<style>
/* The one screen this APK owns. Shown when the WebView cannot reach the site at
   all (server.url + errorPath). Deliberately honest: nothing is cached, because
   a stale revenue number on an owner dashboard is worse than no number. */
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{font:15px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:#0B1B3F;color:#E2E8F0;display:flex;align-items:center;justify-content:center;padding:calc(28px + env(safe-area-inset-top)) 22px calc(28px + env(safe-area-inset-bottom))}
@supports (min-height:100dvh){body{min-height:100dvh}}
.card{max-width:420px;width:100%;background:#122348;border:1px solid #1E355F;border-radius:16px;padding:22px}
h1{font-size:19px;margin:0 0 8px}
p{margin:0 0 14px;color:#9FB3D1;font-size:14px}
button{font:inherit;font-weight:700;background:#fff;color:#0B1B3F;border:0;border-radius:10px;padding:11px 18px;width:100%;cursor:pointer}
code{background:#0B1B3F;padding:1px 5px;border-radius:5px;font-size:13px}
small{display:block;margin-top:12px;color:#64748B;font-size:12px}
</style>
</head>
<body>
<div class="card">
  <h1>No connection to DocOga</h1>
  <p>This app only opens <code>docoga.com.ng/admin</code>. Nothing is stored on the phone, so there is nothing to show you offline.</p>
  <button onclick="location.reload()">Try again</button>
  <small>If it keeps failing, open the same address in Chrome. If the site itself is down, the app cannot help — that is a Cloudflare Workers question, not an app one.</small>
</div>
</body>
</html>
