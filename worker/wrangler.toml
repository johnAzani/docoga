# DocOga Pass Worker — Cloudflare config
# Deploy options (pick ONE):
#   A) Easiest: Cloudflare dashboard → Workers & Pages → Create → paste worker/index.js
#      (then bind KV + add secrets in the worker's Settings → Variables)
#   B) CLI: npm i -g wrangler && wrangler deploy
#
# If using the CLI, fill in your KV namespace id below (dashboard → Storage & Databases → KV).

name = "docoga-pass"
main = "index.js"
compatibility_date = "2026-09-18"

[[kv_namespaces]]
binding = "KV"
id = "f3a5afebe7d04bb0a6018c0d7d355253"

# Secrets — do NOT put these in this file. Set them with:
#   wrangler secret put ISSUE_SECRET
#   wrangler secret put FLW_SECRET_KEY          (Path B)
#   wrangler secret put FLW_WEBHOOK_HASH        (optional)
#   wrangler secret put PAYSTACK_SECRET_KEY     (Path C — after CAC)
#   wrangler secret put BREVO_API_KEY           (email delivery — PRIMARY, brevo.com)
#   wrangler secret put SMTP2GO_API_KEY         (optional fallback)
#   wrangler secret put RESEND_API_KEY          (optional fallback)
#   wrangler secret put ADMIN_PASSPHRASE        (owner dashboard: the thing you type at /admin;
#                                                unset means every /admin/* route answers 503 admin_disabled)
#   wrangler secret put ADMIN_AUTH_SECRET       (owner dashboard: HMAC key for the 12-hour bearer
#                                                sessions; a DIFFERENT secret, never reused for anything)
# Plain (non-secret) variables can also be set in the dashboard:
#   PROVIDER = "flw" or "paystack"
#   MAIL_FROM = "DocOga <passes@docoga.com.ng>" (must be verified by the active mail provider)
#   RESEND_EMAIL_ENABLED = "true" (only after sender/domain authentication; unset means disabled)
# Secrets (wrangler secret put ...):
#   TEAM_AUTH_SECRET (required for /business/login* and /business/team* — unset means 503 fail-closed)
#   SITE_URL = "https://docoga.com.ng"

[triggers]
crons = ["0 7 * * *"]  # 08:00 Nigeria time, daily — day-27 renewal reminders, and
                       # buildAdminSnapshot(): the 31-day ledger + expiry-index rollup the
                       # owner dashboard reads (ADMIN_DASHBOARD.md §4)

[vars]
PROVIDER = "flw"
SITE_URL = "https://docoga.com.ng"
PAYMENT_URL = "https://flutterwave.com/pay/ynznvgof2r21"
