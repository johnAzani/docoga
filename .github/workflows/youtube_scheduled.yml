name: YouTube Shorts Auto-Generate and Publish

# Renders a fresh Short from the date-seeded, fact-safe templates and uploads
# it — public, unattended, twice a week.
#
# Three safeguards exist because this job is never watched by a human:
#   1. a preflight that names the missing secret instead of failing mid-upload,
#   2. a duplicate guard (tools/youtube_ledger.py) so a re-run, a GitHub retry
#      or a second dispatch cannot put the same Short on the channel twice,
#   3. a visible issue on failure, so a broken run is not just a red dot nobody
#      opens.

on:
  schedule:
    # Every weekday at 6 PM West Africa Time (UTC+1). Tue/Wed/Fri since 17 Oct 2026; Monday
    # and Thursday added the same day (visibility research): 61 % of Shorts views come from the
    # Shorts feed, channels under 10K subscribers grew Shorts views >200 % in a year, and 3–5
    # Shorts a week is the cadence YouTube's own data rewards. Monday and Thursday cost the
    # narrator nothing new: the Facebook/Instagram Reels lane (08:30 UTC) narrates the same
    # rotation topic hours earlier and the clips come back from the shared cache
    # (`shorts-voice-v2-*`), so this run finds every line already spoken.
    - cron: '0 17 * * 1-5'
  workflow_dispatch:
    inputs:
      privacy:
        description: 'Privacy status for this upload'
        required: false
        default: public
        type: choice
        options:
          - public
          - unlisted
          - private
      probe_only:
        description: 'Diagnose credentials, channel identity and the last upload, then stop — nothing is rendered or uploaded'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
      force:
        description: 'Publish even if the ledger already has this title within the duplicate window'
        required: false
        default: false
        type: boolean
      for_date:
        description: 'Render the rotation topic of this date (YYYY-MM-DD) instead of today — used by the narrator-resume workflow to finish a Short that was owed'
        required: false
        default: ''
        type: string

permissions:
  contents: write   # the publish ledger is committed back after a successful upload
  issues: write     # a failed run opens (or comments on) a visible issue

concurrency:
  group: youtube-shorts-scheduled
  cancel-in-progress: false

jobs:
  # A separate job rather than a condition on every step, so a diagnosis run cannot reach the
  # render or the upload by accident and so the step-level guards stay readable.
  probe:
    name: Diagnose the YouTube lane
    if: github.event.inputs.probe_only == 'true'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the repository
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install the upload dependency
        run: python -m pip install --quiet "requests>=2.31,<3" cryptography
      - name: Probe credentials, channel and last upload
        env:
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          SOCIAL_TOKEN_KEY: ${{ secrets.SOCIAL_TOKEN_KEY }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_CHANNEL_ID: ${{ vars.YT_CHANNEL_ID }}
        run: |
          set -o pipefail
          python3 tools/yt_publish.py --probe 2>&1 | tee /tmp/yt_probe.log
          {
            echo "## YouTube lane probe — $(date -u +%FT%TZ)"
            echo
            echo '```'
            cat /tmp/yt_probe.log
            echo '```'
            echo
            echo 'Nothing was rendered, uploaded or recorded by this run.' >> "$GITHUB_STEP_SUMMARY"
          } >> "$GITHUB_STEP_SUMMARY"

  generate-and-publish:
    name: Generate and publish one Short
    if: github.event.inputs.probe_only != 'true' || github.event_name == 'schedule'

    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      TZ: Africa/Lagos
      DOCOGA_SHOTS: ${{ vars.DOCOGA_SHOTS || 'on' }}   # CC0 photograph behind each Short scene, matched to the narration (tools/shot_match.py)
      # v6 footage doors (tools/stock_media.py) — all free, all optional: an empty secret closes that door
      # and the keyless ones (Wikimedia Commons, Openverse) carry the Short. Pexels pauses new keys (Sep 2026).
      PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
      FLICKR_API_KEY: ${{ secrets.FLICKR_API_KEY }}
      UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
    steps:
      - name: Check out the default branch
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      # MotionStudio renders the Short (tools/motionstudio.py via tools/shorts_reel.py):
      # Inter is the only typeface and ffmpeg is the only encoder. The script ends with
      # `motionstudio.py --check`, so a runner without both fails here, by name, before
      # a token is minted or a frame is drawn.
      - name: Install MotionStudio (ffmpeg + Inter) and the upload dependencies
        run: |
          bash tools/install_motionstudio_deps.sh
          bash tools/install_wordsync_deps.sh   # Vosk word times for kinetic captions (best effort)
          python -m pip install -r requirements-youtube.txt

      - name: Resolve the settings for this run
        id: settings
        env:
          # `PRIVACY="${{ inputs.privacy }}"` would substitute first and expand
          # `$(…)` afterwards, inside the quotes. env: keeps the value out of the
          # command line entirely.
          IN_PRIVACY: ${{ inputs.privacy }}
          IN_YT_PRIVACY: ${{ vars.YT_PRIVACY }}
        run: |
          PRIVACY="$IN_PRIVACY"
          [ -n "$PRIVACY" ] || PRIVACY="$IN_YT_PRIVACY"
          [ -n "$PRIVACY" ] || PRIVACY="public"
          case "$PRIVACY" in
            public|unlisted|private) ;;
            *)
              echo "::error title=Bad privacy setting::'$PRIVACY' is not public/unlisted/private — fix the YT_PRIVACY repository variable."
              exit 1
              ;;
          esac
          echo "privacy=$PRIVACY" >> "$GITHUB_OUTPUT"
          echo "run_date=$(date +%F)" >> "$GITHUB_OUTPUT"
          echo "Privacy for this run: $PRIVACY · WAT date: $(date +%F)"

      # Fail here, before spending ten minutes rendering, and name the secret
      # that is missing. yt_publish.py would also refuse, but only after the
      # render, and its message does not say which one is absent.
      #
      # Then go one step further and *use* the credentials: minting a token
      # costs seconds and proves the client id/secret/refresh token triple is
      # still valid. On 9 Oct 2026 the run rendered the whole Short and only
      # then hit `401 invalid_client — The OAuth client was not found`; this
      # step turns that into a 20-second named failure.
      - name: Preflight — are the YouTube secrets present and usable?
        env:
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          SOCIAL_TOKEN_KEY: ${{ secrets.SOCIAL_TOKEN_KEY }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
        run: |
          set -o pipefail
          {
            missing=""
            [ -n "$YT_REFRESH_TOKEN" ] || missing="$missing YT_REFRESH_TOKEN"
            [ -n "$YT_CLIENT_ID" ]     || missing="$missing YT_CLIENT_ID"
            [ -n "$YT_CLIENT_SECRET" ] || missing="$missing YT_CLIENT_SECRET"
            if [ -n "$missing" ]; then
              echo "::error title=YouTube secrets missing::Set these repository secrets:$missing — nothing was rendered and nothing was published."
              exit 1
            fi
            echo "All three YouTube secrets are present."
            # --probe, not --check-token: a token that mints is not a token that uploads to the
            # channel you think it does. This costs 1 quota unit of the 10,000 a day and puts the
            # channel name in every run log, which is the whole reason the Telegram lane's
            # six-day outage was misread as a permissions problem.
            python3 tools/yt_publish.py --probe
          } 2>&1 | tee /tmp/yt_preflight.log

      # The narrator's clips are cached by text hash, and the quota ledger
      # (assets/shorts_voice/quota.json — what every lane spent today, when the
      # bucket refills) travels in the same cache entry. Every run restores the
      # newest entry and saves its own, so the knowledge is shared across the
      # Shorts, Reels, Deep-Dive and resumer workflows.
      - name: Restore the narrator's cached clips
        uses: actions/cache/restore@v5
        with:
          path: assets/shorts_voice
          key: shorts-voice-v2-${{ github.run_id }}
          restore-keys: shorts-voice-v2-

      - name: Generate today's Short
        id: short
        # GEMINI_API_KEY: the locked Deep-Dive narrator (Orus) reads each scene;
        # tools/shorts_sound.py adds the bed and the effects. SHORTS_VOICE=required
        # (the default): no voice → no Short. The script knows *when* the narrator's
        # free bucket refills (tools/gemini_quota.py) and exits 6 — a pause, not a
        # failure; narrator_resume.yml finishes the job minutes after the reset.
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_TTS_MODEL: ${{ vars.GEMINI_TTS_MODEL }}
          SHORTS_VOICE: ${{ vars.SHORTS_VOICE || 'required' }}
          NARRATOR_LANE: shorts
          RUN_FOR_DATE: ${{ inputs.for_date }}
        run: |
          set -o pipefail
          set +e
          python3 scripts/youtube_short_daily.py 2>&1 | tee /tmp/short.log
          code=${PIPESTATUS[0]}
          set -e
          if [ "$code" -eq 6 ]; then
            echo "paused=yes" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # 7 = nothing fresh to say (24 Oct 2026, owner: "make sure you are not repeating or
          # recycling contents"): every rotation script has been on the channel inside 28 days and
          # the brain, asked once more at the slot, did not approve a new Short. The day is skipped
          # like a narrator pause — no upload, no hand-offs — and the owner is told why below.
          # The script has already written paused=yes, stale=yes and stale_reason to GITHUB_OUTPUT.
          if [ "$code" -eq 7 ]; then
            echo "paused=yes" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Photographs behind the cards (owner, 18 Oct 2026): SHOTS_HITS=<matched>/<scenes>
          # from tools/shorts_reel.py; each miss names its reason above it ("stays navy (…)").
          SHOTS=$(sed -n 's/^SHOTS_HITS=//p' /tmp/short.log | tail -1)
          echo "shots=${SHOTS:-?}" >> "$GITHUB_OUTPUT"
          echo "::notice title=Photographs behind the cards::SHOTS_HITS=${SHOTS:-none reported} — $(grep -c 'stays navy' /tmp/short.log || true) scene(s) stayed navy"
          # v5 (20 Oct 2026): one photograph per spoken sentence with a camera move, and captions lit
          # word by word. WORDSYNC=vosk is the aligned read; estimate means the model was not there.
          TOTAL=$(sed -n 's/^SHOTS_TOTAL=//p' /tmp/short.log | tail -1)
          WS=$(sed -n 's/^WORDSYNC=//p' /tmp/short.log | tail -1)
          # v6: clips first, photographs where no clip exists; SHOTS_DOORS names the doors that were open
          NV=$(sed -n 's/^SHOTS_VIDEO=//p' /tmp/short.log | tail -1)
          NP=$(sed -n 's/^SHOTS_PHOTO=//p' /tmp/short.log | tail -1)
          DOORS=$(sed -n 's/^SHOTS_DOORS=//p' /tmp/short.log | tail -1)
          echo "::notice title=Footage + word-sync::SHOTS_TOTAL=${TOTAL:-?} shots (${NV:-0} clips, ${NP:-0} photographs) · doors ${DOORS:-?} · WORDSYNC=${WS:-none reported}"
          exit "$code"

      - name: Tell the owner the day was skipped, not repeated
        if: steps.short.outputs.stale == 'yes'
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          REASON: ${{ steps.short.outputs.stale_reason }}
          RUN_DATE: ${{ steps.settings.outputs.run_date }}
        run: |
          python3 tools/owner_dm.py send --text "DocOga — no Short today ($RUN_DATE). $REASON Nothing was repeated; the next fresh Short goes out at its usual 7:00pm."
          echo "- **No Short today** — $REASON" >> "$GITHUB_STEP_SUMMARY"

      # What the Short looks like, without downloading it: a labelled contact sheet (frame 0 =
      # the cover every platform shows, then frames across the Short) and the cover JPEG, on
      # the `review` branch (tools/review_push.sh), readable through the contents API.
      - name: Picture the render for review
        id: sheet
        if: always() && steps.short.outputs.video_path != ''
        continue-on-error: true
        env:
          VIDEO_PATH: ${{ steps.short.outputs.video_path }}
          COVER_PATH: ${{ steps.short.outputs.cover_path }}
        run: |
          set -o pipefail
          mkdir -p /tmp/review
          LABEL="$(date -u +%F)_short_${GITHUB_RUN_ID}"
          python3 tools/contact_sheet.py --video "$VIDEO_PATH" --out /tmp/review/sheet.jpg --cover "$COVER_PATH" 2>&1 | tee /tmp/sheet.log
          grep -E '^(SHOTS_HITS|SHOTS_TOTAL|SHOTS_VIDEO|SHOTS_PHOTO|SHOTS_DOORS|WORDSYNC|SHEET_|COVER=|📷|🎬|·)' /tmp/short.log /tmp/sheet.log > /tmp/review/render_report.txt || true
          [ -f "$COVER_PATH" ] && cp "$COVER_PATH" /tmp/review/cover.jpg || true
          REVIEW_LABEL="$LABEL" bash tools/review_push.sh /tmp/review/sheet.jpg /tmp/review/cover.jpg /tmp/review/render_report.txt | tee /tmp/review_push.log
          echo "url=$(sed -n 's/^REVIEW_URL=//p' /tmp/review_push.log | tail -1)" >> "$GITHUB_OUTPUT"
          echo "photo_frames=$(sed -n 's/^SHEET_PHOTO_FRAMES=//p' /tmp/sheet.log | tail -1)" >> "$GITHUB_OUTPUT"

      - name: Save the narrator's cached clips and the quota ledger
        if: always()
        uses: actions/cache/save@v5
        with:
          path: assets/shorts_voice
          key: shorts-voice-v2-${{ github.run_id }}

      - name: Duplicate guard (publish ledger)
        id: guard
        if: steps.short.outputs.paused != 'yes'
        env:
          VIDEO_TITLE: ${{ steps.short.outputs.title }}
          RUN_DATE: ${{ steps.settings.outputs.run_date }}
          FORCE: ${{ inputs.force }}
        run: |
          set +e
          python3 tools/youtube_ledger.py check --title "$VIDEO_TITLE" --date "$RUN_DATE"
          code=$?
          set -e
          if [ "$code" -eq 3 ]; then
            if [ "$FORCE" = "true" ]; then
              echo "skip=no" >> "$GITHUB_OUTPUT"
              echo "::notice title=Duplicate overridden::force=true — \"$VIDEO_TITLE\" is in the ledger inside the duplicate window, but this run was told to publish it anyway."
            else
              echo "skip=yes" >> "$GITHUB_OUTPUT"
              echo "::notice title=Short already published::\"$VIDEO_TITLE\" is already in the ledger inside the duplicate window — nothing was uploaded. Re-run with force=true to publish it anyway."
            fi
          elif [ "$code" -ne 0 ]; then
            exit "$code"
          else
            echo "skip=no" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload to YouTube
        id: upload
        if: steps.guard.outputs.skip != 'yes' && steps.short.outputs.paused != 'yes'
        env:
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          SOCIAL_TOKEN_KEY: ${{ secrets.SOCIAL_TOKEN_KEY }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_CHANNEL_ID: ${{ vars.YT_CHANNEL_ID }}
          VIDEO_PATH: ${{ steps.short.outputs.video_path }}
          VIDEO_TITLE: ${{ steps.short.outputs.title }}
          VIDEO_DESCRIPTION: ${{ steps.short.outputs.description }}
          VIDEO_TAGS: ${{ steps.short.outputs.tags }}
          PRIVACY: ${{ steps.settings.outputs.privacy }}
          # Owner, 17 Oct 2026: a public upload is SCHEDULED — private now, public at the slot
          # (default 19:00 WAT today; the Short renders at 18:00). YT_SCHEDULE=off = publish at once.
          YT_PUBLISH_HOUR_WAT: ${{ vars.YT_PUBLISH_HOUR_WAT }}
          YT_SCHEDULE: ${{ vars.YT_SCHEDULE }}
        run: |
          # The uploader exits 2 for "a human with a browser must fix this" and 1 for "the code
          # or the network failed". Both are red here, but only one is a Google-account
          # conversation, so the run keeps the code and the reason and hands them to the summary
          # and the issue steps below.
          set -o pipefail
          set +e
          python3 tools/yt_publish.py \
            --video "$VIDEO_PATH" \
            --title "$VIDEO_TITLE" \
            --description "$VIDEO_DESCRIPTION" \
            --tags "$VIDEO_TAGS" \
            --privacy "$PRIVACY" 2>&1 | tee /tmp/yt_upload.log
          code=${PIPESTATUS[0]}
          set -e
          marker() { sed -n "s/^$1=//p" /tmp/yt_upload.log | tail -1; }
          VIDEO_ID=$(marker VIDEO_ID)
          RESULT=$(marker YT_UPLOAD_RESULT)
          PRIVACY_SEEN=$(marker YT_PRIVACY)
          PUBLISH_AT=$(marker YT_PUBLISH_AT)
          PUBLISH_AT_WAT=$(marker YT_PUBLISH_AT_WAT)
          STATE=$(marker YT_UPLOAD_STATE)
          NOTE=$(marker YT_NOTE)
          FAIL_KIND=$(marker YT_FAIL_KIND)
          FAIL_REASON=$(marker YT_FAIL_REASON)
          if [ -z "$VIDEO_ID" ]; then
            echo "::error title=No video id::yt_publish.py exited $code without printing VIDEO_ID — refusing to record a publish that cannot be verified. If the bytes did reach Google, a re-run may put a second copy on the channel, so read the channel before retrying."
            exit "${code:-1}"
          fi
          {
            echo "video_id=$VIDEO_ID"
            echo "video_url=https://www.youtube.com/watch?v=$VIDEO_ID"
            echo "result=${RESULT:-uploaded}"
            echo "privacy_seen=${PRIVACY_SEEN:-unknown}"
            echo "publish_at=${PUBLISH_AT:-}"
            echo "publish_at_wat=${PUBLISH_AT_WAT:-}"
            echo "upload_state=${STATE:-unknown}"
            echo "fail_kind=${FAIL_KIND:-none}"
            echo "fail_reason=${FAIL_REASON:-none}"
            echo "note=${NOTE:-}"
            echo "size_bytes=$(stat -c%s "$VIDEO_PATH")"
          } >> "$GITHUB_OUTPUT"
          if [ "$code" -ne 0 ]; then
            echo "::error title=YouTube named the cause (exit $code)::$(grep -m1 -A1 'kind=' /tmp/yt_upload.log | tr '\n' ' ' || true)"
          fi
          exit "$code"
      # always(), plus "there is a video id": a Short YouTube stored as private is still a Short
      # on the channel, and an id that goes unrecorded is an id a re-run will publish twice.
      - name: Record the publish in the ledger
        if: always() && steps.guard.outputs.skip != 'yes' && steps.upload.outputs.video_id != ''
        env:
          VIDEO_TITLE: ${{ steps.short.outputs.title }}
          VIDEO_TOPIC: ${{ steps.short.outputs.topic }}
          VIDEO_ID: ${{ steps.upload.outputs.video_id }}
          VIDEO_URL: ${{ steps.upload.outputs.video_url }}
          SIZE_BYTES: ${{ steps.upload.outputs.size_bytes }}
          PRIVACY: ${{ steps.upload.outputs.privacy_seen || steps.settings.outputs.privacy }}
          STATE: ${{ steps.upload.outputs.result }}
          NOTE: ${{ steps.upload.outputs.note }}
          PUBLISH_AT: ${{ steps.upload.outputs.publish_at }}
          RUN_DATE: ${{ steps.settings.outputs.run_date }}
        run: |
          python3 tools/youtube_ledger.py record \
            --state "${STATE:-uploaded}" \
            --note "${NOTE:-}" \
            --publish-at "${PUBLISH_AT:-}" \
            --title "$VIDEO_TITLE" \
            --topic "$VIDEO_TOPIC" \
            --video-id "$VIDEO_ID" \
            --url "$VIDEO_URL" \
            --privacy "$PRIVACY" \
            --date "$RUN_DATE" \
            --run-id "$GITHUB_RUN_ID" \
            --size-bytes "$SIZE_BYTES"

      # Series playlist + first comment (tools/yt_boost.py, 17 Oct 2026): the playlist earns the
      # "session contribution" YouTube ranks long-form by and is its own search result; the
      # channel's comment carries the Deep-Dive link a Short's player cannot and asks the question
      # that starts the thread. A scheduled Short is private until its slot, so the comment is
      # planned now and posted by the sweep (this lane tomorrow, youtube_boost.yml tonight).
      # ≤160 quota units a video; never fails the publish.
      - name: Playlist + first comment (never fails the publish)
        if: always() && steps.guard.outputs.skip != 'yes' && steps.upload.outputs.video_id != ''
        continue-on-error: true
        env:
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          SOCIAL_TOKEN_KEY: ${{ secrets.SOCIAL_TOKEN_KEY }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          VIDEO_ID: ${{ steps.upload.outputs.video_id }}
          VIDEO_TOPIC: ${{ steps.short.outputs.topic }}
          PINNED_COMMENT: ${{ steps.short.outputs.pinned_comment }}
          SERIES_JSON: ${{ steps.short.outputs.series_json }}
          RUN_DATE: ${{ steps.settings.outputs.run_date }}
        run: |
          # --series (23 Oct 2026): the week's five-part series gets its own playlist, so "Up
          # next" after part 1 is part 2 (tools/series_week.py). Empty on a plain day.
          python3 tools/yt_boost.py plan --video-id "$VIDEO_ID" --kind short --title "$VIDEO_TOPIC" \
            --parent-comment "$PINNED_COMMENT" --date "$RUN_DATE" --series "$SERIES_JSON"
          python3 tools/yt_boost.py run --max 3 2>&1 | tee /tmp/yt_boost.log
      # Never let bookkeeping turn a successful publish red: continue-on-error
      # keeps the job green and leaves a visible warning instead.
      # TikTok: 47.8M Nigerian adults, +43 % in a year (research, 17 Oct 2026). The same Short
      # goes to the owner's TikTok *inbox* as a draft — the only route an unaudited app has
      # that is not forced-private — and the owner posts it from the app with the caption
      # printed in the summary. Dormant (a notice, not a red run) until the three TikTok
      # secrets exist; never allowed to fail the YouTube publish it rides on.
      # The settled hook card as the Short's custom thumbnail (tools/yt_thumbnail.py, ~50 quota
      # units) — the owner does not want "YouTube picks a frame" (and frame 0 is the same card
      # now, so a refusal still leaves the right picture). Never fails the publish.
      - name: Set the Short's thumbnail (never fails the publish)
        id: thumb
        if: always() && steps.upload.outputs.video_id != '' && steps.short.outputs.cover_path != ''
        continue-on-error: true
        env:
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          SOCIAL_TOKEN_KEY: ${{ secrets.SOCIAL_TOKEN_KEY }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          VIDEO_ID: ${{ steps.upload.outputs.video_id }}
          COVER: ${{ steps.short.outputs.cover_path }}
        run: python3 tools/yt_thumbnail.py --video-id "$VIDEO_ID" --image "$COVER"

      - name: Send the Short to the TikTok inbox
        id: tiktok
        if: always() && steps.upload.outputs.video_id != '' && steps.short.outputs.paused != 'yes'
        continue-on-error: true
        env:
          TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
          TIKTOK_REFRESH_TOKEN: ${{ secrets.TIKTOK_REFRESH_TOKEN }}
          SOCIAL_TOKEN_KEY: ${{ secrets.SOCIAL_TOKEN_KEY }}
          VIDEO_PATH: ${{ steps.short.outputs.video_path }}
          VIDEO_TOPIC: ${{ steps.short.outputs.topic }}
          VIDEO_DESCRIPTION: ${{ steps.short.outputs.description }}
          RUN_DATE: ${{ steps.settings.outputs.run_date }}
        run: |
          set -o pipefail
          python3 -m pip install --quiet cryptography >/dev/null 2>&1 || true
          # TikTok's search caption (22 Oct 2026): search phrase first, the spoken hook, the
          # tips, five tags — tools/reel_caption.py. It is recorded in full in
          # logs/tiktok_drafts.json, which the admin dashboard shows with a Copy button.
          printf '%s' "$VIDEO_DESCRIPTION" > /tmp/short_description.txt
          CAPTION=$(python3 tools/reel_caption.py --platform tiktok --topic "$VIDEO_TOPIC" --description-file /tmp/short_description.txt --date "$RUN_DATE")
          python3 tools/tiktok_draft.py send --video "$VIDEO_PATH" --caption "$CAPTION" 2>&1 | tee /tmp/tiktok.log
          RESULT=$(sed -n 's/^TIKTOK_RESULT=//p' /tmp/tiktok.log | tail -1)
          echo "result=${RESULT:-unknown}" >> "$GITHUB_OUTPUT"
          echo "publish_id=$(sed -n 's/^TIKTOK_PUBLISH_ID=//p' /tmp/tiktok.log | tail -1)" >> "$GITHUB_OUTPUT"
          {
            echo "caption<<DOCOGA_EOF"
            printf '%s\n' "$CAPTION"
            echo "DOCOGA_EOF"
          } >> "$GITHUB_OUTPUT"

      # TikTok's inbox API carries no caption (only the audited Direct Post API does), so the
      # caption goes to the owner's phone: a Telegram DM from the channel bot with a tap-to-copy
      # block (tools/owner_dm.py; one-time setup: send the word "owner" to @docoga_daily_bot).
      - name: Text the TikTok caption to the owner's phone
        id: dm
        if: always() && steps.tiktok.outputs.result == 'inbox'
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CAPTION: ${{ steps.tiktok.outputs.caption }}
          VIDEO_TOPIC: ${{ steps.short.outputs.topic }}
        run: |
          set -o pipefail
          python3 tools/owner_dm.py tiktok --caption "$CAPTION" --title "$VIDEO_TOPIC" 2>&1 | tee /tmp/owner_dm.log
          DM=$(sed -n 's/^OWNER_DM=//p' /tmp/owner_dm.log | tail -1)
          echo "result=$DM" >> "$GITHUB_OUTPUT"
          case "$DM" in
            sent|linked|adopted) ;;
            *) echo "::warning title=TikTok caption not texted::the owner has not sent the word 'owner' to @docoga_daily_bot yet — the caption is on the admin dashboard (Social → TikTok caption, Copy) and in logs/tiktok_drafts.json" ;;
          esac

      # The same Short goes into the Telegram channel as a native video (17 Oct 2026): Telegram
      # counts its own views, autoplays, and readers forward the file. Never fatal: a Telegram
      # refusal is a warning on a run whose YouTube upload already succeeded.
      - name: Post the Short to the Telegram channel
        id: telegram
        if: always() && steps.upload.outputs.video_id != '' && steps.short.outputs.paused != 'yes'
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          VIDEO_PATH: ${{ steps.short.outputs.video_path }}
          VIDEO_TITLE: ${{ steps.short.outputs.title }}
          VIDEO_URL: ${{ steps.upload.outputs.video_url }}
          PARENT_URL: ${{ steps.short.outputs.parent_url }}
          PARENT_TITLE: ${{ steps.short.outputs.parent_title }}
          COVER_PATH: ${{ steps.short.outputs.cover_path }}
          SERIES_CHAIN: ${{ steps.short.outputs.series_chain }}
        run: |
          set -o pipefail
          python3 tools/telegram_video.py --video "$VIDEO_PATH" --title "$VIDEO_TITLE" --url "$VIDEO_URL" \
            --parent-url "$PARENT_URL" --parent-title "$PARENT_TITLE" --cover "$COVER_PATH" \
            --series-chain "$SERIES_CHAIN" 2>&1 | tee /tmp/telegram_video.log
          echo "result=$(sed -n 's/^TELEGRAM_VIDEO=//p' /tmp/telegram_video.log | tail -1)" >> "$GITHUB_OUTPUT"

      # Owner, 26 Oct 2026: "I want live stream to always be on for life." The always-on
      # stream (youtube_live.yml, tools/yt_live.py) loops the channel's own episodes, and a
      # Short only ever lived inside this run — so the published file is banked on the
      # `live-library` release as short-<date>.mp4; the next control run (7:05pm) normalises it into
      # loop.json and the Oracle VM picks it up within the half hour.
      # Never fails the publish; DOCOGA_LIVE=off skips the banking too.
      - name: Bank the Short for DocOga Live
        if: always() && steps.upload.outputs.video_id != '' && steps.short.outputs.paused != 'yes' && (vars.DOCOGA_LIVE || 'on') != 'off'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VIDEO_PATH: ${{ steps.short.outputs.video_path }}
          RUN_DATE: ${{ steps.settings.outputs.run_date }}
        run: |
          set -o pipefail
          TAG=live-library
          gh release view "$TAG" >/dev/null 2>&1 || \
            gh release create "$TAG" --prerelease --title "DocOga Live library" \
              --notes "Banked Shorts (short-<date>.mp4) and normalised loop segments (norm-*.mp4) for the always-on stream. Managed by youtube_live.yml."
          cp "$VIDEO_PATH" "/tmp/short-$RUN_DATE.mp4"
          gh release upload "$TAG" "/tmp/short-$RUN_DATE.mp4" --clobber
          echo "- banked for DocOga Live: short-$RUN_DATE.mp4" >> "$GITHUB_STEP_SUMMARY"

      # Owner, 21 Oct 2026: "Threads has never posted videos." Threads fetches video by public
      # URL, and the Short only ever lived inside this run. tools/shorts_handoff.py parks the
      # file in the docoga-pass KV namespace for 30 hours (the Instagram third door, ₦0, ~4 KV
      # writes) and writes the URL to logs/shorts_media.json; the 8:10pm Threads slot posts it
      # as a VIDEO. THREADS_VIDEO=off (repo variable) skips the handoff. Never fails the publish.
      - name: Hand the Short to the Threads evening slot
        id: handoff
        if: always() && steps.upload.outputs.video_id != '' && steps.short.outputs.paused != 'yes' && (vars.THREADS_VIDEO || 'on') != 'off'
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          VIDEO_PATH: ${{ steps.short.outputs.video_path }}
          VIDEO_TITLE: ${{ steps.short.outputs.title }}
          VIDEO_ID: ${{ steps.upload.outputs.video_id }}
          RUN_DATE: ${{ steps.settings.outputs.run_date }}
          SERIES_LINE: ${{ steps.short.outputs.series_line }}
          SERIES_TOPIC: ${{ steps.short.outputs.series_topic }}
        run: |
          set -o pipefail
          python3 tools/shorts_handoff.py host --video "$VIDEO_PATH" --video-id "$VIDEO_ID" \
            --title "$VIDEO_TITLE" --date "$RUN_DATE" --ttl-hours 30 \
            --series "$SERIES_LINE" --series-topic "$SERIES_TOPIC" 2>&1 | tee /tmp/handoff.log
          echo "url=$(sed -n 's/^HANDOFF_URL=//p' /tmp/handoff.log | tail -1)" >> "$GITHUB_OUTPUT"

      # ── The same Short as a Reel, everywhere Reels are the growth surface (21 Oct 2026) ──
      # Owner: "improve more on all my social media … beat the algorithm". What the platforms
      # say on the record (research, 21 Oct 2026): Facebook prefers ORIGINAL Reels in Feed and
      # Reels and saw time spent on them double in H2 2025 (about.fb.com, 13 Mar 2026);
      # Instagram ranks Reels on watch time, likes per reach and SENDS per reach (Mosseri,
      # 22 Jan 2025) and recommends small accounts' originals to non-followers. Our Short is
      # original (our words, our voice, our motion), already Reel-spec (9:16, ≤ 90 s), and
      # until today it travelled only to YouTube, TikTok's inbox, Telegram and Threads. So
      # every weekday Short now also goes out as a Facebook Reel and an Instagram Reel — five
      # extra Reels a week on each, at ₦0, from a file that already exists. Mon/Thu keep their
      # morning Reel (facebook_autopost.yml); the 30-day title ledgers stop a topic going out
      # twice. SHORT_REELS=off (repo variable) switches both steps off. Never fails the publish.
      - name: Facebook Reel — the same Short on the Page
        id: fb_reel
        if: always() && steps.upload.outputs.video_id != '' && steps.short.outputs.paused != 'yes' && (vars.SHORT_REELS || 'on') != 'off'
        continue-on-error: true
        env:
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          VIDEO_PATH: ${{ steps.short.outputs.video_path }}
          VIDEO_TOPIC: ${{ steps.short.outputs.topic }}
          VIDEO_DESCRIPTION: ${{ steps.short.outputs.description }}
          RUN_DATE: ${{ steps.settings.outputs.run_date }}
          LEDGER_LABEL: Facebook reel ledger
        run: |
          set -o pipefail
          if [ -z "$FB_PAGE_ACCESS_TOKEN" ] || [ -z "$FB_PAGE_ID" ]; then
            echo "::notice title=Facebook Reel skipped::FB_PAGE_ACCESS_TOKEN / FB_PAGE_ID are not set in this repository"
            echo "result=dormant" >> "$GITHUB_OUTPUT"; exit 0
          fi
          # The frame law: this topic must not be on the Page as a Reel inside 30 days (the
          # Mon/Thu morning Reel may already have carried it).
          set +e
          python3 tools/youtube_ledger.py --ledger logs/facebook_reels.json check --title "$VIDEO_TOPIC" --date "$RUN_DATE" --window-days 30
          code=$?
          set -e
          if [ "$code" -eq 3 ]; then
            echo "::notice title=Facebook Reel already out::\"$VIDEO_TOPIC\" went out as a Reel inside the last 30 days — nothing uploaded"
            echo "result=duplicate" >> "$GITHUB_OUTPUT"; exit 0
          fi
          printf '%s' "$VIDEO_DESCRIPTION" > /tmp/short_description.txt
          CAPTION=$(python3 tools/reel_caption.py --platform facebook --topic "$VIDEO_TOPIC" --description-file /tmp/short_description.txt --date "$RUN_DATE")
          set +e
          python3 scripts/post_facebook.py --reel="$VIDEO_PATH" --title="$VIDEO_TOPIC" --description="$CAPTION" 2>&1 | tee /tmp/fb_short_reel.log
          STATUS=${PIPESTATUS[0]}
          set -e
          VIDEO_ID=$(sed -n 's/^REEL_VIDEO_ID=//p' /tmp/fb_short_reel.log | tail -1)
          REEL_URL=$(sed -n 's/^REEL_URL=//p' /tmp/fb_short_reel.log | tail -1)
          if [ -z "$VIDEO_ID" ]; then
            if grep -q 'already on the Page today' /tmp/fb_short_reel.log; then
              echo "result=duplicate" >> "$GITHUB_OUTPUT"; exit 0
            fi
            echo "::warning title=Facebook Reel not published::scripts/post_facebook.py exited $STATUS — see the lines above; the YouTube publish is unaffected"
            echo "result=failed" >> "$GITHUB_OUTPUT"; exit 0
          fi
          python3 tools/youtube_ledger.py --ledger logs/facebook_reels.json record \
            --title "$VIDEO_TOPIC" --topic "$VIDEO_TOPIC" --video-id "$VIDEO_ID" --url "$REEL_URL" \
            --date "$RUN_DATE" --run-id "$GITHUB_RUN_ID" --size-bytes "$(stat -c%s "$VIDEO_PATH" 2>/dev/null || echo 0)" \
            || echo "::warning title=Facebook Reel not recorded::the Reel is live but logs/facebook_reels.json was not updated — a re-run inside 30 days could upload it again"
          echo "::notice title=Facebook Reel published::$VIDEO_TOPIC → https://www.facebook.com${REEL_URL}"
          echo "result=sent" >> "$GITHUB_OUTPUT"
          echo "url=https://www.facebook.com${REEL_URL}" >> "$GITHUB_OUTPUT"

      # Instagram: the third door (tools/ig_publish.py --video-url) — Meta fetches the file from
      # the 30-hour URL the Threads hand-over already parked on the worker, so nothing is
      # uploaded twice. Trial Reel on (IG_TRIAL_REELS, default on): shown to non-followers first.
      - name: Instagram Reel — the same Short on @docoga.ng
        id: ig_reel
        if: always() && steps.upload.outputs.video_id != '' && steps.short.outputs.paused != 'yes' && (vars.SHORT_REELS || 'on') != 'off'
        continue-on-error: true
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          SOCIAL_TOKEN_KEY: ${{ secrets.SOCIAL_TOKEN_KEY }}
          IG_TRIAL_REELS: ${{ vars.IG_TRIAL_REELS }}
          IG_COLLABORATORS: ${{ vars.IG_COLLABORATORS }}
          HANDOFF_URL: ${{ steps.handoff.outputs.url }}
          VIDEO_PATH: ${{ steps.short.outputs.video_path }}
          VIDEO_TOPIC: ${{ steps.short.outputs.topic }}
          VIDEO_DESCRIPTION: ${{ steps.short.outputs.description }}
          RUN_DATE: ${{ steps.settings.outputs.run_date }}
          LEDGER_LABEL: Instagram publish ledger
        run: |
          set -o pipefail
          umask 077
          if [ -z "$HANDOFF_URL" ]; then
            echo "::notice title=Instagram Reel skipped::the Short was not parked on the worker (THREADS_VIDEO off or the hand-over failed), so Meta has no URL to fetch it from"
            echo "result=skipped" >> "$GITHUB_OUTPUT"; exit 0
          fi
          python3 -m pip install --quiet cryptography >/dev/null 2>&1 || true
          if [ -f logs/ig_access_token.box ] && python3 tools/token_vault.py open --name IG_ACCESS_TOKEN --out /tmp/ig_token; then
            :
          elif [ -n "$IG_ACCESS_TOKEN" ]; then
            printf '%s' "$IG_ACCESS_TOKEN" > /tmp/ig_token
          else
            echo "::notice title=Instagram Reel skipped::no IG_ACCESS_TOKEN secret and no vault box"
            echo "result=dormant" >> "$GITHUB_OUTPUT"; exit 0
          fi
          set +e
          python3 tools/youtube_ledger.py --ledger logs/instagram_sent.json check --title "Reel · $VIDEO_TOPIC" --date "$RUN_DATE" --window-days 30
          code=$?
          set -e
          if [ "$code" -eq 3 ]; then
            echo "::notice title=Instagram Reel already out::\"$VIDEO_TOPIC\" went out as a Reel on Instagram inside the last 30 days — nothing published"
            echo "result=duplicate" >> "$GITHUB_OUTPUT"; exit 0
          fi
          printf '%s' "$VIDEO_DESCRIPTION" > /tmp/short_description.txt
          CAPTION=$(python3 tools/reel_caption.py --platform instagram --topic "$VIDEO_TOPIC" --description-file /tmp/short_description.txt --date "$RUN_DATE")
          FIRST_COMMENT=$(python3 tools/reel_caption.py --platform instagram --first-comment --description-file /tmp/short_description.txt --date "$RUN_DATE")
          TRIAL="--trial"
          case "$(printf '%s' "${IG_TRIAL_REELS:-on}" | tr '[:upper:]' '[:lower:]')" in 0|false|no|off) TRIAL="" ;; esac
          set +e
          IG_API_PATH=instagram-login IG_ACCESS_TOKEN="$(cat /tmp/ig_token)" \
            python3 tools/ig_publish.py --video-url "$HANDOFF_URL" --caption "$CAPTION" --first-comment "$FIRST_COMMENT" --thumb-offset-ms 0 --wait-url --wait-url-deadline 300 $TRIAL \
            2>&1 | tee /tmp/ig_short_reel.log
          STATUS=${PIPESTATUS[0]}
          set -e
          RESULT=$(sed -n 's/^IG_RESULT=//p' /tmp/ig_short_reel.log | tail -1)
          CAUSE=$(sed -n 's/^IG_CAUSE=//p' /tmp/ig_short_reel.log | tail -1)
          PERMALINK=$(sed -n 's/^IG_PERMALINK=//p' /tmp/ig_short_reel.log | tail -1)
          MEDIA_ID=$(sed -n 's/^IG_MEDIA_ID=//p' /tmp/ig_short_reel.log | tail -1)
          echo "result=${RESULT:-failed}" >> "$GITHUB_OUTPUT"
          echo "url=${PERMALINK}" >> "$GITHUB_OUTPUT"
          if [ "$RESULT" != "sent" ]; then
            echo "::warning title=Instagram Reel not published::IG_RESULT=${RESULT:-?}${CAUSE:+ · cause $CAUSE} (exit $STATUS) — see the lines above; the YouTube publish is unaffected"
            exit 0
          fi
          python3 tools/youtube_ledger.py --ledger logs/instagram_sent.json record \
            --title "Reel · $VIDEO_TOPIC" --topic "$VIDEO_TOPIC" --video-id "${MEDIA_ID:-unknown}" --url "$PERMALINK" \
            --date "$RUN_DATE" --run-id "$GITHUB_RUN_ID" --size-bytes "$(stat -c%s "$VIDEO_PATH" 2>/dev/null || echo 0)" \
            || echo "::warning title=Instagram Reel not recorded::the Reel is live but logs/instagram_sent.json was not updated — a re-run inside 30 days could publish it again"
          echo "::notice title=Instagram Reel published::$VIDEO_TOPIC → ${PERMALINK:-(no permalink reported)}"

      # The same Short in both Stories trays (22 Oct 2026). Stories sit at the top of the app
      # through the 7–9pm peak and are the one surface where a link sticker is tappable; the
      # Mon/Thu morning Reel already does this on Facebook (facebook_autopost.yml). Never fails
      # the publish; the same SHORT_REELS switch.
      - name: Facebook Story — the Short in the tray
        id: fb_story
        if: always() && steps.upload.outputs.video_id != '' && steps.short.outputs.paused != 'yes' && (vars.SHORT_REELS || 'on') != 'off'
        continue-on-error: true
        env:
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          VIDEO_PATH: ${{ steps.short.outputs.video_path }}
        run: |
          set -o pipefail
          if [ -z "$FB_PAGE_ACCESS_TOKEN" ] || [ -z "$FB_PAGE_ID" ]; then
            echo "result=dormant" >> "$GITHUB_OUTPUT"; exit 0
          fi
          set +e
          python3 scripts/facebook_story_daily.py --slot video --video="$VIDEO_PATH" 2>&1 | tee /tmp/fb_short_story.log
          STATUS=${PIPESTATUS[0]}
          set -e
          if [ "$STATUS" -eq 0 ]; then echo "result=sent" >> "$GITHUB_OUTPUT"; else
            echo "::warning title=Facebook Story not posted::scripts/facebook_story_daily.py exited $STATUS — see the lines above; the publish is unaffected"
            echo "result=failed" >> "$GITHUB_OUTPUT"; fi

      - name: Instagram Story — the Short in the tray
        id: ig_story
        if: always() && steps.ig_reel.outputs.result == 'sent'
        continue-on-error: true
        env:
          HANDOFF_URL: ${{ steps.handoff.outputs.url }}
        run: |
          set -o pipefail
          set +e
          IG_API_PATH=instagram-login IG_ACCESS_TOKEN="$(cat /tmp/ig_token)" \
            python3 tools/ig_publish.py --story-video-url "$HANDOFF_URL" --wait-url --wait-url-deadline 120 \
            2>&1 | tee /tmp/ig_short_story.log
          set -e
          RESULT=$(sed -n 's/^IG_RESULT=//p' /tmp/ig_short_story.log | tail -1)
          echo "result=${RESULT:-failed}" >> "$GITHUB_OUTPUT"
          [ "$RESULT" = "sent" ] || echo "::warning title=Instagram Story not posted::IG_RESULT=${RESULT:-?} — see the lines above; the Reel and the publish are unaffected"

      - name: Commit the publish ledger
        if: steps.guard.outputs.skip != 'yes' && steps.short.outputs.paused != 'yes'
        continue-on-error: true
        env:
          RUN_DATE: ${{ steps.settings.outputs.run_date }}
          BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if ! git pull --rebase --autostash origin "$BRANCH"; then
            echo "::warning title=Ledger not committed::could not rebase on $BRANCH. The Short is published; this run is simply not recorded, so a re-run could publish it again."
            exit 1
          fi
          git add logs/youtube_published.json
          # One path at a time, each only if it exists: `git add a b c` with one missing path adds
          # nothing at all (22 Oct 2026 — logs/telegram_owner.json never existed, so the TikTok
          # drafts, the Threads hand-over record and last night's Instagram Reel were never
          # committed; Threads never found a Short to carry).
          # brain/drafts + logs/brain_said.json: when the brain wrote today's Short at the slot
          # (scripts/youtube_short_daily.py fresh_or_nothing), the pack must reach main so the
          # evening lanes and tonight's brain run see it.
          for path in logs/youtube_boosts.json logs/tiktok_drafts.json logs/tiktok_refresh_token.box logs/telegram_owner.json logs/shorts_media.json logs/facebook_reels.json logs/instagram_sent.json brain/drafts logs/brain_said.json logs/brain_refused.json; do
            if [ -e "$path" ]; then git add -f "$path"; fi
          done
          if git diff --staged --quiet; then
            echo "Ledger unchanged — nothing to commit."
            exit 0
          fi
          git commit -m "Auto: record YouTube Short published $RUN_DATE [skip ci]"
          if ! git push origin "HEAD:$BRANCH"; then
            echo "::warning title=Ledger not pushed::the Short is published but the ledger entry did not reach $BRANCH — a re-run could publish it again."
            exit 1
          fi

      - name: Write the run summary
        if: always()
        env:
          RUN_DATE: ${{ steps.settings.outputs.run_date }}
          PRIVACY: ${{ steps.settings.outputs.privacy }}
          TOPIC: ${{ steps.short.outputs.topic }}
          TITLE: ${{ steps.short.outputs.title }}
          VIDEO_PATH: ${{ steps.short.outputs.video_path }}
          VIDEO_URL: ${{ steps.upload.outputs.video_url }}
          VIDEO_ID: ${{ steps.upload.outputs.video_id }}
          RESULT: ${{ steps.upload.outputs.result }}
          PRIVACY_SEEN: ${{ steps.upload.outputs.privacy_seen }}
          PUBLISH_AT_WAT: ${{ steps.upload.outputs.publish_at_wat }}
          UPLOAD_STATE: ${{ steps.upload.outputs.upload_state }}
          NOTE: ${{ steps.upload.outputs.note }}
          SKIP: ${{ steps.guard.outputs.skip }}
          PARENT_URL: ${{ steps.short.outputs.parent_url }}
          PINNED_COMMENT: ${{ steps.short.outputs.pinned_comment }}
          PAUSED: ${{ steps.short.outputs.paused }}
          STALE: ${{ steps.short.outputs.stale }}
          STALE_REASON: ${{ steps.short.outputs.stale_reason }}
          VOICE_REASON: ${{ steps.short.outputs.voice_reason }}
          VOICE_RESUMES_AT: ${{ steps.short.outputs.voice_resumes_at }}
          SOUNDTRACK: ${{ steps.short.outputs.soundtrack }}
          NARRATOR: ${{ steps.short.outputs.narrator }}
          TIKTOK_RESULT: ${{ steps.tiktok.outputs.result }}
          FB_REEL_RESULT: ${{ steps.fb_reel.outputs.result }}
          FB_REEL_URL: ${{ steps.fb_reel.outputs.url }}
          IG_REEL_RESULT: ${{ steps.ig_reel.outputs.result }}
          IG_REEL_URL: ${{ steps.ig_reel.outputs.url }}
          FB_STORY_RESULT: ${{ steps.fb_story.outputs.result }}
          IG_STORY_RESULT: ${{ steps.ig_story.outputs.result }}
          TIKTOK_PUBLISH_ID: ${{ steps.tiktok.outputs.publish_id }}
          TIKTOK_CAPTION: ${{ steps.tiktok.outputs.caption }}
          DM: ${{ steps.dm.outputs.result }}
          SHOTS: ${{ steps.short.outputs.shots }}
          COVER_PATH: ${{ steps.short.outputs.cover_path }}
          THUMB: ${{ steps.thumb.outcome }}
          REVIEW_URL: ${{ steps.sheet.outputs.url }}
          PHOTO_FRAMES: ${{ steps.sheet.outputs.photo_frames }}
        run: |
          RUN_DATE="${RUN_DATE:-$(date +%F)}"
          {
            echo "## DocOga Short — $RUN_DATE"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| Topic | ${TOPIC:-not rendered} |"
            echo "| Title | ${TITLE:-—} |"
            echo "| Privacy | ${PRIVACY:-—} |"
            if [ "$STALE" = "yes" ]; then
              echo "| Result | ⏭️ No Short today — nothing fresh to say, and a repeat is not a post. $STALE_REASON |"
            elif [ "$PAUSED" = "yes" ]; then
              echo "| Result | ⏸️ Paused — no voice, no Short. $VOICE_REASON |"
              echo "| Resumes | ${VOICE_RESUMES_AT:-at the next Pacific midnight} — the narrator-resume workflow publishes it then; nothing to press |"
            elif [ "$SKIP" = "yes" ]; then
              echo "| Result | ⏭️ Skipped — this title is already in the publish ledger |"
            elif [ -n "$VIDEO_ID" ]; then
              # "Published" is reserved for what the read-back confirmed. A run that prints a tick
              # for a video sitting private on the channel is how a lane stays green and an
              # audience stays empty.
              if [ "$RESULT" = "published" ]; then
                echo "| Result | ✅ Published (public) |"
              elif [ "$RESULT" = "scheduled" ]; then
                echo "| Result | 🗓 Scheduled — YouTube makes it public at **${PUBLISH_AT_WAT:-the slot}** (Studio shows it as Scheduled until then) |"
              else
                echo "| Result | ⚠️ On the channel as \`$RESULT\` — privacy \`$PRIVACY_SEEN\`, uploadStatus \`$UPLOAD_STATE\` |"
                [ -n "$NOTE" ] && echo "| Why | $NOTE |"
              fi
              echo "| Link | $VIDEO_URL |"
              echo "| Size | $(stat -c%s "$VIDEO_PATH" 2>/dev/null || echo '?') bytes |"
            else
              echo "| Result | ❌ Failed — see the failing step above |"
            fi
            if [ -n "$VIDEO_PATH" ]; then
              echo "| Cover | $( [ -n "$COVER_PATH" ] && echo "🖼 the settled title card (frame 0 everywhere; YouTube thumbnail: ${THUMB:-not attempted})" || echo '⚠️ no cover file was written' ) |"
              echo "| Photos behind the cards | 📷 ${SHOTS:-?} scenes matched a CC0 photograph; ${PHOTO_FRAMES:-?} sampled frames read as photographed |"
              [ -n "$REVIEW_URL" ] && echo "| Review | [contact sheet + cover]($REVIEW_URL) |"
            fi
            case "$TIKTOK_RESULT" in
              inbox)
                echo "| TikTok | 📥 In your TikTok inbox (draft \`$TIKTOK_PUBLISH_ID\`) — open TikTok → Inbox → the upload notification → Post → paste the caption → Post |"
                case "$DM" in
                  sent)    echo "| TikTok caption | 📲 sent to your Telegram as a tap-to-copy message |" ;;
                  unknown) echo "| TikTok caption | \`${TIKTOK_CAPTION//$'\n'/ ⏎ }\` — tap **Copy** on the admin dashboard (Social → TikTok caption); to get it as a Telegram DM next time: open Telegram → @docoga_daily_bot → Start → send the word **owner** |" ;;
                  *)       echo "| TikTok caption | \`${TIKTOK_CAPTION//$'\n'/ ⏎ }\` — also on the admin dashboard with a Copy button |" ;;
                esac ;;
              dormant)   echo "| TikTok | 💤 Not connected — three secrets (docs/TIKTOK_AUTOMATION.md) and every Short also lands in your TikTok inbox |" ;;
              duplicate|skipped) echo "| TikTok | ⏭️ $TIKTOK_RESULT — see the TikTok step |" ;;
              "") : ;;
              *)         echo "| TikTok | ⚠️ $TIKTOK_RESULT — see the TikTok step; the YouTube publish is unaffected |" ;;
            esac
            case "$FB_REEL_RESULT" in
              sent)      echo "| Facebook Reel | ✅ the same Short is on the Page — $FB_REEL_URL |" ;;
              duplicate) echo "| Facebook Reel | ⏭️ this topic was a Reel on the Page inside 30 days — not repeated |" ;;
              dormant)   echo "| Facebook Reel | 💤 Page secrets not set |" ;;
              "") : ;;
              *)         echo "| Facebook Reel | ⚠️ $FB_REEL_RESULT — see the Facebook Reel step; the YouTube publish is unaffected |" ;;
            esac
            case "$IG_REEL_RESULT" in
              sent)      echo "| Instagram Reel | ✅ the same Short is on @docoga.ng — ${IG_REEL_URL:-permalink not reported} |" ;;
              duplicate) echo "| Instagram Reel | ⏭️ this topic was a Reel on Instagram inside 30 days — not repeated |" ;;
              skipped)   echo "| Instagram Reel | ⏭️ no hosted URL this run (see the Threads hand-over step) |" ;;
              dormant)   echo "| Instagram Reel | 💤 Instagram token not set |" ;;
              "") : ;;
              *)         echo "| Instagram Reel | ⚠️ $IG_REEL_RESULT — see the Instagram Reel step; the YouTube publish is unaffected |" ;;
            esac
            [ -n "$FB_STORY_RESULT" ] && echo "| Facebook Story | $([ "$FB_STORY_RESULT" = sent ] && echo '✅ the Short is in the Page tray for 24 hours' || echo "⚠️ $FB_STORY_RESULT — see the Facebook Story step") |"
            [ -n "$IG_STORY_RESULT" ] && echo "| Instagram Story | $([ "$IG_STORY_RESULT" = sent ] && echo '✅ the Short is in the @docoga.ng tray for 24 hours' || echo "⚠️ $IG_STORY_RESULT — see the Instagram Story step") |"
            [ -n "$SOUNDTRACK" ] && echo "| Soundtrack | $SOUNDTRACK |"
            [ -n "$NARRATOR" ] && echo "| Narrator | $NARRATOR |"
            echo "| Ledger | \`logs/youtube_published.json\` |"
            echo "| Diagnosis | dispatch this workflow with \`probe_only=true\` to re-check credentials without uploading |"
            if [ -n "$PARENT_URL" ]; then
              echo "| Parent Deep-Dive | $PARENT_URL (linked in the description) |"
              echo "| Related video (one Studio tap) | YouTube Studio app → this Short → Edit → **Related video** → pick the Deep-Dive above. No API can set it (Oct 2026); it is the button under the Short that sends a finished viewer to the long-form. |"
              echo
              echo "**Pin this comment from the YouTube app** (the uploader token cannot post comments):"
              echo
              echo '```'
              echo "$PINNED_COMMENT"
              echo '```'
            else
              echo "| Parent Deep-Dive | not published yet — the link appears automatically once the Deep-Dive lane uploads it |"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      # A red run in a repo nobody opens is the same as silence. This makes the
      # failure land where the owner will actually see it.
      - name: Open a visible issue if the run failed
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RUN_DATE: ${{ steps.settings.outputs.run_date }}
          TITLE: ${{ steps.short.outputs.title }}
          VIDEO_ID: ${{ steps.upload.outputs.video_id }}
          VIDEO_URL: ${{ steps.upload.outputs.video_url }}
          RESULT: ${{ steps.upload.outputs.result }}
          PRIVACY_SEEN: ${{ steps.upload.outputs.privacy_seen }}
          FAIL_KIND: ${{ steps.upload.outputs.fail_kind }}
          FAIL_REASON: ${{ steps.upload.outputs.fail_reason }}
          NOTE: ${{ steps.upload.outputs.note }}
        run: |
          RUN_DATE="${RUN_DATE:-$(date +%F)}"
          # A hedge in the first line of a failure issue is a morning wasted checking the channel
          # by hand. The uploader prints an id only for bytes Google accepted, so the id decides
          # what the issue says — and "re-run it" is only safe advice when nothing was uploaded.
          if [ -n "$VIDEO_ID" ]; then
            STATE_LINE="**A video exists**: $VIDEO_URL — reported state \`$RESULT\`, privacy \`$PRIVACY_SEEN\`. Do NOT re-run before deciding, or the channel gets a second copy."
          else
            STATE_LINE="**Nothing was published by this run** — no video id came back, so a re-run is safe."
          fi
          gh label create youtube-automation --color FF5A5F \
            --description "Unattended YouTube Shorts pipeline" >/dev/null 2>&1 || true
          cat > /tmp/issue_body.md <<BODY
          The unattended Shorts run for **$RUN_DATE** failed.

          - Run: $RUN_URL
          - Intended title: ${TITLE:-unknown — the render may not have run}
          - $STATE_LINE
          - Cause named by the uploader: \`${FAIL_KIND:-unknown}/${FAIL_REASON:-unknown}\`${NOTE:+ — $NOTE}

          ### What the credential probe said

          The probe runs on every scheduled run (1 quota unit) and names the channel the token
          actually authorises, so "wrong account" and "wrong secret" are never confused again.

          \`\`\`
          $(if [ -f /tmp/yt_preflight.log ]; then tail -n 25 /tmp/yt_preflight.log; else echo "(no preflight log — see the run)"; fi)
          \`\`\`

          ### What the uploader said

          \`\`\`
          $(if [ -f /tmp/yt_upload.log ]; then tail -n 40 /tmp/yt_upload.log; else echo "(the uploader never ran — the preflight stopped this run)"; fi)
          \`\`\`

          ### Reading it

          The log line above already carries a \`fix:\` sentence; this is the table it is built
          from (\`tools/yt_publish.py\`, \`REASONS\`).

          | kind | what it means | the repair |
          |---|---|---|
          | \`credentials\` | the refresh token or the client is dead | Re-run the consent flow, then update \`YT_REFRESH_TOKEN\`. **If the OAuth consent screen is still "In testing", Google expires refresh tokens after 7 days** — publish the app to Production, or add this Google account as a test user, or it dies again next week. \`invalid_client\` means the client itself was deleted: recreate it and replace all three secrets together. |
          | \`quota\` | the project or channel hit an upload cap | \`videos.insert\` costs 1 unit of a 100-a-day Video Uploads bucket, so this lane alone (2 uploads a week) cannot spend it — look for another user of the same client, then request more quota. |
          | \`forbidden\` | YouTube refuses this channel | Check for a strike, a suspended status, or a channel without a verified phone number. |
          | \`state\` | the upload landed but is not public | YouTube stored it as \`$PRIVACY_SEEN\` although the run asked for the configured privacy. Usually the channel's "uploads default to private" setting: publish that video by hand once, or set \`YT_PRIVACY=unlisted\` and let the lane keep working. |
          | \`metadata\` | a template produced something Google rejects | The \`fix:\` line names the field. Titles over 100 characters and tags over 500 combined are already clamped in the uploader, so a 400 here is something else. |
          | \`transport\` | the request never completed | Safe to re-run: no id means no video. A pattern here is the runner's network or Google's edge, not this code. |

          Two claims this template used to make and no longer does: unverified API projects do
          **not** have their uploads forced private (Google's \`videos.insert\` page says so
          explicitly), and "roughly six uploads a day" is stale arithmetic from an old 1,600-unit
          quota cost that \`videos.insert\` no longer charges.

          The channel's own history is the ledger: \`logs/youtube_published.json\`. To re-check the
          credentials without uploading anything:

          \`\`\`
          gh workflow run youtube_scheduled.yml -f probe_only=true
          \`\`\`

          To publish over a duplicate once the cause is fixed:

          \`\`\`
          gh workflow run youtube_scheduled.yml -f force=true
          \`\`\`
          BODY
          # This lane used to file a fresh issue on every failed run, which on a Tuesday-and-
          # Friday schedule is 8 issues a month for one un-published OAuth consent screen. The
          # uploader already classifies every failure into a `kind`, so the kind is the title's
          # tag and the dedupe key: one open issue per cause, each later failure a comment on it
          # with its own run link. `credentials` is the case that needs a browser, and the title
          # says so before the inbox does.
          CAUSE="${FAIL_KIND:-run}"
          [ "$CAUSE" = none ] && CAUSE=run

          # Newest match wins (`max`), so the untagged `#12` from 9 Oct absorbs today's comment
          # only until a tagged issue exists — then that one does, and the old pair stops growing.
          EXISTING=$(CAUSE_TAG="[$CAUSE]" LEGACY_PREFIX="YouTube Shorts publish failed — " \
            gh issue list --label youtube-automation --state open --limit 100 --json number,title \
            --jq "[.[] | select((.title | contains(\$ENV.CAUSE_TAG)) or ((.title | contains(\$ENV.LEGACY_PREFIX)) and (.title | contains(\"[\") | not))) | .number] | max // empty")
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body-file /tmp/issue_body.md || true
            echo "Same cause as issue #$EXISTING — commented instead of filing a second one"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" \
              --title "YouTube Shorts publish failed — $RUN_DATE [$CAUSE]" \
              --body-file /tmp/issue_body.md \
              --label youtube-automation || echo "::warning title=Issue not created::could not open the failure issue; the run log still has the cause"
          fi
