# Deploy the MARKETING SITE (docoga-git) directly with the API token.
#
# Why this exists: Cloudflare's "Workers Builds: docoga-git" check has been
# failing, and it publishes no error text (output.text is null; the dashboard
# link is not reachable from CI). A failing build does not take the site down —
# it just means the site stops receiving updates, which is worse in the long
# run because it fails silently.
#
# docoga-git is a Worker with static assets (confirmed via
# GET /accounts/{id}/workers/scripts: has_assets true, has_modules false), not
# a Pages project, so plain `wrangler deploy` at the repo root is the correct
# tool. It reads the root wrangler.jsonc, which pins assets.directory to
# ./site. That pin is a security setting — it is what keeps PLAN.md, worker/
# and unlock-codes.txt from being published — and must never be relaxed.
#
# Gated on a commit-message marker so it can never fire accidentally.

name: Deploy site

on:
  push:
    branches: ['**']

jobs:
  deploy-site:
    name: Deploy site as docoga-git
    if: ${{ contains(github.event.head_commit.message, '[deploy-site]') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Needed to post the deploy log as a PR comment — the agent cannot read
      # run logs through the results-receiver host.
      issues: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Deploy and report in ONE step: passing a temp path between steps via
      # GITHUB_ENV proved unreliable, and collapsing it removes that variable.
      - name: Deploy docoga-git from ./site and report
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -u
          LOG=site-deploy.log
          : > "$LOG"

          # Explicit config: without it wrangler can pick up a neighbouring
          # config and deploy the wrong project.
          set +e
          npx --yes wrangler@latest deploy --config wrangler.jsonc \
            > >(tee -a "$LOG") 2>&1
          DEXIT=$?
          set -e
          echo "deploy_exit=$DEXIT" | tee -a "$LOG"

          {
            echo '<!-- deploy-site-log -->'
            echo '## docoga-git site deploy'
            echo
            echo "Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo '```'
            sed -e 's/\x1b\[[0-9;]*m//g' "$LOG" | tail -40
            echo '```'
          } > site-report.md

          CID=$(gh api "repos/$GITHUB_REPOSITORY/issues/11/comments" \
                  --jq '.[]|select(.body|startswith("<!-- deploy-site-log -->"))|.id' \
                  | head -1)
          # -f body=@file reads the file as a form value; --input would be
          # parsed as a JSON request body, which is not what this endpoint wants.
          if [ -n "${CID:-}" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$CID" \
              -f body=@site-report.md > /dev/null
          else
            gh api -X POST "repos/$GITHUB_REPOSITORY/issues/11/comments" \
              -f body=@site-report.md > /dev/null
          fi
          echo "posted report (existing comment id: ${CID:-none})"
