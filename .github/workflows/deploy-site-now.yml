# Deploy the MARKETING SITE (docoga-git) directly with the API token.
#
# Why this exists: Cloudflare's "Workers Builds: docoga-git" check has been
# failing since session 25, and it publishes no error text (output.text is
# null; the dashboard link is not reachable from CI). A failing build does not
# take the site down — it just means the site stops receiving updates, which is
# worse in the long run because it fails silently.
#
# docoga-git is a Worker with static assets (confirmed via
# GET /accounts/{id}/workers/scripts: has_assets true, has_modules false), not
# a Pages project, so plain `wrangler deploy` at the repo root is the correct
# tool. It reads the root wrangler.jsonc, which pins assets.directory to
# ./site. That pin is a security setting — it is what keeps PLAN.md, worker/
# and unlock-codes.txt from being published — and must never be relaxed.
#
# Gated on a commit-message marker so it can never fire accidentally.

name: Deploy site

on:
  push:
    branches: ['**']

jobs:
  deploy-site:
    name: Deploy site as docoga-git
    if: ${{ contains(github.event.head_commit.message, '[deploy-site]') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Deploy docoga-git from ./site
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -u
          # Explicit config: without it wrangler can pick up a neighbouring
          # config and deploy the wrong project.
          npx --yes wrangler@latest deploy --config wrangler.jsonc
