# Deploy the MARKETING SITE (docoga-git) directly with the API token.
#
# Why this exists: Cloudflare's "Workers Builds: docoga-git" check has been
# failing since session 25, and it publishes no error text (output.text is
# null; the dashboard link is not reachable from CI). A failing build does not
# take the site down — it just means the site stops receiving updates, which is
# worse in the long run because it fails silently.
#
# docoga-git is a Worker with static assets (confirmed via
# GET /accounts/{id}/workers/scripts: has_assets true, has_modules false), not
# a Pages project, so plain `wrangler deploy` at the repo root is the correct
# tool. It reads the root wrangler.jsonc, which pins assets.directory to
# ./site. That pin is a security setting — it is what keeps PLAN.md, worker/
# and unlock-codes.txt from being published — and must never be relaxed.
#
# Gated on a commit-message marker so it can never fire accidentally.

name: Deploy site

on:
  push:
    branches: ['**']

jobs:
  deploy-site:
    name: Deploy site as docoga-git
    if: ${{ contains(github.event.head_commit.message, '[deploy-site]') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Deploy docoga-git from ./site
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DEPLOY_LOG: ${{ runner.temp }}/site-deploy.log
        run: |
          set -u
          # Explicit config: without it wrangler can pick up a neighbouring
          # config and deploy the wrong project.
          npx --yes wrangler@latest deploy --config wrangler.jsonc \
            > >(tee -a "$DEPLOY_LOG") 2>&1
          echo "deploy_exit=$?" | tee -a "$DEPLOY_LOG"
          echo "DEPLOY_LOG=$DEPLOY_LOG" >> "$GITHUB_ENV"

      # gh run view --log cannot reach the results-receiver host from this
      # sandbox, so post the output where it can be read via the issues API.
      - name: Report the deploy result
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEPLOY_LOG: ${{ env.DEPLOY_LOG }}
        run: |
          set -u
          {
            echo '<!-- deploy-site-log -->'
            echo '## docoga-git site deploy'
            echo
            echo "Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo '```'
            sed -e 's/\x1b\[[0-9;]*m//g' "$DEPLOY_LOG" 2>/dev/null | tail -40 || echo "(no log)"
            echo '```'
          } > /tmp/site-report.md
          BODY=$(cat /tmp/site-report.md)
          CID=$(gh api "repos/$GITHUB_REPOSITORY/issues/11/comments" \
                  --jq '.[]|select(.body|startswith("<!-- deploy-site-log -->"))|.id' | head -1)
          if [ -n "${CID:-}" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$CID" -f body="$BODY" > /dev/null
          else
            gh api -X POST "repos/$GITHUB_REPOSITORY/issues/11/comments" -f body="$BODY" > /dev/null
          fi
