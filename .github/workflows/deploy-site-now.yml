# Deploy the MARKETING SITE (docoga-git) directly with the API token.
#
# Why this exists: Cloudflare's "Workers Builds: docoga-git" check has been
# failing, and it publishes no error text (output.text is null; the dashboard
# link is not reachable from CI). A failing build does not take the site down —
# it just means the site stops receiving updates, which is worse in the long
# run because it fails silently.
#
# docoga-git is a Worker with static assets (confirmed via
# GET /accounts/{id}/workers/scripts: has_assets true, has_modules false), not
# a Pages project, so plain `wrangler deploy` at the repo root is the correct
# tool. It reads the root wrangler.jsonc, which pins assets.directory to
# ./site. That pin is a security setting — it is what keeps PLAN.md, worker/
# and unlock-codes.txt from being published — and must never be relaxed.
#
# Gated on a commit-message marker so it can never fire accidentally.

name: Deploy site

on:
  push:
    branches: ['**']

jobs:
  deploy-site:
    name: Deploy site as docoga-git
    if: ${{ contains(github.event.head_commit.message, '[deploy-site]') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Needed to post the deploy log — the agent cannot read run logs through
      # the results-receiver host. Issue 11 is a Pull Request, so this must be
      # pull-requests: write; issues: write does not cover PR comments and the
      # reporting step fails with it.
      pull-requests: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Deploy docoga-git from ./site
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -u
          # Written into the workspace so the next step can read it.
          npx --yes wrangler@latest deploy --config wrangler.jsonc \
            > >(tee site-deploy.log) 2>&1

      # Uses actions/github-script rather than the gh CLI: the shell step kept
      # failing here, while this same script pattern reliably posts the
      # docoga-pass log from deploy-pass-now.yml.
      - name: Report the deploy result
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- deploy-site-log -->';
            let body = marker + '\n## docoga-git site deploy\n\n';
            body += `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}\n\n`;
            try {
              const log = fs.readFileSync('site-deploy.log', 'utf8');
              // Strip ANSI colour codes so the comment reads as plain text.
              body += '```\n' + log.replace(/\u001b\[[0-9;]*m/g, '').slice(-14000) + '\n```\n';
            } catch (e) {
              body += '(no deploy log captured)\n';
            }
            const ISSUE = 11;
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner, repo: context.repo.repo, issue_number: ISSUE,
            });
            const existing = comments.find(c => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner, repo: context.repo.repo,
                comment_id: existing.id, body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: ISSUE, body,
              });
            }
