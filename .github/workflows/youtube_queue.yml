name: YouTube Upload from Queue
on:
  workflow_dispatch: {}

# Needs contents:write — this workflow commits and pushes an updated
# youtube_queue.json / generated content back to the repo. Without it the
# push fails 403 on repos whose default GITHUB_TOKEN is read-only.
permissions:
  contents: write
jobs:
  upload:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      # An empty queue is a normal state (the scheduler is deliberately disarmed
      # between uploads). Skip cleanly with a visible notice instead of failing —
      # an empty queue previously produced a red run and a misleading
      # "Add videos to youtube_queue.json" error. Mirrors youtube_scheduled.yml.
      - name: Check queue
        id: check
        run: |
          COUNT=$(python3 -c "import json; print(len(json.load(open('youtube_queue.json'))))")
          echo "count=$COUNT" >> $GITHUB_OUTPUT
          if [ "$COUNT" = "0" ]; then
            echo "::notice title=Queue is empty::youtube_queue.json holds no videos — nothing to upload. Copy an entry back from youtube_queue.pending.json to arm an upload."
          else
            echo "Queue has $COUNT videos"
          fi

      - name: Set up Python
        if: steps.check.outputs.count != '0'
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        if: steps.check.outputs.count != '0'
        run: pip install requests

      - name: Read queue and upload
        if: steps.check.outputs.count != '0'
        env:
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
        run: |
          python3 -c "
          import json, subprocess, sys

          with open('youtube_queue.json') as f:
              queue = json.load(f)

          if not queue:
              print('❌ Queue is empty! Add videos to youtube_queue.json')
              sys.exit(1)

          # Pop first video from queue
          item = queue.pop(0)
          video = item['video_path']
          title = item['title']
          desc = item.get('description', '')
          tags = item.get('tags', '')
          privacy = item.get('privacy', 'public')

          print(f'📹 Uploading: {title}')
          print(f'   File: {video}')
          print(f'   Privacy: {privacy}')

          # Upload
          result = subprocess.run([
              'python3', 'tools/yt_publish.py',
              '--video', video,
              '--title', title,
              '--description', desc,
              '--tags', tags,
              '--privacy', privacy,
          ], capture_output=True, text=True)

          print(result.stdout)
          if result.returncode != 0:
              print(result.stderr)
              sys.exit(1)

          # Save updated queue
          with open('youtube_queue.json', 'w') as f:
              json.dump(queue, f, indent=2)
          print(f'✅ Queue updated. {len(queue)} videos remaining.')
          "

      - name: Commit queue update
        if: steps.check.outputs.count != '0'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add youtube_queue.json
          git diff --staged --quiet || git commit -m "Auto: remove uploaded video from queue"
          git push