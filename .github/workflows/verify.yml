name: Verify

# Authoritative pre-push gate. Runs the same checks as tools/pre-push, but in
# CI where they cannot be bypassed with --no-verify and cannot be skipped by a
# fresh clone that never installed the hook.
#
# This exists because tools/pre_push_verify.sh was broken (it tested file
# existence with `git ls-tree`, which exits 0 for missing paths) AND was never
# wired to anything, so nothing stopped a force-push that orphaned 124 commits.

on:
  push:
  pull_request:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  verify:
    name: QA + repo integrity
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v4
        with:
          # pre_push_verify.sh compares against origin/main, so the full
          # history and the main ref must be present.
          fetch-depth: 0

      - name: Make origin/main available for the history-safety check
        run: |
          git fetch --no-tags --force origin main:refs/remotes/origin/main || \
            echo "::warning::could not fetch origin/main; history check will warn"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install YouTube automation test dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-dejavu-core
          # PyYAML is for the workflow contract tests (tools/tests/test_workflow_contract.py).
          # Pillow draws the social card, and cryptography is what makes tools/token_vault.py's
          # tests run here at all — without it they `skipUnless` away, and the code that keeps the
          # Meta tokens alive would be tested on no machine but a laptop.
          python -m pip install requests 'Pillow>=10,<13' 'PyYAML>=6,<7' 'cryptography>=41'

      - name: YouTube automation regression tests
        run: python3 -m unittest discover -s tools/tests -p 'test_*.py' -v

      # Only on a red suite. This repo's own disease is "a red tick and no explanation", and the
      # runner's log bytes live on a host a sandbox (or a locked-down network) often cannot reach,
      # so a failing job used to be unreadable from anywhere but a browser. Naming the tests as
      # annotations costs 10 seconds on a run that is already broken and makes `gh api
      # .../check-runs/<id>/annotations` the whole diagnosis — the same trick
      # tools/lane_status.py uses for the posting lanes.
      - name: Name the failing tests
        if: failure()
        run: |
          set +e
          log="$(mktemp)"
          python3 -m unittest discover -s tools/tests -p 'test_*.py' >"$log" 2>&1
          echo "$log" > /tmp/qa_log_path
          grep -E '^(FAIL|ERROR): ' "$log" | sed 's/ (.*//' | sort -u | head -12 \
            | while IFS= read -r broken; do echo "::error::failing test: ${broken}"; done
          summary="$(grep -E '^(Ran [0-9]+ tests|FAILED|OK)' "$log" | tr '\n' ' ')"
          echo "::error::suite summary: ${summary}"
          exit 0

      - name: Repo integrity (pre_push_verify.sh)
        run: bash tools/pre_push_verify.sh

      - name: QA gate (qa.py)
        run: python3 tools/qa.py
