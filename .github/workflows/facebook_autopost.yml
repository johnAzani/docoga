name: Facebook Page Autopost

# Posts DocOga's daily copy to the Facebook Page (facebook.com/DocOgaNG).
# Runs at 09:30 Nigeria time (UTC+1) — thirty minutes after the Telegram post, so
# the two channels never compete for the same runner minutes or the same copy.
#
# History this comment exists for: until 12 Oct 2026 this file was a button.
# `workflow_dispatch` only, no schedule, and its two steps interpolated
# `${{ inputs.message }}` straight into a shell line. It had never run — not
# once — which is why "the Facebook automation" could be described as existing
# while publishing nothing. It now follows the standard `telegram_autopost.yml`
# set after that workflow's four-day silent failure (7–10 Oct 2026):
#
#   1. a preflight that names which credential is wrong before anything is
#      attempted (tools/fb_preflight.py, stdlib-only so it runs before pip);
#   2. the publisher's own write probe for `--dry-run`, so "may this token
#      publish?" is answered by Facebook rather than inferred from a scope list;
#   3. every step's stderr captured to a file so Meta's exact words land in the
#      issue, not only in a run log nobody opens;
#   4. a labelled issue when a run fails, because a red tick in a repo nobody
#      reads is indistinguishable from silence.
#
# A Reels lane rides this same job (Mon + Thu): the three-phase `video_reels`
# protocol, publishing the very file the YouTube lane renders from the same
# date-seeded rotation, because a plain Page video post only reaches roughly the
# follower count while a Reel reaches the Reels surface. It ships defaulted to
# `probe` (open and abandon an upload session — the only Reels check that
# publishes nothing) and becomes `on` with one repository variable, `FB_REELS`.
# See FACEBOOK_AUTOMATION.md §9.
#
# Inputs are passed to the shell through `env:` — never interpolated into the
# command line. GitHub substitutes an unquoted `${{ }}` before the shell sees
# it, so a dispatch message containing `"` or `$(…)` would have executed on the
# runner with this repo's secrets in scope. That is the one class of bug a
# manual-dispatch workflow cannot have.
#
# No `ref:` pin here, unlike telegram_autopost.yml: a scheduled run always uses
# main, and a dispatch from a branch must be able to test *that branch's*
# scripts — which is exactly how this workflow was verified before merging.

on:
  schedule:
    - cron: '30 8 * * *'  # 08:30 UTC = 09:30 in Lagos (UTC+1, no DST)
  workflow_dispatch:
    inputs:
      mode:
        description: 'What to publish'
        required: true
        type: choice
        default: daily
        options:
          - daily      # today's generated post, from scripts/generate_facebook_content.py
          - text       # the message below, verbatim
          - photo      # message + a public image URL
          - video      # message as description + a public .mp4 URL
          - reel       # render today's reel from the rotation and publish it now
      dry_run:
        description: 'Preflight and the write probe only — publish nothing'
        required: false
        default: false
        type: boolean
      message:
        description: 'Post copy (text / photo caption / video description). Ignored by mode=daily'
        required: false
        default: ''
      media_url:
        description: 'Public URL of the image or video (photo / video modes only)'
        required: false
        default: ''
      force:
        description: 'Post even if the Page already has a post today'
        required: false
        default: false
        type: boolean
      for_date:
        description: 'mode=reel only — render the rotation topic of this date (YYYY-MM-DD) instead of today; the narrator-resume workflow uses it to finish a Reel that was owed'
        required: false
        default: ''
        type: string

permissions:
  # `write`, not `read`, for one reason: `video_reels` cannot be read, updated or
  # deleted, so "has this frame gone out recently?" can only be answered from a
  # ledger the job commits back — `logs/facebook_reels.json`, the only path this
  # permission is used for. Same shape as youtube_scheduled.yml.
  contents: write
  issues: write          # a failed run opens (or comments on) a visible issue

concurrency:
  group: facebook-autopost
  cancel-in-progress: false   # a second post today is worse than a queued run

env:
  FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
  FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
  # Optional. Only used to read the token's expiry and to refresh it; the post
  # itself needs the Page token alone. Kept out of every source file, unlike
  # before 12 Oct 2026, when the app secret had a literal default in
  # tools/fb_publish.py and therefore lived in git history.
  META_APP_ID: ${{ secrets.META_APP_ID }}
  META_APP_SECRET: ${{ secrets.META_APP_SECRET }}
  # Meta ships 3–4 Graph API versions a year and sunsets them on a roughly
  # two-year clock (v21.0 goes 21 Jan 2027). The default is the version these
  # scripts were written against, and a repository *variable* overrides it — so
  # the day Meta sunsets one, the fix is one line in Settings → Actions →
  # Variables (`META_GRAPH_VERSION = v27.0`), not a commit and a deploy.
  META_GRAPH_VERSION: ${{ vars.META_GRAPH_VERSION || 'v26.0' }}
  # The Reels lane's mode: `probe` (default), `on`, `off`. A variable rather than
  # a secret because it is not sensitive, and rather than a commit because the
  # owner should be able to switch the lane on the morning they read a green
  # probe line, in Settings → Actions → Variables.
  REELS_MODE: ${{ vars.FB_REELS || 'probe' }}
  # Stories: `on` (default) / `off`. The tray is the guard, not a file.
  STORIES_MODE: ${{ vars.FB_STORIES || 'on' }}
  # Instagram Reels ride this lane too (owner, 16 Oct 2026: "what about reals" — at ₦0).
  # The same render goes to @docoga.ng by Meta's resumable upload with the *Page* token
  # (Facebook-Login path: no public host, no file-size race, nothing committed). `on`
  # (default) publishes whenever the daily readiness probe below says the token can;
  # `off` switches it off. There is no `probe` mode because the probe runs every day anyway.
  IG_REELS_MODE: ${{ vars.IG_REELS || 'on' }}
  TZ: Africa/Lagos

jobs:
  publish:
    name: Preflight → generate → post
    runs-on: ubuntu-24.04
    # 30, not 15: a moviepy render of six 1080×1920 slides plus a ~30 MB upload
    # and Meta's processing poll is minutes of work. A job killed by a timeout
    # after publishing is the worst possible outcome — it is red *and* live.
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      # Deliberately before `pip install`: it is stdlib-only, and a dead token
      # should cost seconds. Its exit code is what fails the run, and its own
      # message says which of token / Page id / feed access is wrong.
      - name: Preflight — can this token reach the Page?
        run: |
          set -o pipefail
          python3 tools/fb_preflight.py 2>&1 | tee /tmp/fb_preflight.log

      - name: Install dependencies
        # Pillow, not only requests: the Reels *plan* step reads the rotation, and
        # the rotation lives in the module that renders, which imports PIL at
        # module level. A "decide only" step that cannot import is a skipped lane.
        # fonts-inter: the daily photo is the brand card (tools/social_card.py),
        # and the brand's only typeface is Inter (docs/BRAND_STYLE.md §2). Without
        # it the card renders in DejaVu — legible, but not ours.
        run: |
          python3 -m pip install --quiet requests Pillow
          bash tools/install_brand_fonts.sh   # Inter, or a named warning — never a silent DejaVu

      # ── Instagram Reels readiness (reads only, every run) ───────────────────
      # Three GETs: is @docoga.ng linked to the Page, does the Page token carry
      # `instagram_basic` + `instagram_content_publish`, does the Instagram node answer a
      # publishing read. The verdict gates the Instagram Reel step at the bottom, and when it
      # is "no" the log names the exact fix — so the owner learns it on a Friday, not when
      # Monday's Reel is due. `continue-on-error`: a probe that cannot run must not cost the
      # Facebook post.
      - name: Instagram Reels — is the Page token ready? (reads only)
        id: ig_reels_probe
        if: ${{ env.IG_REELS_MODE != 'off' && (github.event_name == 'schedule' || inputs.mode == 'daily' || inputs.mode == 'reel') }}
        continue-on-error: true
        run: |
          set -o pipefail
          set +e
          IG_API_PATH=facebook-login IG_ACCESS_TOKEN="$FB_PAGE_ACCESS_TOKEN" \
            python3 tools/ig_publish.py --probe-reels 2>&1 | tee /tmp/ig_reels_probe.log
          set -e
          READY=$(sed -n 's/^IG_REELS_READY=//p' /tmp/ig_reels_probe.log | tail -1)
          MISSING=$(sed -n 's/^IG_REELS_MISSING=//p' /tmp/ig_reels_probe.log | tail -1)
          IG_ID=$(sed -n 's/^IG_USER_ID=//p' /tmp/ig_reels_probe.log | tail -1)
          IG_NAME=$(sed -n 's/^IG_USERNAME=//p' /tmp/ig_reels_probe.log | tail -1)
          echo "ready=${READY:-no}" >> "$GITHUB_OUTPUT"
          echo "ig_user_id=${IG_ID}" >> "$GITHUB_OUTPUT"
          echo "ig_username=${IG_NAME}" >> "$GITHUB_OUTPUT"
          {
            echo "### Instagram Reels readiness"
            echo
            echo "- Page token can publish Reels on Instagram: **${READY:-no}**${IG_NAME:+ (@${IG_NAME})}${MISSING:+ — missing: \`${MISSING}\`}"
            echo '```'
            grep -v '^IG_' /tmp/ig_reels_probe.log | tail -n 8
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "${READY:-no}" != "yes" ]; then
            echo "::warning title=Instagram Reels not ready yet::missing: ${MISSING:-see the probe log}. The Facebook post and Reel are unaffected; the Instagram Reel is skipped until the Page token is regenerated with instagram_basic + instagram_content_publish (docs/INSTAGRAM_THREADS_AUTOMATION.md → Reels)."
          fi

      - name: Generate today's copy
        if: ${{ github.event_name == 'schedule' || inputs.mode == 'daily' }}
        run: |
          set -o pipefail
          python3 scripts/generate_facebook_content.py 2>&1 | tee /tmp/fb_generate.log

      # The card is what the Page shows, so every run keeps it where the owner can
      # open it from his phone (Summary → Artifacts) — dry runs included, which is
      # how a design change gets looked at before it is published.
      - name: Keep today's card for review
        if: ${{ github.event_name == 'schedule' || inputs.mode == 'daily' }}
        uses: actions/upload-artifact@v6
        with:
          name: facebook-card
          path: assets/facebook/facebook_card_*.jpg
          if-no-files-found: warn
          retention-days: 14

      - name: Daily post
        if: ${{ !inputs.dry_run && (github.event_name == 'schedule' || inputs.mode == 'daily') }}
        env:
          IN_FORCE: ${{ inputs.force }}
        run: |
          set -o pipefail
          # --force is opt-in and arrives from env: the unattended schedule never
          # sets it, so the once-a-day guard always applies to a scheduled run.
          FORCE=""
          [ "$IN_FORCE" = "true" ] && FORCE="--force"
          python3 scripts/post_facebook.py $FORCE 2>&1 | tee /tmp/fb_post.log

      # ── Stories ────────────────────────────────────────────────────────────
      # Owner, 15 Oct 2026: "you are to post stories as well." The day's copy on
      # the 9:16 brand frame goes to the tray with the post (morning slot); the
      # afternoon slot is facebook_story_afternoon.yml; the Reel is re-posted as a
      # video Story below, right after it publishes. Guarded by the tray itself
      # (GET /{page}/stories) and switched by the repository variable FB_STORIES.
      - name: Story — the day's card in the tray (morning slot)
        if: ${{ !inputs.dry_run && (github.event_name == 'schedule' || inputs.mode == 'daily') }}
        continue-on-error: true   # the feed post is live; a Story refusal is a warning, not a red run
        env:
          IN_FORCE: ${{ inputs.force }}
        run: |
          set -o pipefail
          FORCE=""
          [ "$IN_FORCE" = "true" ] && FORCE="--force"
          python3 scripts/facebook_story_daily.py --slot morning $FORCE 2>&1 | tee /tmp/fb_story.log

      - name: Keep today's Story frame for review
        if: ${{ github.event_name == 'schedule' || inputs.mode == 'daily' }}
        uses: actions/upload-artifact@v6
        with:
          name: facebook-story
          path: assets/facebook/facebook_story_*.jpg
          if-no-files-found: ignore
          retention-days: 14

      # ── Reels lane ─────────────────────────────────────────────────────────
      # `POST /{page}/video_reels` upload_phase=start → raw bytes to
      # rupload.facebook.com (Authorization: OAuth header, offset/file_size
      # headers) → upload_phase=finish with video_state=PUBLISHED. Implemented in
      # tools/fb_publish.py (post_reel), decided in scripts/facebook_reel_daily.py,
      # published through scripts/post_facebook.py so the guard rules stay in one
      # file. Mon + Thu, so the same rotation index never lands on the same day as
      # YouTube's Tue/Fri — see scripts/facebook_reel_daily.py.
      - name: Reels — decide (cheap; renders nothing)
        id: reel_plan
        if: ${{ github.event_name == 'schedule' || inputs.mode == 'daily' }}
        run: |
          set -o pipefail
          python3 scripts/facebook_reel_daily.py --plan 2>&1 | tee /tmp/fb_reel_plan.log

      # The renderer's own dependencies are only installed when a frame will
      # actually be rendered: ffmpeg via apt and moviepy add ~40 seconds, and the
      # daily text/photo post must not pay for a lane that is switched off.
      - name: Reels — install the renderer
        if: ${{ (steps.reel_plan.outputs.reel_today == 'yes' || inputs.mode == 'reel') && !inputs.dry_run }}
        run: |
          set -o pipefail
          # Same renderer as the YouTube Short: MotionStudio (Inter + ffmpeg). The
          # script ends with `motionstudio.py --check` and fails by name if either is absent.
          bash tools/install_motionstudio_deps.sh
          python3 -m pip install --quiet -r requirements-youtube.txt

      # The grant question, answered daily without publishing anything: `start`
      # opens an upload session and the session is then deleted, or left to expire.
      # Skipped on --dry-run because `post_facebook.py --dry-run` already probes.
      - name: Reels — probe the grant (nothing is published)
        if: ${{ steps.reel_plan.outputs.reel_today == 'yes' && steps.reel_plan.outputs.mode == 'probe' && !inputs.dry_run }}
        run: |
          set -o pipefail
          python3 scripts/post_facebook.py --probe-reels 2>&1 | tee /tmp/fb_reel_probe.log

      # 30-day anti-recycle window, i.e. the frame law in docs/GROWTH_ENGINE.md §4.
      # The ledger is shared machinery (tools/youtube_ledger.py) pointed at a
      # Facebook file, because the one thing this edge cannot do is be read back
      # far enough to answer "did I publish this frame last week?".
      - name: Reels — guard against a recycled frame
        id: reel_guard
        if: ${{ steps.reel_plan.outputs.reel_today == 'yes' && steps.reel_plan.outputs.mode == 'on' && !inputs.dry_run }}
        env:
          LEDGER_LABEL: Facebook reel ledger
          REEL_TITLE: ${{ steps.reel_plan.outputs.title }}
          RUN_DATE: ${{ steps.reel_plan.outputs.run_date }}
          IN_FORCE: ${{ inputs.force }}
        run: |
          set +e
          python3 tools/youtube_ledger.py --ledger logs/facebook_reels.json check \
            --title "$REEL_TITLE" --date "$RUN_DATE" --window-days 30
          code=$?
          set -e
          if [ "$code" -eq 3 ]; then
            if [ "$IN_FORCE" = "true" ]; then
              echo "skip=no" >> "$GITHUB_OUTPUT"
              echo "::notice title=Frame window overridden::force=true — \"$REEL_TITLE\" went out inside 30 days, and this run was told to publish it again."
            else
              echo "skip=yes" >> "$GITHUB_OUTPUT"
              echo "::notice title=Frame already used this month::\"$REEL_TITLE\" is inside the 30-day frame window — nothing was rendered. Add frames to scripts/generate_short_video.py, or re-run with force=true."
            fi
          elif [ "$code" -ne 0 ]; then
            exit "$code"
          else
            echo "skip=no" >> "$GITHUB_OUTPUT"
          fi

      # The narrator's clips are cached by text hash (same key as the YouTube lane —
      # the two lanes share the rotation, so they share the cache).
      - name: Reels — restore the narrator's cached clips
        if: ${{ (steps.reel_plan.outputs.reel_today == 'yes' || inputs.mode == 'reel') && !inputs.dry_run }}
        uses: actions/cache/restore@v5
        with:
          path: assets/shorts_voice
          key: shorts-voice-v2-${{ github.run_id }}
          restore-keys: shorts-voice-v2-

      - name: Reels — render
        id: reel_render
        if: ${{ steps.reel_guard.outputs.skip == 'no' }}
        # GEMINI_API_KEY: the locked narrator (Orus) + bed + SFX via tools/shorts_sound.py.
        # SHORTS_VOICE=required (default): no voice → no Reel; exit 6 is a pause that
        # names when the bucket refills, and narrator_resume.yml publishes it then.
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_TTS_MODEL: ${{ vars.GEMINI_TTS_MODEL }}
          SHORTS_VOICE: ${{ vars.SHORTS_VOICE || 'required' }}
          NARRATOR_LANE: reel
        run: |
          set +e
          set -o pipefail
          python3 scripts/facebook_reel_daily.py --render --mode on 2>&1 | tee /tmp/fb_reel_render.log
          code=$?
          set -e
          if [ "$code" -eq 6 ]; then
            echo "paused=yes" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          exit "$code"

      - name: Reels — publish
        id: reel_publish
        if: ${{ steps.reel_render.outcome == 'success' && steps.reel_render.outputs.paused != 'yes' }}
        env:
          REEL_TITLE: ${{ steps.reel_plan.outputs.title }}
          VIDEO_PATH: ${{ steps.reel_render.outputs.video_path }}
        run: |
          set -o pipefail
          python3 scripts/post_facebook.py --reel="$VIDEO_PATH" --title="$REEL_TITLE" 2>&1 | tee /tmp/fb_reel_post.log

      - name: Story — the Reel in the tray too
        if: ${{ steps.reel_publish.outcome == 'success' }}
        continue-on-error: true
        env:
          VIDEO_PATH: ${{ steps.reel_render.outputs.video_path }}
        run: |
          set -o pipefail
          python3 scripts/facebook_story_daily.py --slot video --video="$VIDEO_PATH" 2>&1 | tee /tmp/fb_story_video.log

      - name: Dry run — credentials and posting rights, nothing published
        if: ${{ inputs.dry_run && inputs.mode == 'daily' }}
        run: |
          set -o pipefail
          python3 scripts/post_facebook.py --dry-run 2>&1 | tee /tmp/fb_dryrun.log
          # Stories: render the morning frame (kept as the facebook-story artifact)
          # and open-then-abandon a video_stories session — proves the grant.
          python3 scripts/facebook_story_daily.py --slot morning --dry-run 2>&1 | tee /tmp/fb_story.log

      # Manual modes. $FB_MESSAGE / $FB_MEDIA come from `env:`, never from an
      # interpolation inside the command, and every value is passed as
      # `--flag=value` so a copy that begins with a dash cannot be read as an
      # option by argparse.
      - name: Manual post (text / photo / video / reel)
        if: ${{ !inputs.dry_run && inputs.mode != 'daily' }}
        env:
          FB_MODE: ${{ inputs.mode }}
          FB_MESSAGE: ${{ inputs.message }}
          FB_MEDIA: ${{ inputs.media_url }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_TTS_MODEL: ${{ vars.GEMINI_TTS_MODEL }}
          SHORTS_VOICE: ${{ vars.SHORTS_VOICE || 'required' }}
          NARRATOR_LANE: reel-manual
          FOR_DATE: ${{ inputs.for_date }}
        run: |
          set -o pipefail
          case "$FB_MODE" in
            photo)
              [ -n "$FB_MEDIA" ] || { echo "::error title=photo needs a URL::media_url is empty"; exit 4; }
              python3 tools/fb_publish.py --photo-url="$FB_MEDIA" --text="$FB_MESSAGE" 2>&1 | tee /tmp/fb_manual.log
              ;;
            video)
              [ -n "$FB_MEDIA" ] || { echo "::error title=video needs a URL::media_url is empty"; exit 4; }
              python3 tools/fb_publish.py --video-url="$FB_MEDIA" --text="$FB_MESSAGE" 2>&1 | tee /tmp/fb_manual.log
              ;;
            reel)
              # A person asked for today's reel now: the weekday rule and the
              # 30-day frame window are bypassed with --force, because --force is
              # what a human request means. The ledger entry is still written.
              set +e
              python3 scripts/facebook_reel_daily.py --render --mode on ${FOR_DATE:+--date "$FOR_DATE"} 2>&1 | tee /tmp/fb_reel_render.log
              code=$?
              set -e
              if [ "$code" -eq 6 ]; then
                # A person asked, but the narrator cannot speak yet: say when, publish nothing.
                WHEN=$(sed -n 's/^voice_resumes_at=//p' /tmp/fb_reel_render.log | tail -1)
                echo "::error title=Reel not published — the narrator's free bucket is empty::it refills at ${WHEN:-the next Pacific midnight}. Re-run then (the resumer does this by itself for the scheduled Reel), or set the repository variable SHORTS_VOICE=optional to ship music-only on purpose."
                exit 6
              fi
              VIDEO_PATH=$(sed -n 's/^video_path=//p' /tmp/fb_reel_render.log | tail -1)
              if [ -z "$VIDEO_PATH" ]; then
                echo "::error title=no render::the renderer printed no video_path — the render above is the failing step"
                exit 3
              fi
              python3 scripts/post_facebook.py --reel="$VIDEO_PATH" --force 2>&1 | tee /tmp/fb_reel_post.log
              ;;
            *)
              [ -n "$FB_MESSAGE" ] || { echo "::error title=no message::type the post copy in the message field"; exit 4; }
              # --force: a hand-written post is on purpose, so the once-a-day
              # guard that protects the unattended run must not veto it.
              python3 tools/fb_publish.py --text="$FB_MESSAGE" --force 2>&1 | tee /tmp/fb_manual.log
              ;;
          esac

      # Below both render paths (scheduled and manual), so whatever either one
      # synthesised — and what the ledger learnt — is there for the next run.
      - name: Reels — save the narrator's cached clips and the quota ledger
        if: ${{ always() && (steps.reel_plan.outputs.reel_today == 'yes' || inputs.mode == 'reel') && !inputs.dry_run }}
        uses: actions/cache/save@v5
        with:
          path: assets/shorts_voice
          key: shorts-voice-v2-${{ github.run_id }}

      # Both reel paths — the scheduled/daily publish above and the manual
      # `mode: reel` in "Manual post" — write /tmp/fb_reel_post.log, so the
      # ledger steps sit BELOW both of them. Run #9 (15 Oct 2026) had this step
      # above the manual one: it ran first, found no log, and killed the job
      # before the Reel was even attempted.
      - name: Reels — record it in the ledger
        # Every value falls back to the render log so the two paths cannot
        # diverge in what they record.
        if: ${{ steps.reel_publish.outcome == 'success' || (!inputs.dry_run && inputs.mode == 'reel') }}
        env:
          LEDGER_LABEL: Facebook reel ledger
          REEL_TITLE: ${{ steps.reel_plan.outputs.title }}
          REEL_TOPIC: ${{ steps.reel_plan.outputs.topic }}
          REEL_DATE: ${{ steps.reel_plan.outputs.run_date }}
          VIDEO_PATH: ${{ steps.reel_render.outputs.video_path }}
        run: |
          set -o pipefail
          if [ ! -f /tmp/fb_reel_post.log ]; then
            echo "::warning title=Ledger not recorded::no reel publish log — no reel step reached the publish call, so there is nothing to record"
            exit 0
          fi
          VIDEO_ID=$(sed -n 's/^REEL_VIDEO_ID=//p' /tmp/fb_reel_post.log | tail -1)
          REEL_URL=$(sed -n 's/^REEL_URL=//p' /tmp/fb_reel_post.log | tail -1)
          if [ -z "$VIDEO_ID" ]; then
            echo "::warning title=Ledger not recorded::no REEL_VIDEO_ID in /tmp/fb_reel_post.log — if a reel did go out it is now unrecorded, so a re-run could publish the same frame twice"
            exit 0
          fi
          TITLE="${REEL_TITLE:-$(sed -n 's/^title=//p' /tmp/fb_reel_render.log | tail -1)}"
          TOPIC="${REEL_TOPIC:-$TITLE}"
          RUN_DATE="${REEL_DATE:-$(date +%F)}"
          PATH_TO_SIZE="${VIDEO_PATH:-$(sed -n 's/^video_path=//p' /tmp/fb_reel_render.log | tail -1)}"
          python3 tools/youtube_ledger.py --ledger logs/facebook_reels.json record \
            --title "$TITLE" \
            --topic "$TOPIC" \
            --video-id "$VIDEO_ID" \
            --url "$REEL_URL" \
            --date "$RUN_DATE" \
            --run-id "$GITHUB_RUN_ID" \
            --size-bytes "$(stat -c%s "$PATH_TO_SIZE" 2>/dev/null || echo 0)"

      # Bookkeeping must never turn a successful publish red, so this step keeps
      # the job green and leaves a warning — with one honest difference from
      # silence: the warning says a duplicate is now possible.
      - name: Reels — commit the ledger
        if: ${{ steps.reel_publish.outcome == 'success' || (!inputs.dry_run && inputs.mode == 'reel') }}
        continue-on-error: true
        env:
          RUN_DATE: ${{ steps.reel_plan.outputs.run_date }}
          BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if ! git pull --rebase --autostash origin "$BRANCH"; then
            echo "::warning title=Reel ledger not committed::could not rebase on $BRANCH. The reel is live; this run is simply not recorded, so a re-run could publish the same frame again."
            exit 1
          fi
          git add logs/facebook_reels.json
          if git diff --staged --quiet; then
            echo "Ledger unchanged — nothing to commit."
            exit 0
          fi
          git commit -m "Auto: record Facebook reel published $RUN_DATE [skip ci]"
          if ! git push origin "HEAD:$BRANCH"; then
            echo "::warning title=Reel ledger not pushed::the reel is live but the ledger entry did not reach $BRANCH — a re-run could publish it again."
            exit 1
          fi

      # ── Instagram Reel: the same file, Meta's resumable upload, ₦0 ──────────
      # Below every Facebook bookkeeping step on purpose: a failure here must fail
      # the run (so the issue step fires) *after* the Facebook Reel is already in its
      # ledger — a red step above "Reels — record it" would skip that record and make
      # the next run publish the Facebook Reel twice. Both Reel paths (scheduled, and
      # `mode: reel` from narrator_resume.yml) land here; the file and the Facebook
      # result are read from the logs those paths share. Caption = the day's copy,
      # the same words the Facebook Reel carries as its description. The cover is the
      # frame at 1.5 s — the navy title card — so no second render or hosted image.
      - name: Instagram Reel — the same render, by resumable upload
        id: ig_reel
        if: ${{ steps.ig_reels_probe.outputs.ready == 'yes' && (steps.reel_publish.outcome == 'success' || (!inputs.dry_run && inputs.mode == 'reel')) }}
        env:
          IG_USER_ID: ${{ steps.ig_reels_probe.outputs.ig_user_id }}
          IG_USERNAME: ${{ steps.ig_reels_probe.outputs.ig_username }}
          VIDEO_PATH: ${{ steps.reel_render.outputs.video_path }}
          REEL_TITLE: ${{ steps.reel_plan.outputs.title }}
          REEL_DATE: ${{ steps.reel_plan.outputs.run_date }}
          IN_FORCE: ${{ inputs.force }}
          LEDGER_LABEL: Instagram publish ledger
          BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -o pipefail
          FILE="${VIDEO_PATH:-$(sed -n 's/^video_path=//p' /tmp/fb_reel_render.log 2>/dev/null | tail -1)}"
          if [ -z "$FILE" ] || [ ! -f "$FILE" ]; then
            echo "::notice title=Instagram Reel skipped::no rendered file this run (the Facebook Reel was paused or skipped), so there is nothing to upload"
            exit 0
          fi
          if ! grep -q '^REEL_VIDEO_ID=' /tmp/fb_reel_post.log 2>/dev/null; then
            echo "::notice title=Instagram Reel skipped::the Facebook Reel did not publish this run, and the Instagram one follows it"
            exit 0
          fi
          TITLE="${REEL_TITLE:-$(sed -n 's/^title=//p' /tmp/fb_reel_render.log | tail -1)}"
          RUN_DATE="${REEL_DATE:-$(date +%F)}"
          # The day's copy, read from the file the generator wrote (the Facebook Reel's own
          # description); regenerated in-process if the file is missing. Written to a script
          # file, not `python3 -c`: the generator logs to stdout, and `$(…)` would make those
          # log lines part of the caption.
          cat > /tmp/ig_reel_caption.py <<'PY'
          import contextlib, io, json, sys
          from datetime import datetime, timedelta, timezone
          day = datetime.now(timezone(timedelta(hours=1))).date()
          path = "assets/facebook/facebook_content_%s.json" % day.isoformat()
          try:
              with open(path, encoding="utf-8") as handle:
                  message = json.load(handle)["message"]
          except (OSError, ValueError, KeyError):
              sys.path.insert(0, "scripts")
              with contextlib.redirect_stdout(io.StringIO()):
                  import generate_facebook_content
                  message = generate_facebook_content.generate(day)["message"]
          sys.stdout.write(message.strip() + "\n")
          PY
          CAPTION=$(python3 /tmp/ig_reel_caption.py)
          [ -n "$CAPTION" ] || { echo "::error title=no caption::the day's Facebook copy could not be read or generated"; exit 5; }
          FORCE=""
          [ "$IN_FORCE" = "true" ] && FORCE="--force"
          # Same 30-day frame window as Facebook's, in Instagram's own ledger — the
          # account's duplicate guard (same caption) is the second check, inside the publisher.
          set +e
          python3 tools/youtube_ledger.py --ledger logs/instagram_sent.json check \
            --title "Reel · $TITLE" --date "$RUN_DATE" --window-days 30
          code=$?
          set -e
          if [ "$code" -eq 3 ] && [ -z "$FORCE" ]; then
            echo "::notice title=Instagram Reel already out::\"$TITLE\" is inside the 30-day window on Instagram — nothing uploaded"
            exit 0
          fi
          set +e
          IG_API_PATH=facebook-login IG_ACCESS_TOKEN="$FB_PAGE_ACCESS_TOKEN" IG_USER_ID="$IG_USER_ID" \
            python3 tools/ig_publish.py --video-file "$FILE" --caption "$CAPTION" --thumb-offset-ms 1500 $FORCE \
            2>&1 | tee /tmp/ig_reel_post.log
          STATUS=${PIPESTATUS[0]}
          set -e
          RESULT=$(sed -n 's/^IG_RESULT=//p' /tmp/ig_reel_post.log | tail -1)
          CAUSE=$(sed -n 's/^IG_CAUSE=//p' /tmp/ig_reel_post.log | tail -1)
          PERMALINK=$(sed -n 's/^IG_PERMALINK=//p' /tmp/ig_reel_post.log | tail -1)
          MEDIA_ID=$(sed -n 's/^IG_MEDIA_ID=//p' /tmp/ig_reel_post.log | tail -1)
          {
            echo "### Instagram Reel"
            echo
            echo "- result: \`${RESULT:-?}${CAUSE:+ · cause \`${CAUSE}\`}\` on @${IG_USERNAME:-docoga.ng}"
            echo "- permalink: ${PERMALINK:-not reported}"
            echo "- file: $(basename "$FILE") ($(stat -c%s "$FILE" 2>/dev/null || echo 0) bytes) — uploaded to Meta directly; no public URL, nothing committed"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$RESULT" = "sent" ]; then
            # Bookkeeping cannot turn a live Reel red — warnings, with the honest consequence.
            python3 tools/youtube_ledger.py --ledger logs/instagram_sent.json record \
              --title "Reel · $TITLE" --topic "$TITLE" --video-id "${MEDIA_ID:-unknown}" --url "$PERMALINK" \
              --date "$RUN_DATE" --run-id "$GITHUB_RUN_ID" --size-bytes "$(stat -c%s "$FILE" 2>/dev/null || echo 0)" \
              || echo "::warning title=Instagram Reel not recorded::the Reel is live but logs/instagram_sent.json was not updated — a re-run inside 30 days could upload it again"
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add logs/instagram_sent.json
            if ! git diff --staged --quiet; then
              git commit -q -m "Auto: record Instagram reel $RUN_DATE [skip ci]"
              git pull --rebase --autostash origin "$BRANCH" >/dev/null 2>&1 || true
              git push origin "HEAD:$BRANCH" || echo "::warning title=Instagram Reel ledger not pushed::the Reel is live; the entry did not reach $BRANCH"
            fi
          fi
          case "$RESULT" in
            sent|refused-duplicate) exit 0 ;;
            *) exit "${STATUS:-6}" ;;
          esac

      # The Reel in the @docoga.ng Story tray too — the same bytes as `media_type=STORIES`,
      # exactly what this lane already does on Facebook right after its own Reel. A Story is a
      # window, not the record, so this step is continue-on-error; it records itself in the
      # Instagram ledger as `instagram-story` like the daily Instagram lane's frame does.
      - name: Instagram Story — the Reel in the tray too
        id: ig_reel_story
        if: ${{ steps.ig_reel.outcome == 'success' && env.STORIES_MODE != 'off' }}
        continue-on-error: true
        env:
          IG_USER_ID: ${{ steps.ig_reels_probe.outputs.ig_user_id }}
          IG_USERNAME: ${{ steps.ig_reels_probe.outputs.ig_username }}
          VIDEO_PATH: ${{ steps.reel_render.outputs.video_path }}
          REEL_TITLE: ${{ steps.reel_plan.outputs.title }}
          REEL_DATE: ${{ steps.reel_plan.outputs.run_date }}
          LEDGER_LABEL: Instagram publish ledger
          BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -o pipefail
          FILE="${VIDEO_PATH:-$(sed -n 's/^video_path=//p' /tmp/fb_reel_render.log 2>/dev/null | tail -1)}"
          if [ -z "$FILE" ] || [ ! -f "$FILE" ] || ! grep -q '^IG_RESULT=sent$' /tmp/ig_reel_post.log 2>/dev/null; then
            echo "The Instagram Reel did not go out this run, so there is no video Story to post."
            exit 0
          fi
          TITLE="${REEL_TITLE:-$(sed -n 's/^title=//p' /tmp/fb_reel_render.log | tail -1)}"
          RUN_DATE="${REEL_DATE:-$(date +%F)}"
          set +e
          IG_API_PATH=facebook-login IG_ACCESS_TOKEN="$FB_PAGE_ACCESS_TOKEN" IG_USER_ID="$IG_USER_ID" \
            python3 tools/ig_publish.py --video-file "$FILE" --video-story 2>&1 | tee /tmp/ig_reel_story.log
          STATUS=${PIPESTATUS[0]}
          set -e
          RESULT=$(sed -n 's/^IG_RESULT=//p' /tmp/ig_reel_story.log | tail -1)
          CAUSE=$(sed -n 's/^IG_CAUSE=//p' /tmp/ig_reel_story.log | tail -1)
          MEDIA_ID=$(sed -n 's/^IG_MEDIA_ID=//p' /tmp/ig_reel_story.log | tail -1)
          {
            echo "### Instagram video Story"
            echo
            echo "- result: \`${RESULT:-?}${CAUSE:+ · cause \`${CAUSE}\`}\` — the Reel, 24 hours in the tray"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$RESULT" = "sent" ]; then
            python3 tools/youtube_ledger.py --ledger logs/instagram_sent.json record \
              --title "Story · Reel · $TITLE" --topic instagram-story --video-id "${MEDIA_ID:-unknown}" \
              --url "https://www.instagram.com/stories/${IG_USERNAME:-docoga.ng}/${MEDIA_ID:-}/" \
              --date "$RUN_DATE" --run-id "$GITHUB_RUN_ID" \
              || echo "::warning title=Instagram video Story not recorded::it is live for 24 hours either way"
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add logs/instagram_sent.json
            if ! git diff --staged --quiet; then
              git commit -q -m "Auto: record Instagram video story $RUN_DATE [skip ci]"
              git pull --rebase --autostash origin "$BRANCH" >/dev/null 2>&1 || true
              git push origin "HEAD:$BRANCH" || echo "::warning title=Instagram Story ledger not pushed::the Story is live; the entry did not reach $BRANCH"
            fi
            exit 0
          fi
          echo "::warning title=Instagram video Story not posted::result=${RESULT:-?} cause=${CAUSE:-?} — the Reel itself is live and unaffected"
          exit "${STATUS:-6}"

      - name: Record what this run did
        if: always()
        env:
          REEL_TODAY: ${{ steps.reel_plan.outputs.reel_today }}
          REEL_REASON: ${{ steps.reel_plan.outputs.reason }}
          REEL_MODE: ${{ steps.reel_plan.outputs.mode }}
          REEL_TITLE: ${{ steps.reel_plan.outputs.title }}
          REEL_SKIP: ${{ steps.reel_guard.outputs.skip }}
          REEL_PAUSED: ${{ steps.reel_render.outputs.paused }}
          REEL_VOICE_REASON: ${{ steps.reel_render.outputs.voice_reason }}
          REEL_RESUMES_AT: ${{ steps.reel_render.outputs.voice_resumes_at }}
          REEL_SOUNDTRACK: ${{ steps.reel_render.outputs.soundtrack }}
          REEL_NARRATOR: ${{ steps.reel_render.outputs.narrator }}
          IG_READY: ${{ steps.ig_reels_probe.outputs.ready }}
        run: |
          {
            echo ""
            echo "### Facebook autopost — $(date -u +%FT%TZ)"
            echo ""
            echo "- Graph API: \`$META_GRAPH_VERSION\`"
            echo "- FB_PAGE_ID: $( [ -n "${FB_PAGE_ID:-}" ] && echo set || echo '**not set**' )"
            echo "- FB_PAGE_ACCESS_TOKEN: $( [ -n "${FB_PAGE_ACCESS_TOKEN:-}" ] && echo set || echo '**not set**' )"
            REEL_URL=$(sed -n 's/^REEL_URL=//p' /tmp/fb_reel_post.log 2>/dev/null | tail -1)
            case "${REEL_TODAY}" in
              yes)
                if [ -n "$REEL_URL" ]; then
                  echo "- Reels: \`${REEL_MODE}\` · ✅ published — $REEL_URL"
                  [ -n "$REEL_SOUNDTRACK" ] && echo "- Reel soundtrack: $REEL_SOUNDTRACK"
                  [ -n "$REEL_NARRATOR" ] && echo "- $REEL_NARRATOR"
                elif [ "$REEL_PAUSED" = "yes" ]; then
                  echo "- Reels: \`${REEL_MODE}\` · ⏸ paused — no voice, no Reel. $REEL_VOICE_REASON"
                  echo "- Resumes: ${REEL_RESUMES_AT:-at the next Pacific midnight} — the narrator-resume workflow publishes it then; nothing to press"
                elif [ "$REEL_SKIP" = "yes" ]; then
                  echo "- Reels: \`${REEL_MODE}\` · ⏭ frame \"$REEL_TITLE\" is inside the 30-day window — nothing rendered"
                else
                  echo "- Reels: \`${REEL_MODE}\` · \"$REEL_TITLE\" — no publish recorded this run (see the reel log line below)"
                fi
                ;;
              no) echo "- Reels: \"$REEL_REASON\"" ;;
              *)  echo "- Reels: not evaluated this run" ;;
            esac
            IG_REEL_RESULT=$(sed -n 's/^IG_RESULT=//p' /tmp/ig_reel_post.log 2>/dev/null | tail -1)
            IG_REEL_LINK=$(sed -n 's/^IG_PERMALINK=//p' /tmp/ig_reel_post.log 2>/dev/null | tail -1)
            if [ -n "$IG_REEL_RESULT" ]; then
              echo "- Instagram Reel: \`${IG_REEL_RESULT}\`${IG_REEL_LINK:+ — $IG_REEL_LINK}"
            elif [ "${IG_READY:-}" = "no" ]; then
              echo "- Instagram Reel: ⏸ not ready — the Page token needs instagram_basic + instagram_content_publish (see the readiness block above)"
            fi
            for pair in "preflight:/tmp/fb_preflight.log" "generator:/tmp/fb_generate.log" \
                        "post:/tmp/fb_post.log" "dry run:/tmp/fb_dryrun.log" "manual:/tmp/fb_manual.log" \
                        "reel plan:/tmp/fb_reel_plan.log" "reel probe:/tmp/fb_reel_probe.log" \
                        "reel render:/tmp/fb_reel_render.log" "reel publish:/tmp/fb_reel_post.log" \
                        "story:/tmp/fb_story.log" "story video:/tmp/fb_story_video.log" \
                        "instagram reels probe:/tmp/ig_reels_probe.log" "instagram reel:/tmp/ig_reel_post.log" \
                        "instagram video story:/tmp/ig_reel_story.log"; do
              label=${pair%%:*}; file=${pair#*:}
              if [ -f "$file" ]; then
                # Sanitised: the log can contain quotes and backticks from an API
                # error body, and this file is rendered as markdown.
                last=$(tail -1 "$file" | tr -d '`"' | cut -c1-160)
                echo "- $label, last line: \`$last\`"
              fi
            done
          } >> "$GITHUB_STEP_SUMMARY"

      # A red run in a repo nobody opens is the same as silence. This makes the
      # failure land where the owner will see it, carrying Meta's own words so
      # triage does not need the run log.
      - name: Open a visible issue if the run failed
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -uo pipefail
          RUN_DATE="$(date +%F)"

          PREFLIGHT_TAIL=$(tail -n 20 /tmp/fb_preflight.log 2>/dev/null || echo "(the preflight produced no output)")
          POST_TAIL=$(tail -n 30 /tmp/fb_post.log /tmp/fb_manual.log /tmp/fb_dryrun.log 2>/dev/null || echo "(no publisher ran — the preflight or an earlier step stopped the run)")
          REEL_TAIL=$(tail -n 40 /tmp/fb_reel_post.log /tmp/fb_reel_probe.log /tmp/fb_reel_render.log /tmp/fb_reel_plan.log 2>/dev/null || echo "(no reel step ran)")
          IG_TAIL=$(tail -n 30 /tmp/ig_reel_post.log 2>/dev/null || echo "(the Instagram Reel step did not run)")
          if grep -q '^REEL_VIDEO_ID=' /tmp/fb_reel_post.log 2>/dev/null || grep -q 'posted\|✅' /tmp/fb_post.log 2>/dev/null; then
            HEADLINE="The unattended Facebook run for **$RUN_DATE** failed partway. **Check the sections below for what did go out** — a Facebook post or Reel may be live while a later step (Story, ledger, Instagram Reel) failed."
          else
            HEADLINE="The unattended Facebook post for **$RUN_DATE** failed. **Nothing was published to the Page.**"
          fi

          gh label create facebook-automation --color 1877F2 \
            --description "Unattended Facebook Page pipeline" >/dev/null 2>&1 || true

          cat > /tmp/issue_body.md <<BODY
          $HEADLINE

          - Run: $RUN_URL
          - Graph API version: \`$META_GRAPH_VERSION\`

          ### What the preflight said

          \`\`\`
          $PREFLIGHT_TAIL
          \`\`\`

          ### What the publisher said

          \`\`\`
          $POST_TAIL
          \`\`\`

          ### What the Reels lane said

          \`\`\`
          $REEL_TAIL
          \`\`\`

          ### What the Instagram Reel step said

          \`\`\`
          $IG_TAIL
          \`\`\`

          ### Reading it

          - \`IG_RESULT=failed\` / \`video upload rejected\` — the Facebook Reel is live; the
            Instagram copy of it is not. \`IG_CAUSE=permission\` means the Page token lost
            \`instagram_content_publish\`; \`media\` means Meta refused the file; \`state\`
            means the container never reached FINISHED. Re-run with \`mode: reel\` after the
            fix — the Instagram ledger's 30-day window stops a double upload on the Facebook side.
          - \`Facebook secrets missing\` — set \`FB_PAGE_ACCESS_TOKEN\` and \`FB_PAGE_ID\`
            (\`gh secret set …\`). Until both exist nothing can be posted, by design:
            there is no fallback Page id compiled into the script.
          - \`Facebook token rejected\` / \`code 190\` — the Page token was revoked or expired,
            or the app lost its admin grant on the Page. Mint a fresh long-lived token in
            Meta Business Settings → Pages → this Page → Page access tokens.
          - \`Page not reachable with this token\` — \`FB_PAGE_ID\` names a Page this token
            cannot manage. Check the id; a token for another Page is not a warning, it is
            the wrong destination.
          - \`Page feed not readable\` — the duplicate guard is blind and posting rights are
            almost certainly gone too; re-grant \`pages_manage_posts\` and \`pages_read_engagement\`.
          - \`code 200\` / \`(#200) Permission failed\` — the token lacks a permission; it can
            read the Page but not publish to it.
          - \`code 4 /\` \`rate\` — the app or Page hit a rate limit; the next scheduled run
            is unaffected.
          - \`photo post refused\` lines followed by \`falling back to a text post\` are
            informational — the words still went out. Only a run that posted nothing is a failure.
          - \`Graph API version\` errors such as \`unsupported selection\` — Meta sunset a
            version. Bump \`META_GRAPH_VERSION\` in this workflow and \`API_VERSION\` in
            \`tools/fb_publish.py\` (see FACEBOOK_AUTOMATION.md).
          - \`spec refused\` — the file failed the local 9:16 / 3–90 s gate, so no bytes
            were sent. That is the *good* outcome: Meta accepts a bad file and then
            fails to publish it quietly.
          - \`start refused\` on a probe — the token cannot open a Reels session. Reels
            need the same \`pages_manage_posts\` grant; if the feed probe passed and this
            did not, the app is missing a Reels-capable grant and \`FB_REELS\` must stay
            \`probe\` or \`off\` until it is added.
          - \`publish refused after the upload was accepted\` — the file is on Meta's side
            but unpublished. Finish it by hand with
            \`python3 tools/fb_publish.py --reel-finish <video_id>\`; the id is in the log
            above. Do not re-render and re-upload first, or the frame goes out twice.
          - \`still processing\` in the run log is a warning, not this failure — the reel
            was accepted and lands on the Page when the render finishes.
          BODY

          # One issue per *cause*, not per day — see the Telegram lane for the reasoning:
          # an identical issue every morning is noise that hides the one that matters, and
          # `setup` is a lane that was never switched on, not an outage.
          TAIL=$(cat /tmp/fb_preflight.log /tmp/fb_post.log /tmp/fb_reel_post.log /tmp/ig_reel_post.log 2>/dev/null || true)
          case "$TAIL" in
            *"secrets missing"*|*"not configured"*) CAUSE=setup ;;
            *"Error validating access token"*|*invalid_grant*|*OAuth*) CAUSE=credentials ;;
            *"Permission denied"*|*"not an admin"*|*"(#200)"*) CAUSE=rights ;;
            *"unverified"*|*"(#32)"*) CAUSE=verification ;;
            *) CAUSE=run ;;
          esac

          # Newest match wins (`max`), so a legacy untagged issue stops absorbing comments once
          # a tagged one exists. One story per problem, not two.
          EXISTING=$(CAUSE_TAG="[$CAUSE]" LEGACY_PREFIX="Facebook post failed — " \
            gh issue list --label facebook-automation --state open --limit 100 --json number,title \
            --jq "[.[] | select((.title | contains(\$ENV.CAUSE_TAG)) or ((.title | contains(\$ENV.LEGACY_PREFIX)) and (.title | contains(\"[\") | not))) | .number] | max // empty")
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body-file /tmp/issue_body.md || true
            echo "Same cause as issue #$EXISTING — commented instead of filing a second one"
          else
            gh issue create --title "Facebook post failed — $RUN_DATE [$CAUSE]" \
              --label facebook-automation --body-file /tmp/issue_body.md \
              || echo "::warning title=Issue not created::bookkeeping failed; the run log still carries the cause"
          fi
