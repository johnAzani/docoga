name: DocOga Instagram Auto-Post

# Posts one brand card a day to @docogadaily's Instagram at 10:00 in Lagos — 09:00 UTC.
#
# This lane used to be dispatch-only, and the reason in the old header was true but
# incomplete: "the Reels API needs a public media URL, and rendered Shorts live in
# gitignored assets/, so an unattended run today would publish nothing more often than
# not." Two separate problems were hiding in that sentence, and they have different fixes:
#
#   1. **No public URL.** Fixed without spending anything and without a new account:
#      `site/` is already deployed as the web root at https://docoga.com.ng, so a render
#      committed to `site/social/` *is* a public URL once the site build finishes. The lane
#      renders with `tools/social_card.py` (1080×1350 — exactly the 4:5 Instagram accepts),
#      commits it, and then `--wait-url` polls the URL until it answers 200. That last step
#      is the honest handling of a race we created: git knows about a file before the edge
#      does, and Instagram's error for a 404 is "Unsupported URL request", which has sent
#      people hunting for a permissions bug for years.
#   2. **A publish that fails silently.** `tools/ig_publish.py` used to `return None` on
#      every failure path into a `main()` that ignored it, so a red day printed a green tick.
#      It now has an exit code per outcome (see its header) and the summary prints
#      `IG_RESULT=`/`IG_CAUSE=` from the publisher's own log line, not from hope.
#
# Reels are not posted from here, and that is a decision, not a gap (16 Oct 2026). A URL-based
# Reel would need a public MP4 — a 25 MiB static-asset ceiling, a deploy race, and a CDN
# terms grey area, for a file Meta fetches once. Meta's resumable upload needs no host at all
# but exists only on the Facebook-Login path, i.e. with the *Page* token the Facebook lane
# holds. So the Instagram Reel is published by `facebook_autopost.yml` (Mon + Thu) from the
# very same MotionStudio render as the Facebook Reel, right after it, with
# `tools/ig_publish.py --video-file` and the daily readiness probe `--probe-reels`.
# `content_type: reel` here therefore points at that lane instead of pretending.
#
# The caption is today's Threads copy, deliberately: `generate_telegram_content.py` owns
# the words for every lane, so Instagram, Threads and Facebook say the same thing on the
# same Tuesday with the shape each platform reads. A fourth template file is a fourth
# voice, and the drift would be found by a reader, not by us.
#
# Standard Access is enough for this: Meta's App Review and Business Verification gates are
# for apps publishing on *other* people's accounts. Posting to your own profile from an app
# you own is what Standard Access exists for — the claim that this lane was blocked on
# business verification was wrong, and `docs/INSTAGRAM_THREADS_AUTOMATION.md` says what is actually
# required (a professional account, JPEG, ≤8 MB, 4:5…1.91:1, 100 posts per 24 h, 60-day
# token that `tools/token_vault.py` keeps alive).

on:
  schedule:
    # Three candidate windows (WAT 07:10, 13:10, 19:10 — Nigeria's morning, lunch and evening
    # peaks); the `slot` job below lets exactly ONE of them post each day, the one brain/slots.json
    # names. The scorecard rewrites that file every Monday from what our posts earned by hour and
    # from Instagram's online_followers curve (17 Oct 2026). Default 19:10 WAT.
    - cron: '10 6 * * *'   # 06:10 UTC = 07:10 Lagos
    - cron: '10 12 * * *'  # 12:10 UTC = 13:10 Lagos
    - cron: '10 18 * * *'  # 18:10 UTC = 19:10 Lagos — the 7–9 pm peak for Nigeria's visual platform (brain/strategy.md); :10 so a late scheduler still lands in the window
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Preflight, render, and stop before creating any container'
        required: false
        default: false
        type: boolean
      probe_only:
        description: 'Ask Instagram who the token authorises, then stop'
        required: false
        default: false
        type: boolean
      content_type:
        description: 'What to post'
        required: false
        default: 'card'
        type: choice
        options:
          - card
          - story
          - reel
          - photo
          - carousel
      image_url:
        description: 'Public image URL (photo/carousel) — skips the render step'
        required: false
      image_urls:
        description: 'Public image URLs, comma-separated (carousel, 2-10)'
        required: false
      video_url:
        description: 'Public video URL (reel)'
        required: false
      caption:
        description: 'Caption override (still duplicate-checked)'
        required: false
        type: string
      force:
        description: 'Post even if today is already in the ledger or on the account'
        required: false
        default: false
        type: boolean
      clock:
        description: 'Set by the DocOga clock (workers/clock) — behave exactly like the scheduled run: post only in the hour the numbers chose'
        required: false
        default: false
        type: boolean

permissions:
  contents: write  # the render under site/social/ and the ledger are committed back
  issues: write    # a failed run opens (or comments on) a visible issue — without this grant
                   # every failure since launch ended in "Issue not created: bookkeeping failed"

jobs:
  slot:
    name: Is this the hour the numbers chose?
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      go: ${{ steps.gate.outputs.go }}
      why: ${{ steps.gate.outputs.why }}
    steps:
      - uses: actions/checkout@v5
      - name: Slot gate
        id: gate
        env:
          EVENT: ${{ github.event_name }}
          CLOCK: ${{ inputs.clock }}
        run: |
          set -o pipefail
          # The clock (workers/clock) dispatches this lane at each of its three cron minutes with
          # clock=true, which is "I am the schedule" — the same gate applies. 17 Oct 2026.
          if [ "${CLOCK:-false}" = "true" ]; then EVENT=schedule; fi
          python3 tools/brain_scorecard.py slot instagram | tee /tmp/slot.log
          WANT=$(sed -n 's/^SLOT_HOUR_WAT=//p' /tmp/slot.log | tail -1)
          WHY=$(sed -n 's/^SLOT_WHY=//p' /tmp/slot.log | tail -1)
          NOW=$(TZ=Africa/Lagos date +%-H)
          # A dispatch always posts. A scheduled run posts only in the chosen window: the cron fires
          # at :10, and the scheduler can be an hour late, so the window is the hour and the next.
          if [ "$EVENT" != "schedule" ] || [ "$NOW" = "$WANT" ] || [ "$NOW" = "$(( (WANT + 1) % 24 ))" ]; then
            echo "go=true" >> "$GITHUB_OUTPUT"
            echo "IG_SLOT=go hour=${NOW} chosen=${WANT}"
          else
            echo "go=false" >> "$GITHUB_OUTPUT"
            echo "IG_SLOT=skipped hour=${NOW} chosen=${WANT}"
          fi
          echo "why=${WHY}" >> "$GITHUB_OUTPUT"
          {
            echo "### Instagram slot"
            echo
            echo "- Lagos hour now: ${NOW} · chosen slot: ${WANT}:10 WAT — ${WHY}"
          } >> "$GITHUB_STEP_SUMMARY"

  publish:
    needs: slot
    if: ${{ needs.slot.outputs.go == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30  # > the 15-minute media-liveness wait, or the deadline is fiction
    env:
      SOCIAL_TOKEN_KEY: ${{ secrets.SOCIAL_TOKEN_KEY }}  # tools/token_vault.py reads this; unset = 60-day token, never renewed
      DOCOGA_SHOTS: ${{ vars.DOCOGA_SHOTS || 'on' }}   # CC0 photograph behind the card, matched to the copy (tools/shot_match.py)
      META_GRAPH_VERSION: ${{ vars.META_GRAPH_VERSION || 'v26.0' }}
      IG_API_PATH: ${{ vars.IG_API_PATH || 'instagram-login' }}
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python3 -m pip install --quiet pillow cryptography numpy
          # pillow draws the card; cryptography is tools/token_vault.py's only requirement, and
          # that tool refuses to run without it rather than storing a token in plaintext.
          # Inter is the brand face; without this line the card is DejaVu (it was, until 16 Oct 2026).
          bash tools/install_brand_fonts.sh

      - name: Load the credential (vault first, secret as bootstrap)
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: |
          set -u
          umask 077
          if [ -f logs/ig_access_token.box ]; then
            if python3 tools/token_vault.py open --name IG_ACCESS_TOKEN --out /tmp/ig_token; then
              echo "IG_CREDENTIAL=vault"
              echo "- credential: **vault** (rolling, refreshed by this lane)" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "::warning title=Token vault unreadable::falling back to the IG_ACCESS_TOKEN secret — the vault box exists but did not open, so either SOCIAL_TOKEN_KEY rotated or the file is damaged."
              printf '%s' "${IG_ACCESS_TOKEN:-}" > /tmp/ig_token
              chmod 600 /tmp/ig_token
            fi
          elif [ -n "${IG_ACCESS_TOKEN:-}" ]; then
            printf '%s' "$IG_ACCESS_TOKEN" > /tmp/ig_token
            chmod 600 /tmp/ig_token
            echo "IG_CREDENTIAL=secret"
          else
            echo "::error title=Instagram is not configured::no IG_ACCESS_TOKEN secret and no logs/ig_access_token.box. Setup step, not an outage — see docs/INSTAGRAM_THREADS_AUTOMATION.md"
            echo "IG_RESULT=refused"
            echo "IG_CAUSE=setup"
            exit 2
          fi
          # The token reaches the publisher as a 0600 file, not an environment variable:
          # anything that dumps the step's env (a debug flag, a crashed shell) would carry it
          # into a log Actions does not scrub line by line.
          echo "IG_TOKEN_FILE=/tmp/ig_token" >> "$GITHUB_ENV"

      - name: Preflight — may this lane post?
        run: |
          set -o pipefail
          # `--probe` costs one read call and creates nothing, so a green preflight is not a
          # published post. It also refuses a non-professional account *before* the render,
          # which is the difference between a 20-second red run and a 6-minute one.
          IG_ACCESS_TOKEN="$(cat /tmp/ig_token)" python3 tools/ig_publish.py --probe \
            2>&1 | tee /tmp/ig_preflight.log
          IG_USER_ID_OUT=$(sed -n 's/.*id \([0-9]*\).*/\1/p' /tmp/ig_preflight.log | head -1)
          echo "IG_USER_ID=${IG_USER_ID_OUT:-}" >> "$GITHUB_ENV"

      - name: Probe only — stop here
        if: ${{ inputs.probe_only }}
        run: |
          {
            echo "### Instagram probe"
            echo
            echo '```'
            tail -n 12 /tmp/ig_preflight.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "Probe mode — nothing was rendered and no container was created."

      - name: Today's caption
        if: ${{ !inputs.probe_only && !inputs.dry_run }}
        env:
          IG_CAPTION: ${{ inputs.caption }}
        run: |
          set -o pipefail
          # One day, one message, three shapes. Threads' copy is already de-escaped, already
          # fitted to 500 characters, and already seeded on the date, so a re-run of this
          # lane produces the *same* caption — which is what makes the duplicate guard below
          # able to recognise its own yesterday.
          python3 scripts/generate_threads_content.py 2>&1 | tee /tmp/ig_generate.log
          if [ ! -f assets/threads/threads_content_latest.json ]; then
            echo "::error title=no copy generated::assets/threads/threads_content_latest.json is missing"
            exit 5
          fi
          if [ -n "${IG_CAPTION:-}" ]; then
            python3 - <<'IG_CAPTION'
          import json, os, pathlib
          path = pathlib.Path("assets/threads/threads_content_latest.json")
          payload = json.loads(path.read_text(encoding="utf-8"))
          payload["text"] = os.environ["IG_CAPTION"].strip()
          payload["post_type"] = "manual"
          payload.setdefault("trimmed", []).append("dispatch caption replaced the generated copy")
          path.write_text(json.dumps(payload, indent=2) + "\n", encoding="utf-8")
          print("dispatch caption override in force (%d characters)" % len(payload["text"]))
          IG_CAPTION
          fi

      # The render is written into the deployed tree on purpose: it is the only ₦0 way to
      # give Meta a URL it can fetch. That also means a failed run can leave an orphan JPEG
      # under site/social/, so the lane bounds its own footprint at the end of a successful run
      # (see "Prune old renders"): 60 dated renders, and nothing older accumulates in the one
      # directory the site publishes.
      #
      # Note the *missing* `[skip ci]` on this commit, against the house rule for automated
      # commits: the render has to trigger the site deploy, because the deploy is what makes
      # the URL exist. Bookkeeping commits skip CI to protect the free plan's minutes; this
      # commit is not bookkeeping, it is the publish. Skipping it would hang the run on a
      # 15-minute wait for a page that was never going to change.
      - name: Render the card
        if: ${{ !inputs.probe_only && !inputs.dry_run && inputs.content_type != 'reel' }}
        env:
          BRANCH: ${{ github.event.repository.default_branch }}
          IG_CAROUSEL: ${{ vars.IG_CAROUSEL }}             # on (default) · off
          IG_CAROUSEL_DAYS: ${{ vars.IG_CAROUSEL_DAYS }}   # ISO weekdays, default 2,4 (Tue, Thu)
        run: |
          set -o pipefail
          DAY=$(date -u +%F)
          OUT="site/social/${DAY}-instagram.jpg"
          STORY_OUT="site/social/${DAY}-instagram-story.jpg"
          KICKER="$(python3 -c 'import json;print(json.load(open("assets/threads/threads_content_latest.json")).get("post_type",""))')"
          python3 tools/social_card.py \
            --from-json assets/threads/threads_content_latest.json \
            --kicker "$KICKER" --brief "$DAY" \
            --out "$OUT" 2>&1 | tee /tmp/ig_render.log
          # The same copy as a 9:16 Story frame (owner, 16 Oct 2026: "what about Instagram
          # stories"). One commit carries both files so one deploy publishes both URLs.
          python3 tools/social_card.py \
            --from-json assets/threads/threads_content_latest.json \
            --kicker "$KICKER" --story --brief "$DAY" \
            --out "$STORY_OUT" 2>&1 | tee /tmp/ig_story_render.log
          tee -a "$GITHUB_STEP_SUMMARY" < /tmp/ig_render.log > /dev/null
          CARD_URL=$(sed -n 's/^CARD_URL=//p' /tmp/ig_render.log | tail -1)
          STORY_URL=$(sed -n 's/^CARD_URL=//p' /tmp/ig_story_render.log | tail -1)
          echo "IG_MEDIA_URL=${CARD_URL}" >> "$GITHUB_ENV"
          echo "IG_STORY_URL=${STORY_URL}" >> "$GITHUB_ENV"
          # Carousel days (17 Oct 2026): on Tue + Thu (ISO weekdays in IG_CAROUSEL_DAYS, default 2,4)
          # the brain pack's lines become one slide each — hook, points, close. Carousels carry
          # 0.55% ER against 0.37% for a single image and nine times the saves (Socialinsider,
          # Metricool 2026). CARD_SLIDES=0 means the pack had too few lines: the single card posts.
          SLIDE_URLS=""
          DOW=$(date -u +%u)
          if [ "${IG_CAROUSEL:-on}" != "off" ] && printf ',%s,' "${IG_CAROUSEL_DAYS:-2,4}" | grep -q ",${DOW},"; then
            python3 tools/social_card.py --slides --brief "$DAY" \
              --out "site/social/${DAY}-instagram-slide.jpg" 2>&1 | tee /tmp/ig_slides.log || true
            SLIDE_URLS=$(sed -n 's/^CARD_URLS=//p' /tmp/ig_slides.log | tail -1)
            echo "carousel: $(sed -n 's/^CARD_SLIDES=//p' /tmp/ig_slides.log | tail -1) slide(s)"
          fi
          echo "IG_SLIDE_URLS=${SLIDE_URLS}" >> "$GITHUB_ENV"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f "$OUT" "$STORY_OUT"
          [ -n "$SLIDE_URLS" ] && git add -f site/social/"${DAY}"-instagram-slide-*.jpg
          if git diff --staged --quiet; then
            echo "Render already committed on this branch — nothing to push."
          else
            git commit -q -m "Auto: Instagram card + story ${DAY}"
            # No workflow expression is interpolated into this command line: this is the one step that pushes, and a
            # push destination built from an interpolated expression is where a trust mistake
            # becomes a write to the wrong ref.
            git push origin "HEAD:${BRANCH}" \
              || echo "::warning title=Card not pushed::the JPEG exists only in this run, so the URL Instagram will be given is not published yet. If the push failed, the media-liveness wait below will fail with cause=media — which is the honest outcome, not a mystery."
          fi

      # Skipped on a story-only dispatch: a Story has no caption to be a duplicate of, and the
      # ledger key is the caption — so on that path the step could only ever say "today's card
      # is already recorded", which is true, expected, and not a warning.
      - name: Ledger — has today already been posted?
        if: ${{ !inputs.probe_only && !inputs.dry_run && inputs.content_type != 'story' }}
        env:
          LEDGER_LABEL: Instagram publish ledger
          IG_FORCE: ${{ inputs.force }}
        run: |
          set -o pipefail
          TITLE=$(python3 -c 'import json;print(json.load(open("assets/threads/threads_content_latest.json"))["text"][:80])')
          RUN_DATE=$(date -u +%F)
          if python3 tools/youtube_ledger.py --ledger logs/instagram_sent.json check \
               --title "$TITLE" --date "$RUN_DATE"; then
            echo "IG_LEDGER=clear"
          else
            code=$?
            FORCE_ON=""
            case "$(printf '%s' "${IG_FORCE:-}" | tr '[:upper:]' '[:lower:]')" in
              1|true|yes|on) FORCE_ON=1 ;;
            esac
            if [ "$code" = "3" ] && [ -z "$FORCE_ON" ]; then
              echo "IG_LEDGER=duplicate"
              echo "- ledger: today's caption is already recorded, so **nothing was sent**" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            if [ "$code" = "3" ]; then
              echo "::notice title=Ledger overridden::today's caption is already recorded and force=true — continuing; the account's own duplicate guard is the last word"
              echo "IG_LEDGER=forced"
            else
              echo "::warning title=Ledger unreadable (exit $code)::continuing — the account itself is the authority"
              echo "IG_LEDGER=unreadable"
            fi
          fi

      - name: Publish to Instagram
        if: ${{ !inputs.probe_only && !inputs.dry_run }}
        env:
          IG_FORCE: ${{ inputs.force }}
          IG_CONTENT_TYPE: ${{ inputs.content_type }}
          IG_IMAGE_URL_OVERRIDE: ${{ inputs.image_url }}
          IG_COLLABORATORS: ${{ vars.IG_COLLABORATORS }}   # up to 3 public usernames invited as co-authors (blank = none)
        run: |
          set -o pipefail
          # Dispatch strings reach this script through `env:` only. Interpolating an input into
          # the command line is the injection hole the Facebook lane closed on 12 Oct: a caption
          # or URL containing `$(…)` becomes shell code running with this job's secrets in scope.
          case "${IG_CONTENT_TYPE:-card}" in
            story)
              echo "Story-only dispatch: the feed post is skipped; the Story step below publishes."
              echo "IG_RESULT=skipped" > /tmp/ig_post.log
              exit 0
              ;;
            reel)
              echo "::error title=Reels go out through the Facebook lane::the Instagram Reel is uploaded by facebook_autopost.yml (Mon + Thu, or Actions → DocOga Facebook Auto-Post → Run workflow → mode: reel) from the same render as the Facebook Reel, by Meta's resumable upload with the Page token. This lane's token is on the Instagram-Login host, which has no upload endpoint — docs/INSTAGRAM_THREADS_AUTOMATION.md → Reels."
              exit 5
              ;;
            carousel)
              echo "::error title=carousel needs URLs::the daily pipeline renders one card; pass image_urls on a dispatch (see the workflow inputs) for a multi-slide post."
              exit 5
              ;;
          esac
          # The caption opens with the search phrase and the card carries alt text (Instagram SEO,
          # 17 Oct 2026); a dispatch caption override wins because it rewrote `text`, not `ig_caption`.
          CAPTION=$(python3 -c 'import json;d=json.load(open("assets/threads/threads_content_latest.json"));print(d["text"] if d.get("post_type")=="manual" else (d.get("ig_caption") or d["text"]))')
          ALT=$(python3 -c 'import json;print((json.load(open("assets/threads/threads_content_latest.json")).get("alt_text") or "")[:1000])')
          ARGS=(--caption "$CAPTION" --wait-url --wait-url-deadline 900)
          [ -n "$ALT" ] && ARGS+=(--alt-text "$ALT")
          if [ -n "${IG_IMAGE_URL_OVERRIDE:-}" ]; then
            ARGS+=(--image-url "$IG_IMAGE_URL_OVERRIDE")
          elif [ -n "${IG_SLIDE_URLS:-}" ]; then
            # Word-splitting is the point: CARD_URLS is space-separated and URLs carry no spaces.
            # shellcheck disable=SC2206
            SLIDES=(${IG_SLIDE_URLS})
            ARGS+=(--image-urls "${SLIDES[@]}")
            echo "carousel: ${#SLIDES[@]} slides"
          else
            [ -n "${IG_MEDIA_URL:-}" ] || { echo "::error title=no card URL::the render step did not produce CARD_URL"; exit 5; }
            ARGS+=(--image-url "$IG_MEDIA_URL")
          fi
          FORCE_ON=""
          case "$(printf '%s' "${IG_FORCE:-}" | tr '[:upper:]' '[:lower:]')" in
            1|true|yes|on) FORCE_ON=1 ;;
          esac
          [ -n "$FORCE_ON" ] && ARGS+=(--force)
          # IG_ACCESS_TOKEN via env because argparse reads the environment; the value stays in
          # this step's process, never in the commit, the summary, or the issue body.
          set +e
          IG_ACCESS_TOKEN="$(cat /tmp/ig_token)" IG_USER_ID="${IG_USER_ID:-}" \
            python3 tools/ig_publish.py "${ARGS[@]}" 2>&1 | tee /tmp/ig_post.log
          PIPE_STATUS=${PIPESTATUS[0]}
          set -e
          RESULT=$(sed -n 's/^IG_RESULT=//p' /tmp/ig_post.log | tail -1)
          CAUSE=$(sed -n 's/^IG_CAUSE=//p' /tmp/ig_post.log | tail -1)
          PERMALINK=$(sed -n 's/^IG_PERMALINK=//p' /tmp/ig_post.log | tail -1)
          {
            echo "### Instagram post"
            echo
            echo "- result: \`${RESULT:-?}${CAUSE:+ · cause \`${CAUSE}\`}\`"
            echo "- permalink: ${PERMALINK:-not reported}"
            echo "- media: ${IG_SLIDE_URLS:-${IG_MEDIA_URL:-dispatch URL}} — served from the deployed site, which is why the wait exists"
            echo "- ledger: \`logs/instagram_sent.json\`"
          } >> "$GITHUB_STEP_SUMMARY"
          # sent / refused-duplicate / probed are successes; a red publisher is a red run.
          case "$RESULT" in
            sent|refused-duplicate) exit 0 ;;
            *) exit "${PIPE_STATUS:-6}" ;;
          esac

      # The Story rides the same run: same frame copy at 9:16, 24 hours in the tray, no caption.
      # It is deliberately after the feed post so a failing Story cannot cost the feed post —
      # and it is `continue-on-error`: a Story is a window, the feed post is the record.
      - name: Publish the Story
        id: story
        if: ${{ !inputs.probe_only && !inputs.dry_run && inputs.content_type != 'reel' && inputs.content_type != 'carousel' && inputs.content_type != 'photo' }}
        continue-on-error: true
        run: |
          set -o pipefail
          [ -n "${IG_STORY_URL:-}" ] || { echo "::warning title=no Story URL::the render step did not produce a Story frame"; exit 0; }
          set +e
          IG_ACCESS_TOKEN="$(cat /tmp/ig_token)" IG_USER_ID="${IG_USER_ID:-}" \
            python3 tools/ig_publish.py --story-url "$IG_STORY_URL" --wait-url --wait-url-deadline 600 2>&1 | tee /tmp/ig_story.log
          STORY_STATUS=${PIPESTATUS[0]}
          set -e
          RESULT=$(sed -n 's/^IG_RESULT=//p' /tmp/ig_story.log | tail -1)
          CAUSE=$(sed -n 's/^IG_CAUSE=//p' /tmp/ig_story.log | tail -1)
          {
            echo "### Instagram Story"
            echo
            echo "- result: \`${RESULT:-?}${CAUSE:+ · cause \`${CAUSE}\`}\`"
            echo "- frame: ${IG_STORY_URL} (9:16, 24 hours in the tray)"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$RESULT" != "sent" ]; then
            echo "::warning title=Instagram Story not posted::result=${RESULT:-?} cause=${CAUSE:-?} — the feed post is unaffected; see the log above"
            exit "${STORY_STATUS:-6}"
          fi

      - name: Wind the 60-day token clock
        if: always()
        continue-on-error: true
        env:
          BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if ! IG_ACCESS_TOKEN="$(cat /tmp/ig_token)" python3 tools/ig_publish.py --refresh-token \
               > /tmp/ig_refresh.json 2>/tmp/ig_refresh.err; then
            echo "::warning title=Instagram token not refreshed::$(tail -c 200 /tmp/ig_refresh.err 2>/dev/null | tr '\n' ' ') — repeated for weeks, this ends in an expired token and a credentials issue."
            exit 0
          fi
          if ! python3 tools/token_vault.py seal --name IG_ACCESS_TOKEN --json /tmp/ig_refresh.json 2>/tmp/ig_seal.err; then
            rm -f /tmp/ig_refresh.json
            # Quote the tool's own reason. The old text blamed SOCIAL_TOKEN_KEY for every failure,
            # and on 16 Oct 2026 the owner set that secret twice while the real cause was a stray
            # stdout line in the refresh response.
            echo "::warning title=Instagram token not sealed::$(tail -c 300 /tmp/ig_seal.err 2>/dev/null | tr '\n' ' ') — the refreshed value dies with this run; until sealing works this lane has 60 days, not forever."
            exit 0
          fi
          rm -f /tmp/ig_refresh.json
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f logs/ig_access_token.box
          if git diff --staged --quiet; then
            echo "Sealed box unchanged."
          else
            git commit -q -m "Auto: wind Instagram token $(date -u +%F) [skip ci]"
            git pull --rebase --autostash origin "$BRANCH" >/dev/null 2>&1 || true
            git push origin "HEAD:$BRANCH" || echo "::warning title=Sealed token not pushed::next run will use the older value"
          fi
          python3 tools/token_vault.py status --name IG_ACCESS_TOKEN | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Record it in the ledger
        if: ${{ !inputs.probe_only && !inputs.dry_run }}
        continue-on-error: true
        run: |
          set -o pipefail
          TITLE=$(python3 -c 'import json;print(json.load(open("assets/threads/threads_content_latest.json"))["text"][:80])')
          RECORDED=0
          if grep -q '^IG_RESULT=sent$' /tmp/ig_post.log 2>/dev/null; then
            MEDIA_ID=$(sed -n 's/^IG_MEDIA_ID=//p' /tmp/ig_post.log | tail -1)
            PERMALINK=$(sed -n 's/^IG_PERMALINK=//p' /tmp/ig_post.log | tail -1)
            python3 tools/youtube_ledger.py --ledger logs/instagram_sent.json record \
              --title "$TITLE" --video-id "${MEDIA_ID:-unknown}" --url "$PERMALINK" \
              --date "$(date -u +%F)" --run-id "${{ github.run_id }}" --topic instagram-card
            RECORDED=1
          fi
          if grep -q '^IG_RESULT=sent$' /tmp/ig_story.log 2>/dev/null; then
            STORY_ID=$(sed -n 's/^IG_MEDIA_ID=//p' /tmp/ig_story.log | tail -1)
            STORY_LINK=$(sed -n 's/^IG_PERMALINK=//p' /tmp/ig_story.log | tail -1)
            python3 tools/youtube_ledger.py --ledger logs/instagram_sent.json record \
              --title "Story · $TITLE" --video-id "${STORY_ID:-unknown}" --url "$STORY_LINK" \
              --date "$(date -u +%F)" --run-id "${{ github.run_id }}" --topic instagram-story
            RECORDED=1
          fi
          [ "$RECORDED" = 1 ] || echo "Nothing was published, so nothing is recorded."

      - name: Commit the ledger
        if: ${{ !inputs.probe_only && !inputs.dry_run }}
        continue-on-error: true
        env:
          BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [ ! -f logs/instagram_sent.json ]; then echo "No ledger file."; exit 0; fi
          if [ -z "$(git status --porcelain -- logs/instagram_sent.json)" ]; then
            echo "Ledger unchanged — nothing to commit."; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add logs/instagram_sent.json
          git commit -q -m "Auto: record Instagram post $(date -u +%F) [skip ci]" || exit 0
          git pull --rebase --autostash origin "$BRANCH" || { echo "::warning title=Instagram ledger not rebased::the post is live but unrecorded, so a re-run could publish it again."; exit 1; }
          git push origin "HEAD:$BRANCH" || echo "::warning title=Instagram ledger not pushed::the post is live, the entry did not reach $BRANCH."

      # Bounded by the lane, not by a monthly intention: `site/social/` is inside the deployed
      # tree, so an unbounded write there is the repository growing in public forever. The count is
      # by *filename* on purpose — a checkout stamps every file with today's mtime, which is the
      # reason a `find -mtime +60` retention step would have looked correct, passed every test,
      # and never deleted anything. Housekeeping commits `[skip ci]`: nobody is waiting on a
      # deletion, and the free plan's minutes are not for that.
      - name: Prune old renders
        env:
          BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -o pipefail
          python3 tools/social_card.py --prune site/social --keep 60 | tee /tmp/ig_prune.log
          tee -a "$GITHUB_STEP_SUMMARY" < /tmp/ig_prune.log > /dev/null
          N=$(sed -n 's/^RENDER_PRUNED=\([0-9]*\).*/\1/p' /tmp/ig_prune.log | tail -1)
          if [ "${N:-0}" -eq 0 ]; then
            echo "No render past the retention window — nothing to delete."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A site/social
          if git diff --staged --quiet; then
            echo "Nothing staged: those files were never committed, so nothing is public to undo."
            exit 0
          fi
          git commit -q -m "Auto: prune Instagram renders $(date -u +%F) [skip ci]"
          git pull --rebase --autostash origin "$BRANCH" >/dev/null 2>&1 || true
          git push origin "HEAD:${BRANCH}" \
            || echo "::warning title=Renders not pruned::gone from this checkout only; the next run tries again"

      - name: Open a visible issue if the run failed
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          RUN_DATE="$(date +%F)"
          PREFLIGHT_TAIL=$(tail -n 15 /tmp/ig_preflight.log 2>/dev/null || echo "(preflight produced no output)")
          POST_TAIL=$(tail -n 25 /tmp/ig_post.log 2>/dev/null || echo "(the publisher never ran — the preflight, the render, or the ledger stopped the run)")
          RENDER_TAIL=$(tail -n 8 /tmp/ig_render.log 2>/dev/null || echo "(no render log)")

          gh label create instagram-automation --color E1306C \
            --description "Unattended Instagram card lane" >/dev/null 2>&1 || true

          cat > /tmp/issue_body.md <<BODY
          The unattended Instagram post for **$RUN_DATE** failed. **Nothing was published.**

          - Run: $RUN_URL

          ### What the preflight said

          \`\`\`
          $PREFLIGHT_TAIL
          \`\`\`

          ### What the publisher said

          \`\`\`
          $POST_TAIL
          \`\`\`

          ### What the render said

          \`\`\`
          $RENDER_TAIL
          \`\`\`

          ### Reading it

          - \`Unsupported URL request\` / \`media\` — the JPEG was not public when Instagram
            looked. Either the site deploy was still running (the lane waits 15 min), the
            push of \`site/social/…\` failed, or the URL was built with a \`/site/\` prefix.
          - \`profile_type\` is not business/creator — Instagram's API has no path for a
            personal account. Switch it in the app, then re-run with probe_only=true.
          - \`error code 190\` / \`the access token is invalid\` — the 60-day token expired.
            Re-consent once; if \`SOCIAL_TOKEN_KEY\` is set the lane keeps it alive after that.
          - \`(#200)\` / \`permission\` — the app lost \`instagram_business_content_publish\`,
            or the credential is for the other login path (\`vars.IG_API_PATH\`).
          - \`code 32\` / \`rate limit\` — 100 API-published posts per 24 h per account. One a
            day cannot do that alone; look for another publisher using the same token.
          - \`IG_CAUSE=setup\` — nothing is configured yet. Not an outage; a step.
          BODY

          TAIL=$(cat /tmp/ig_preflight.log /tmp/ig_post.log /tmp/ig_render.log 2>/dev/null || true)
          case "$TAIL" in
            *"secrets missing"*|*"not configured"*) CAUSE=setup ;;
            *190*|*"access token is invalid"*|*expired*|*Unauthorized*) CAUSE=credentials ;;
            *"(#200)"*|*permission*|*"not approved"*) CAUSE=permission ;;
            *"Unsupported URL"*|*"media rejected"*|*"never became public"*|*"not-jpeg"*|*"no-SOF"*) CAUSE=media ;;
            *"profile_type"*|*"business account"*|*"professional account"*) CAUSE=account ;;
            *"content_publishing_limit"*|*"rate limit"*|*"quota"*) CAUSE=quota ;;
            *"transport failure"*) CAUSE=transport ;;
            *) CAUSE=run ;;
          esac

          # Newest match wins, and a pre-13-Oct issue with no cause in its title is folded in
          # rather than doubled — the same rule the Telegram lane learned the hard way when #16
          # swallowed four days of failures because an empty jq needle matched everything.
          EXISTING=$(CAUSE_TAG="[$CAUSE]" LEGACY_PREFIX="Instagram post failed — " \
            gh issue list --label instagram-automation --state open --limit 100 --json number,title \
            --jq "[.[] | select((.title | contains(\$ENV.CAUSE_TAG)) or ((.title | contains(\$ENV.LEGACY_PREFIX)) and (.title | contains(\"[\") | not))) | .number] | max // empty")
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body-file /tmp/issue_body.md || true
            echo "Same cause as issue #$EXISTING — commented instead of filing a second one"
          else
            gh issue create --title "Instagram post failed — $RUN_DATE [$CAUSE]" --label instagram-automation --body-file /tmp/issue_body.md 2>/tmp/issue.err \
              || echo "::warning title=Issue not created::$(tr '\n' ' ' < /tmp/issue.err | cut -c1-300) — the run log still carries the cause"
          fi
