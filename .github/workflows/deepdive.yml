name: Deep-Dive — produce and publish one long-form episode

# The long-form lane: words → Gemini voice → Vosk word-sync → nine scenes rendered in
# parallel → master with the synthesized sound kit (−16 LUFS) → cover → QA → YouTube.
# Every expensive intermediate is BANKED on a GitHub Release (`deepdive-<episode>`),
# because the voice costs daily TTS quota and a 10-minute render costs minutes — a re-run
# must never pay twice for the same bytes, and nothing may live only on a runner's disk
# (that is how DD1–DD4's voice was lost in Sep 2026).
#
# FREE PLAN, BY DESIGN. Gemini's free tier allows roughly ten TTS requests a day. The
# engine never makes more than --max-requests calls per run, reads Google's own "retry
# in N s" instead of hammering, and treats an empty bucket as a PAUSE, not a failure:
# the chunks minted so far are banked, the run ends green with "N/9 banked", and the
# nightly tick (03:00 WAT) picks the episode up again. The owner presses nothing twice.
#
# Stages (input `stage`, or `all` on the nightly tick):
#   all      voice → render → master → publish (skipping whatever the bank already holds)
#   voice    bank the voice + word timings only
#   render   assume the voice is banked; render, master, QA, bank the master — publish nothing
#   publish  assume the master is banked; upload it

on:
  schedule:
    - cron: '0 2 * * *'          # 03:00 WAT — resume whatever episodes/queue.json says is next
  workflow_dispatch:
    inputs:
      episode:
        description: 'Episode id (a folder under episodes/); blank = next in episodes/queue.json'
        required: false
        default: ''
        type: string
      stage:
        description: 'How far to go'
        required: true
        default: all
        type: choice
        options: [all, voice, render, publish]
      privacy:
        description: 'YouTube privacy for the upload'
        required: true
        default: unlisted
        type: choice
        options: [unlisted, private, public]
      force:
        description: 'Publish even if this title is already in the long-form ledger'
        required: false
        default: false
        type: boolean

permissions:
  contents: write   # releases (the bank) + the ledger commit
  issues: write     # a failed run opens a visible issue

concurrency:
  group: deepdive
  cancel-in-progress: false

# Job-level `env` below repeats the three episode paths: a workflow-level env cannot read
# `needs`, and the episode id is decided by the `pick` job, not by the trigger.
env:
  TZ: Africa/Lagos

jobs:
  pick:
    name: Which episode, how far
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      episode: ${{ steps.pick.outputs.episode }}
      stage: ${{ steps.pick.outputs.stage }}
      privacy: ${{ steps.pick.outputs.privacy }}
      force: ${{ steps.pick.outputs.force }}
      has_master: ${{ steps.bank.outputs.has_master }}
      banked: ${{ steps.bank.outputs.banked }}
    steps:
      - uses: actions/checkout@v4
      - id: pick
        env:
          IN_EPISODE: ${{ inputs.episode }}
          IN_STAGE: ${{ inputs.stage }}
          IN_PRIVACY: ${{ inputs.privacy }}
          IN_FORCE: ${{ inputs.force }}
          EVENT: ${{ github.event_name }}
        run: |
          EP="$IN_EPISODE"
          [ -n "$EP" ] || EP="$(python3 tools/deepdive_queue.py next)"
          {
            echo "episode=$EP"
            echo "stage=${IN_STAGE:-all}"
            echo "privacy=${IN_PRIVACY:-unlisted}"
            echo "force=${IN_FORCE:-false}"
          } >> "$GITHUB_OUTPUT"
          if [ -z "$EP" ]; then
            echo "## Deep-Dive — nothing to do" >> "$GITHUB_STEP_SUMMARY"
            echo "Every episode in \`episodes/queue.json\` is already in the long-form ledger. Add the next id to the queue when its folder is ready." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "episode=$EP stage=${IN_STAGE:-all} event=$EVENT"
          fi
      - id: bank
        if: steps.pick.outputs.episode != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EP: ${{ steps.pick.outputs.episode }}
        run: |
          TAG="deepdive-$EP"
          ASSETS="$(gh release view "$TAG" --json assets -q '.assets[].name' 2>/dev/null || true)"
          HAS=false; echo "$ASSETS" | grep -qx "$EP-episode.mp4" && HAS=true
          BANKED=0
          if echo "$ASSETS" | grep -qx "$EP-status.json"; then
            gh release download "$TAG" --pattern "$EP-status.json" -D /tmp >/dev/null 2>&1 && \
              BANKED="$(python3 -c "import json;print(json.load(open('/tmp/$EP-status.json')).get('banked',0))")"
          fi
          echo "has_master=$HAS" >> "$GITHUB_OUTPUT"
          echo "banked=$BANKED" >> "$GITHUB_OUTPUT"
          echo "bank: master=$HAS voice=$BANKED/9 ($TAG)"

  voice:
    name: Voice (Gemini TTS) + word-sync
    needs: [pick]
    if: ${{ needs.pick.outputs.episode != '' && (needs.pick.outputs.stage == 'voice' || (needs.pick.outputs.stage == 'all' && needs.pick.outputs.has_master != 'true')) }}
    runs-on: ubuntu-latest
    env:
      EPISODE: ${{ needs.pick.outputs.episode }}
      RELEASE_TAG: deepdive-${{ needs.pick.outputs.episode }}
      BUILD_DIR: build/deepdive/${{ needs.pick.outputs.episode }}
    timeout-minutes: 90
    outputs:
      complete: ${{ steps.tts.outputs.complete }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install MotionStudio deps (ffmpeg + Inter) and the ASR engine
        run: |
          bash tools/install_motionstudio_deps.sh
          python -m pip install --quiet "requests>=2.31,<3" vosk
          mkdir -p /tmp/vosk && cd /tmp/vosk
          curl -fsSL -o model.zip https://alphacephei.com/vosk/models/vosk-model-small-en-us-0.15.zip
          unzip -q -o model.zip && rm model.zip
          cd "$GITHUB_WORKSPACE" && python3 tools/deepdive.py "$EPISODE" env
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      - name: Script ↔ beats contract
        run: python3 tools/deepdive.py "$EPISODE" check
      - name: Restore the banked voice (if any)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p "$BUILD_DIR"
          if gh release download "$RELEASE_TAG" --pattern "$EPISODE-voice.tar.gz" -D /tmp 2>/dev/null; then
            tar -xzf "/tmp/$EPISODE-voice.tar.gz" -C "$BUILD_DIR"
            echo "restored: $(ls "$BUILD_DIR/voice" | tr '\n' ' ')"
          else
            echo "no banked voice yet for $RELEASE_TAG"
          fi
      - name: Gemini TTS (free tier · resumable · waits for a quota slot up to 35 min)
        id: tts
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_TTS_MODEL: ${{ vars.GEMINI_TTS_MODEL }}
        run: |
          set +e
          python3 tools/deepdive.py "$EPISODE" tts --wait-budget-min 35 --max-requests 12 2>&1 | tee /tmp/tts.log
          code=${PIPESTATUS[0]}
          set -e
          BANKED="$(ls "$BUILD_DIR"/voice/c*.ok 2>/dev/null | wc -l | tr -d ' ')"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "banked=$BANKED" >> "$GITHUB_OUTPUT"
          if [ "$code" -eq 0 ]; then
            echo "complete=true" >> "$GITHUB_OUTPUT"
          elif [ "$code" -eq 5 ]; then
            # An empty free-tier bucket is a pause, not a failure. The job stays green.
            echo "complete=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Voice paused — free quota::$BANKED/9 chunks banked. The nightly tick (03:00 WAT) continues from here; nothing to press."
            {
              echo "## Deep-Dive $EPISODE — voice paused on the free quota"
              echo
              echo "**$BANKED of 9** chunks are banked on release \`$RELEASE_TAG\`. Gemini's free tier refills daily; the 03:00 WAT tick resumes automatically. Nothing to do."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "complete=false" >> "$GITHUB_OUTPUT"
            echo "::error title=TTS failed::not a quota pause — see the log above"
          fi
      - name: Word-sync (Vosk)
        if: steps.tts.outputs.complete == 'true'
        run: python3 tools/deepdive.py "$EPISODE" align
      - name: Bank the voice on the release
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BANKED: ${{ steps.tts.outputs.banked }}
          COMPLETE: ${{ steps.tts.outputs.complete }}
        run: |
          [ -d "$BUILD_DIR/voice" ] || { echo "nothing to bank"; exit 0; }
          tar -czf "/tmp/$EPISODE-voice.tar.gz" -C "$BUILD_DIR" voice $( [ -f "$BUILD_DIR/words.json" ] && echo words.json )
          gh release view "$RELEASE_TAG" >/dev/null 2>&1 || \
            gh release create "$RELEASE_TAG" --prerelease --title "Deep-Dive bank: $EPISODE" \
              --notes "Intermediates for episodes/$EPISODE — voice chunks, word timings, master, cover. Managed by .github/workflows/deepdive.yml."
          gh release upload "$RELEASE_TAG" "/tmp/$EPISODE-voice.tar.gz" --clobber
          python3 -c "import json,os,datetime;json.dump({'episode':os.environ['EPISODE'],'banked':int(os.environ.get('BANKED') or 0),'total':9,'complete':os.environ.get('COMPLETE')=='true','updated':datetime.datetime.utcnow().isoformat()+'Z'},open('/tmp/%s-status.json' % os.environ['EPISODE'],'w'))"
          gh release upload "$RELEASE_TAG" "/tmp/$EPISODE-status.json" --clobber
          echo "banked $EPISODE-voice.tar.gz ($(stat -c%s /tmp/$EPISODE-voice.tar.gz) bytes)"
      - name: Hand the timings to the render jobs
        if: steps.tts.outputs.complete == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ needs.pick.outputs.episode }}-words
          path: |
            ${{ env.BUILD_DIR }}/words.json
            ${{ env.BUILD_DIR }}/voice/manifest.json
          retention-days: 7
      - name: Fail the job only on a real error (quota is a pause)
        if: steps.tts.outputs.code != '0' && steps.tts.outputs.code != '5'
        env:
          CODE: ${{ steps.tts.outputs.code }}
        run: exit "$CODE"

  render:
    name: Render scene ${{ matrix.scene }}
    needs: [pick, voice]
    if: ${{ always() && !cancelled() && needs.pick.outputs.episode != '' && needs.pick.outputs.has_master != 'true' && (needs.pick.outputs.stage == 'render' || (needs.pick.outputs.stage == 'all' && needs.voice.outputs.complete == 'true')) }}
    runs-on: ubuntu-latest
    env:
      EPISODE: ${{ needs.pick.outputs.episode }}
      RELEASE_TAG: deepdive-${{ needs.pick.outputs.episode }}
      BUILD_DIR: build/deepdive/${{ needs.pick.outputs.episode }}
    timeout-minutes: 40
    strategy:
      fail-fast: true
      matrix:
        scene: [1, 2, 3, 4, 5, 6, 7, 8, 9]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install MotionStudio deps (ffmpeg + Inter)
        run: bash tools/install_motionstudio_deps.sh
      - name: Fetch the word timings (artifact from this run, else the bank)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p "$BUILD_DIR"
          if gh run download "$GITHUB_RUN_ID" -n "$EPISODE-words" -D "$BUILD_DIR" 2>/dev/null && [ -f "$BUILD_DIR/words.json" ]; then
            echo "timings from this run"
          else
            gh release download "$RELEASE_TAG" --pattern "$EPISODE-voice.tar.gz" -D /tmp
            tar -xzf "/tmp/$EPISODE-voice.tar.gz" -C "$BUILD_DIR"
            echo "timings from the bank"
          fi
          python3 -c "import json,sys; d=json.load(open('$BUILD_DIR/words.json')); sys.exit(1 if d.get('synthetic') else 0)" \
            || { echo '::error title=Synthetic timings::words.json is pace-estimated, not aligned to the voice — refusing to render for publish'; exit 1; }
      - name: Render
        env:
          SCENE: ${{ matrix.scene }}
        run: python3 tools/deepdive.py "$EPISODE" render "$SCENE"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ needs.pick.outputs.episode }}-scene-${{ matrix.scene }}
          path: ${{ env.BUILD_DIR }}/scenes/s${{ matrix.scene }}.mp4
          retention-days: 7

  master:
    name: Master + cover + QA
    needs: [pick, render]
    if: ${{ always() && !cancelled() && needs.render.result == 'success' }}
    runs-on: ubuntu-latest
    env:
      EPISODE: ${{ needs.pick.outputs.episode }}
      RELEASE_TAG: deepdive-${{ needs.pick.outputs.episode }}
      BUILD_DIR: build/deepdive/${{ needs.pick.outputs.episode }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install MotionStudio deps (ffmpeg + Inter)
        run: bash tools/install_motionstudio_deps.sh
      - name: Restore the voice + timings from the bank
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p "$BUILD_DIR"
          gh release download "$RELEASE_TAG" --pattern "$EPISODE-voice.tar.gz" -D /tmp
          tar -xzf "/tmp/$EPISODE-voice.tar.gz" -C "$BUILD_DIR"
      - name: Collect the nine scenes
        uses: actions/download-artifact@v4
        with:
          pattern: ${{ needs.pick.outputs.episode }}-scene-*
          path: ${{ env.BUILD_DIR }}/scenes
          merge-multiple: true
      - name: Master, cover, QA
        run: |
          ls -la "$BUILD_DIR/scenes"
          python3 tools/deepdive.py "$EPISODE" master
          python3 tools/deepdive.py "$EPISODE" cover
          python3 tools/deepdive.py "$EPISODE" qa
      - name: Bank the master, the cover and the cue sheet
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp "$BUILD_DIR/words.json" "/tmp/$EPISODE-words.json"
          cp "$BUILD_DIR/cues.json" "/tmp/$EPISODE-cues.json"
          cp "$BUILD_DIR/mix_report.json" "/tmp/$EPISODE-mix_report.json"
          gh release upload "$RELEASE_TAG" "$BUILD_DIR/$EPISODE-episode.mp4" "$BUILD_DIR/$EPISODE-cover.jpg" \
            "/tmp/$EPISODE-words.json" "/tmp/$EPISODE-cues.json" "/tmp/$EPISODE-mix_report.json" --clobber
          echo "::notice title=Master banked::$(gh release view "$RELEASE_TAG" --json url -q .url)"
      - name: Contact sheet for the run summary
        run: |
          set -e
          ff="$(command -v ffmpeg || python3 -c 'import imageio_ffmpeg;print(imageio_ffmpeg.get_ffmpeg_exe())')"
          mkdir -p /tmp/sheet
          dur=$(python3 -c "import json;print(int(json.load(open('$BUILD_DIR/words.json'))['sections'][-1]['end']))")
          for k in 1 2 3 4 5 6; do t=$(( dur * k / 7 )); "$ff" -loglevel error -ss "$t" -i "$BUILD_DIR/$EPISODE-episode.mp4" -frames:v 1 -vf scale=480:270 "/tmp/sheet/f$k.png"; done
          python3 - <<'PY'
          from PIL import Image
          ims=[Image.open('/tmp/sheet/f%d.png'%k) for k in range(1,7)]
          out=Image.new('RGB',(480*3+20,270*2+10),(40,40,40))
          for i,im in enumerate(ims): out.paste(im,((i%3)*490,(i//3)*280))
          out.save('/tmp/sheet/contact.jpg',quality=80)
          PY
          {
            echo "## Deep-Dive $EPISODE — master"
            echo
            python3 tools/deepdive.py "$EPISODE" meta | sed -n 's/^title=/**Title:** /p; s/^video_path=/**File:** /p'
            echo
            echo "**Sound:** $(python3 tools/deepdive.py "$EPISODE" cues | tail -1 | sed 's/^ *//') — bed $(python3 -c "import json;r=json.load(open('$BUILD_DIR/mix_report.json'));print('%.0f dB under the voice' % r['bed_separation_db'])")"
            echo
            echo "Six frames across the episode (download the master from the release to watch it):"
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ needs.pick.outputs.episode }}-contact-sheet
          path: /tmp/sheet/contact.jpg
          retention-days: 14

  publish:
    name: Publish to YouTube
    needs: [pick, voice, master]
    if: ${{ always() && !cancelled() && needs.pick.outputs.episode != '' && (needs.pick.outputs.stage == 'publish' || (needs.pick.outputs.stage == 'all' && (needs.master.result == 'success' || needs.pick.outputs.has_master == 'true'))) }}
    runs-on: ubuntu-latest
    env:
      EPISODE: ${{ needs.pick.outputs.episode }}
      RELEASE_TAG: deepdive-${{ needs.pick.outputs.episode }}
      BUILD_DIR: build/deepdive/${{ needs.pick.outputs.episode }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install the uploader's dependencies
        run: python -m pip install --quiet "requests>=2.31,<3" "Pillow>=10,<13" "numpy>=1.24,<3"
      - name: Restore the master, cover and timings from the bank
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p "$BUILD_DIR"
          gh release download "$RELEASE_TAG" --pattern "$EPISODE-episode.mp4" --pattern "$EPISODE-cover.jpg" --pattern "$EPISODE-words.json" -D "$BUILD_DIR"
          mv "$BUILD_DIR/$EPISODE-words.json" "$BUILD_DIR/words.json"
          ls -la "$BUILD_DIR"
      - name: Upload metadata
        id: meta
        run: python3 tools/deepdive.py "$EPISODE" meta
      - name: Preflight — credentials usable, channel named
        env:
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_CHANNEL_ID: ${{ vars.YT_CHANNEL_ID }}
        run: python3 tools/yt_publish.py --probe 2>&1 | tee /tmp/yt_preflight.log
      - name: Duplicate guard (long-form ledger)
        id: guard
        env:
          VIDEO_TITLE: ${{ steps.meta.outputs.title }}
          FORCE: ${{ needs.pick.outputs.force }}
        run: |
          set +e
          python3 tools/youtube_ledger.py --ledger logs/youtube_longform.json check --title "$VIDEO_TITLE" --date "$(date +%F)" --window-days 3650
          code=$?
          set -e
          if [ "$code" -eq 3 ] && [ "$FORCE" != "true" ]; then
            echo "skip=yes" >> "$GITHUB_OUTPUT"
            echo "::notice title=Already published::\"$VIDEO_TITLE\" is in logs/youtube_longform.json — nothing uploaded. Re-run with force=true to publish again."
          elif [ "$code" -ne 0 ] && [ "$code" -ne 3 ]; then
            exit "$code"
          else
            echo "skip=no" >> "$GITHUB_OUTPUT"
          fi
      - name: Upload to YouTube
        id: upload
        if: steps.guard.outputs.skip != 'yes'
        env:
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_CHANNEL_ID: ${{ vars.YT_CHANNEL_ID }}
          VIDEO_PATH: ${{ steps.meta.outputs.video_path }}
          VIDEO_TITLE: ${{ steps.meta.outputs.title }}
          VIDEO_DESCRIPTION: ${{ steps.meta.outputs.description }}
          VIDEO_TAGS: ${{ steps.meta.outputs.tags }}
          CATEGORY: ${{ steps.meta.outputs.category }}
          PRIVACY: ${{ needs.pick.outputs.privacy }}
        run: |
          set -o pipefail
          set +e
          python3 tools/yt_publish.py --video "$VIDEO_PATH" --title "$VIDEO_TITLE" \
            --description "$VIDEO_DESCRIPTION" --tags "$VIDEO_TAGS" --category "$CATEGORY" \
            --privacy "$PRIVACY" 2>&1 | tee /tmp/yt_upload.log
          code=${PIPESTATUS[0]}
          set -e
          marker() { sed -n "s/^$1=//p" /tmp/yt_upload.log | tail -1; }
          VIDEO_ID=$(marker VIDEO_ID)
          if [ -z "$VIDEO_ID" ]; then
            echo "::error title=No video id::yt_publish.py exited $code without a VIDEO_ID — nothing is recorded; read the channel before retrying."
            exit "${code:-1}"
          fi
          {
            echo "video_id=$VIDEO_ID"
            echo "video_url=https://www.youtube.com/watch?v=$VIDEO_ID"
            echo "result=$(marker YT_UPLOAD_RESULT)"
            echo "privacy_seen=$(marker YT_PRIVACY)"
            echo "size_bytes=$(stat -c%s "$VIDEO_PATH")"
          } >> "$GITHUB_OUTPUT"
          exit "$code"
      - name: Set the thumbnail (never fails the publish)
        if: steps.upload.outputs.video_id != ''
        continue-on-error: true
        env:
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          VIDEO_ID: ${{ steps.upload.outputs.video_id }}
          COVER: ${{ steps.meta.outputs.cover_path }}
        run: python3 tools/yt_thumbnail.py --video-id "$VIDEO_ID" --image "$COVER"
      - name: Record in the long-form ledger
        if: always() && steps.upload.outputs.video_id != ''
        env:
          VIDEO_TITLE: ${{ steps.meta.outputs.title }}
          VIDEO_TOPIC: ${{ steps.meta.outputs.topic }}
          VIDEO_ID: ${{ steps.upload.outputs.video_id }}
          VIDEO_URL: ${{ steps.upload.outputs.video_url }}
          PRIVACY: ${{ steps.upload.outputs.privacy_seen || needs.pick.outputs.privacy }}
          STATE: ${{ steps.upload.outputs.result }}
          SIZE_BYTES: ${{ steps.upload.outputs.size_bytes }}
        run: |
          python3 tools/youtube_ledger.py --ledger logs/youtube_longform.json record \
            --state "${STATE:-uploaded}" --title "$VIDEO_TITLE" --topic "$VIDEO_TOPIC" \
            --video-id "$VIDEO_ID" --url "$VIDEO_URL" --privacy "$PRIVACY" \
            --date "$(date +%F)" --run-id "$GITHUB_RUN_ID" --size-bytes "${SIZE_BYTES:-0}"
      - name: Commit the ledger
        if: always() && steps.upload.outputs.video_id != ''
        continue-on-error: true
        env:
          BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase --autostash origin "$BRANCH" || { echo "::warning title=Ledger not committed::could not rebase on $BRANCH"; exit 1; }
          git add logs/youtube_longform.json
          git diff --staged --quiet || { git commit -m "Auto: record Deep-Dive $EPISODE published $(date +%F) [skip ci]" && git push origin "HEAD:$BRANCH"; }
      - name: Run summary
        if: always()
        env:
          TITLE: ${{ steps.meta.outputs.title }}
          VIDEO_URL: ${{ steps.upload.outputs.video_url }}
          RESULT: ${{ steps.upload.outputs.result }}
          PRIVACY_SEEN: ${{ steps.upload.outputs.privacy_seen }}
          PRIVACY_ASKED: ${{ needs.pick.outputs.privacy }}
          SKIP: ${{ steps.guard.outputs.skip }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo "## Deep-Dive $EPISODE — publish"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| Title | $TITLE |"
            echo "| Privacy | ${PRIVACY_SEEN:-$PRIVACY_ASKED} |"
            if [ "$SKIP" = "yes" ]; then echo "| Result | ⏭️ already in the ledger — nothing uploaded |";
            elif [ -n "$VIDEO_URL" ]; then echo "| Result | ✅ ${RESULT:-uploaded} — $VIDEO_URL |";
            else echo "| Result | ❌ not uploaded — see the log |"; fi
            echo "| Bank | $(gh release view "$RELEASE_TAG" --json url -q .url 2>/dev/null || echo "release $RELEASE_TAG") |"
          } >> "$GITHUB_STEP_SUMMARY"
        shell: bash
      - name: Open a visible issue if the publish failed
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          TITLE: ${{ steps.meta.outputs.title }}
          VIDEO_URL: ${{ steps.upload.outputs.video_url }}
        run: |
          gh label create youtube-automation --color FF5A5F --description "Unattended YouTube pipelines" >/dev/null 2>&1 || true
          if [ -n "$VIDEO_URL" ]; then STATE_LINE="**A video exists**: $VIDEO_URL — do NOT re-run before checking it."; else STATE_LINE="**Nothing was published** — a re-run is safe."; fi
          printf 'The Deep-Dive publish for **%s** failed.\n\n- Run: %s\n- Title: %s\n- %s\n\n```\n%s\n```\n' \
            "$EPISODE" "$RUN_URL" "${TITLE:-unknown}" "$STATE_LINE" "$(tail -n 40 /tmp/yt_upload.log 2>/dev/null || tail -n 25 /tmp/yt_preflight.log 2>/dev/null || echo '(no uploader log)')" > /tmp/issue.md
          gh issue create --title "Deep-Dive $EPISODE publish failed — $(date +%F)" --label youtube-automation --body-file /tmp/issue.md

  # A red voice job is now a REAL error (quota pauses stay green) — say so where the owner looks.
  voice-report:
    name: Voice report
    needs: [pick, voice]
    if: ${{ always() && needs.voice.result == 'failure' }}
    runs-on: ubuntu-latest
    env:
      EPISODE: ${{ needs.pick.outputs.episode }}
      RELEASE_TAG: deepdive-${{ needs.pick.outputs.episode }}
      BUILD_DIR: build/deepdive/${{ needs.pick.outputs.episode }}
    permissions:
      issues: write
    steps:
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          REPO: ${{ github.repository }}
        run: |
          echo "## Deep-Dive $EPISODE — voice stage failed (not a quota pause)" >> "$GITHUB_STEP_SUMMARY"
          echo "Quota pauses end green; this is something else — a bad key, a model that moved, or Vosk refusing. Run: $RUN_URL" >> "$GITHUB_STEP_SUMMARY"
          gh label create youtube-automation --color FF5A5F --description "Unattended YouTube pipelines" -R "$REPO" >/dev/null 2>&1 || true
          # one open issue per episode; comment on it rather than piling up
          EXISTING="$(gh issue list -R "$REPO" --label youtube-automation --state open --search "Deep-Dive $EPISODE voice failed" --json number -q '.[0].number')"
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" -R "$REPO" --body "Failed again: $RUN_URL"
          else
            gh issue create -R "$REPO" --title "Deep-Dive $EPISODE voice failed — $(date +%F)" --label youtube-automation \
              --body "The Gemini TTS / Vosk stage failed for a reason other than quota. Run: $RUN_URL — open the *Voice* job log; the engine prints what it saw."
          fi
