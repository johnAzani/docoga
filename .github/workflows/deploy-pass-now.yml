name: Deploy docoga-pass (gated)

# Why this marker-gated path exists alongside deploy-pass.yml
# -----------------------------------------------------------
# Arena's GitHub integration cannot reliably dispatch Actions workflows, so use
# a push with an explicit commit marker from the session branch instead. The
# gate prevents normal documentation/code pushes from deploying accidentally:
#
#     git commit -m ".... [deploy-pass]"
# Read-only authentication diagnostics use [check-pass-auth]; never publish.
#
# Keep this route until workflow dispatch is verified usable from the agent; the
# default-branch workflow is not a substitute when dispatch returns 403.

on:
  push:
    branches: ['**']
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Validate only, do not publish'
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  pull-requests: write

jobs:
  deploy:
    # The gate. workflow_dispatch always runs; pushes need the marker.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.head_commit.message, '[deploy-pass]') ||
      contains(github.event.head_commit.message, '[check-pass-auth]')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: '22'

      # No credentials, Cloudflare API calls, live probes, or publish in dry-run.
      - name: Validate worker only (manual dry-run)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: |
          set -euo pipefail
          cd worker
          npx --yes wrangler@latest deploy --config wrangler.toml --keep-vars --dry-run --outdir "$RUNNER_TEMP/pass-dry-run"

      - name: Confirm the secrets are reachable
        if: ${{ github.event_name != 'workflow_dispatch' || !inputs.dry_run }}
        env:
          HAS_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          HAS_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -u
          if [ -z "${HAS_TOKEN:-}" ] || [ -z "${HAS_ACCOUNT:-}" ]; then
            echo "RESULT=MISSING_SECRETS" >> "$GITHUB_ENV"
            echo "::error::CLOUDFLARE_API_TOKEN and/or CLOUDFLARE_ACCOUNT_ID are not set."
            echo "::error::Add them at Settings > Secrets and variables > Actions."
            exit 1
          fi
          echo "RESULT=SECRETS_PRESENT" >> "$GITHUB_ENV"
          echo "Both secrets are present."

      - name: Verify the token against Cloudflare
        if: ${{ (github.event_name != 'workflow_dispatch' || !inputs.dry_run) && env.RESULT == 'SECRETS_PRESENT' }}
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DEPLOY_LOG: ${{ runner.temp }}/deploy.log
        run: |
          set -euo pipefail
          : > "$DEPLOY_LOG"
          echo "DEPLOY_LOG=$DEPLOY_LOG" >> "$GITHUB_ENV"
          # Read-only; fixed labels/statuses only, no credentials/API bodies.
          python3 tools/verify_cloudflare_token.py | tee -a "$DEPLOY_LOG"

      - name: Deploy worker/ as docoga-pass
        if: ${{ (github.event_name != 'workflow_dispatch' || !inputs.dry_run) && env.RESULT == 'SECRETS_PRESENT' && !contains(github.event.head_commit.message, '[check-pass-auth]') }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DEPLOY_LOG: ${{ runner.temp }}/deploy.log
        run: |
          set -euo pipefail
          touch "$DEPLOY_LOG"
          echo "########## wrangler deploy (explicit config; preserve dashboard vars) ##########" | tee -a "$DEPLOY_LOG"
          # Remote/local config diffs may contain dashboard values. Capture raw
          # output privately, sanitize it before publishing, and delete on exit.
          RAW_WRANGLER_LOG="${RUNNER_TEMP}/wrangler-deploy.raw.log"
          trap 'rm -f "$RAW_WRANGLER_LOG"' EXIT
          set +e
          ( cd worker && npx --yes wrangler@latest deploy --config wrangler.toml --keep-vars ) >"$RAW_WRANGLER_LOG" 2>&1
          DEXIT=$?
          set -e
          python3 tools/redact_deploy_log.py "$RAW_WRANGLER_LOG" | tee -a "$DEPLOY_LOG"
          echo "deploy_exit=$DEXIT" | tee -a "$DEPLOY_LOG"
          echo "DEPLOY_LOG=$DEPLOY_LOG" >> "$GITHUB_ENV"
          exit "$DEXIT"

      - name: Probe the live worker
        if: ${{ (github.event_name != 'workflow_dispatch' || !inputs.dry_run) && env.RESULT == 'SECRETS_PRESENT' && !contains(github.event.head_commit.message, '[check-pass-auth]') }}
        env:
          WORKER: https://docoga-pass.johnazani.workers.dev
        run: |
          set -euo pipefail
          # /verify can issue/email a paid purchase; never use it as a probe.
          # Missing code is rejected before any KV access, activation or email.
          STATUS=$(curl -sS --max-time 25 -o "$RUNNER_TEMP/activate-probe.json" -w '%{http_code}' "$WORKER/activate")
          test "$STATUS" = 400
          python3 -c 'import json,sys; d=json.load(open(sys.argv[1])); assert d.get("ok") is False and d.get("error") == "code required"' "$RUNNER_TEMP/activate-probe.json"
          echo "Live activation rejection probe passed (no issuance or email)."

      - name: Post result where the agent can read it
        if: ${{ always() && (github.event_name != 'workflow_dispatch' || !inputs.dry_run) }}
        uses: actions/github-script@v8
        env:
          DEPLOY_LOG: ${{ env.DEPLOY_LOG }}
        with:
          script: |
            const fs = require('fs');
            let body = '<!-- deploy-pass-log -->\n';
            body += '## docoga-pass deploy\n\n';
            body += `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}\n\n`;
            const logPath = process.env.DEPLOY_LOG;
            if (logPath && fs.existsSync(logPath)) {
              const log = fs.readFileSync(logPath, 'utf8');
              body += '```\n' + log.slice(-14000) + '\n```\n';
            } else {
              body += '(no deploy log captured)\n';
            }
            const ISSUE = 11;
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner, repo: context.repo.repo, issue_number: ISSUE,
            });
            const marker = '<!-- deploy-pass-log -->';
            const existing = comments.find(c => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner, repo: context.repo.repo,
                comment_id: existing.id, body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: ISSUE, body,
              });
            }
