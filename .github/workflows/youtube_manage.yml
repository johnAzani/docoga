name: DocOga YouTube Manage

# Deletes, unlists or re-publishes videos on the DocOga channel from a plan file —
# the one YouTube job that is *not* an upload.
#
# Owner, 16 Oct 2026: "delete n45ufAFv5OM, unlist 2ruPSaR8-M0 and oBsWKR4AUNA — I
# want you to be able to delete it." Before this file, every after-the-fact change
# meant the Studio app on his phone. Now: a line in `logs/youtube_cleanup_plan.txt`
# merged to main is the whole act. This job runs when that file changes (and on
# dispatch), applies each line through tools/yt_manage.py, and records every
# finished line in `logs/youtube_manage.json` so nothing is ever applied twice —
# which is what makes "run it again" always safe.
#
# What can stop it, honestly: the token. The refresh token minted on setup day
# carries `youtube.upload` + `youtube.readonly`; delete and update need
# `youtube.force-ssl`. The tool reads the token's scopes first and, if the write
# scope is missing, stops with exit 2 and the one re-consent line *before* a single
# video is touched. That run is yellow with an issue that says exactly what to do;
# the plan stays pending and runs by itself on the next push or dispatch.

on:
  push:
    branches: [main]
    paths:
      - 'logs/youtube_cleanup_plan.txt'
  workflow_dispatch:
    inputs:
      plan:
        description: 'Inline plan, e.g. "delete abcdefghijk; unlist 2ruPSaR8-M0 oBsWKR4AUNA" — leave empty to run logs/youtube_cleanup_plan.txt'
        required: false
        type: string
      dry_run:
        description: 'Read every video and say what would change, without changing it'
        required: false
        default: false
        type: boolean

permissions:
  contents: write  # logs/youtube_manage.json is committed back — the idempotency record
  issues: write    # a refused plan opens a visible issue with the fix

concurrency:
  group: youtube-manage
  cancel-in-progress: false

jobs:
  manage:
    name: Apply the YouTube plan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
      SOCIAL_TOKEN_KEY: ${{ secrets.SOCIAL_TOKEN_KEY }}
      YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
      YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install the one dependency
        run: python3 -m pip install --quiet "requests>=2.31,<3" cryptography

      - name: Apply the plan
        id: apply
        env:
          IN_PLAN: ${{ inputs.plan }}
          IN_DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -o pipefail
          # Dispatch strings reach the tool through env and `--plan-text`, never by
          # interpolation into this command line.
          ARGS=()
          [ "$IN_DRY_RUN" = "true" ] && ARGS+=(--dry-run)
          if [ -n "${IN_PLAN:-}" ]; then
            ARGS+=(--plan-text "$IN_PLAN")
          else
            ARGS+=(--plan logs/youtube_cleanup_plan.txt)
          fi
          set +e
          python3 tools/yt_manage.py "${ARGS[@]}" 2>&1 | tee /tmp/yt_manage.log
          CODE=${PIPESTATUS[0]}
          set -e
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          {
            echo "### YouTube manage — $(date -u +%FT%TZ)"
            echo
            case "$CODE" in
              0) echo "- result: ✅ every line done (or already done)" ;;
              2) echo "- result: ⏸ **the token cannot delete or update yet** — re-mint \`YT_REFRESH_TOKEN\` with the \`youtube.force-ssl\` scope (YOUTUBE_AUTOMATION.md → \"Mint the refresh token\"); the plan stays pending and runs again by itself" ;;
              3) echo "- result: ❌ YouTube refused at least one line — see the log; the refused lines stay pending" ;;
              4) echo "- result: ❌ the plan is malformed — see the log" ;;
              *) echo "- result: ❌ exit $CODE" ;;
            esac
            echo '```'
            tail -n 25 /tmp/yt_manage.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$CODE"

      # The record is what makes a re-run safe, so it is committed even when a later
      # line was refused: whatever *did* happen must never happen twice.
      - name: Commit the record
        if: ${{ always() && !inputs.dry_run }}
        continue-on-error: true
        env:
          BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          [ -f logs/youtube_manage.json ] || { echo "No record written."; exit 0; }
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add logs/youtube_manage.json
          # A schedule line also writes publish_at into the publish ledgers (tools/yt_manage.py
          # note_schedule, 25 Oct 2026) — the rows every other lane dates an episode by.
          for path in logs/youtube_longform.json logs/youtube_published.json; do
            if [ -e "$path" ]; then git add "$path"; fi
          done
          if git diff --staged --quiet; then echo "Record unchanged."; exit 0; fi
          git commit -q -m "Auto: record YouTube manage $(date -u +%F) [skip ci]"
          git pull --rebase --autostash origin "$BRANCH" >/dev/null 2>&1 || true
          git push origin "HEAD:$BRANCH" || echo "::warning title=Record not pushed::the actions happened; the record did not reach $BRANCH, so a re-run would read the videos again (and find them already done)"

      - name: Open a visible issue if the plan could not be applied
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          CODE: ${{ steps.apply.outputs.code }}
        run: |
          set -uo pipefail
          TAIL=$(tail -n 30 /tmp/yt_manage.log 2>/dev/null || echo "(no output)")
          case "${CODE:-}" in
            2) CAUSE=scope ;;
            4) CAUSE=plan ;;
            *) CAUSE=refused ;;
          esac
          gh label create youtube-automation --color FF0000 --description "Unattended YouTube lanes" >/dev/null 2>&1 || true
          cat > /tmp/issue_body.md <<BODY
          The YouTube plan in \`logs/youtube_cleanup_plan.txt\` could not be applied (cause: **$CAUSE**).

          - Run: $RUN_URL

          \`\`\`
          $TAIL
          \`\`\`

          ### Reading it

          - **scope** — the refresh token can upload and read but not delete or update. One-time fix:
            OAuth Playground → gear → *Use your own OAuth credentials* (same client id/secret) →
            Step 1 → *Input your own scopes* → \`https://www.googleapis.com/auth/youtube.force-ssl\`
            → Authorize APIs (the DocOga channel's Google account) → Step 2 → *Exchange authorization
            code for tokens* → copy the **Refresh token** → GitHub → Settings → Secrets → update
            \`YT_REFRESH_TOKEN\` (only that one). It is a superset scope: the Shorts and Deep-Dive
            uploads keep working. Then Actions → DocOga YouTube Manage → Run workflow.
          - **refused** — YouTube said no to a line (quota, not our video, a strike). The line stays
            pending; the log names it.
          - **plan** — a line in the plan file is malformed; the log says which.
          BODY
          EXISTING=$(gh issue list --label youtube-automation --state open --limit 50 --json number,title \
            --jq "[.[] | select(.title | contains(\"YouTube plan\")) | .number] | max // empty")
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body-file /tmp/issue_body.md || true
          else
            gh issue create --title "YouTube plan not applied — $(date +%F) [$CAUSE]" \
              --label youtube-automation --body-file /tmp/issue_body.md 2>/tmp/issue.err \
              || echo "::warning title=Issue not created::$(tr '\n' ' ' < /tmp/issue.err | cut -c1-300)"
          fi
