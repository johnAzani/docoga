name: Deploy payment worker (docoga-pass)

# Why this exists
# --------------
# docoga-pass is NOT currently deployed: /, /verify and /activate all return
# Cloudflare's empty page, so the checkout cannot issue codes. See
# docs/DEPLOY_STATUS.md for the evidence.
#
# This deploys worker/ (worker/wrangler.toml: name="docoga-pass",
# main="index.js", KV binding f3a5afebe7d04bb0a6018c0d7d355253) using the
# official wrangler action, so the agent can do it from the sandbox once
# CLOUDFLARE_API_TOKEN exists — no dashboard access needed.
#
# Secrets are NOT created by this workflow. Set them once, outside the repo:
#   gh secret set CLOUDFLARE_API_TOKEN
#   gh secret set CLOUDFLARE_ACCOUNT_ID
# The token needs the "Edit Cloudflare Workers" template, which includes
# Workers Scripts:Edit AND Workers KV Storage:Edit (the KV edit is required —
# the worker binds a KV namespace for issued codes).

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Build and validate only, do not publish'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: Check that secrets exist
        env:
          HAS_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          HAS_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -u
          if [ -z "${HAS_TOKEN:-}" ] || [ -z "${HAS_ACCOUNT:-}" ]; then
            echo "::error::Missing secrets. Set them with:"
            echo "::error::  gh secret set CLOUDFLARE_API_TOKEN"
            echo "::error::  gh secret set CLOUDFLARE_ACCOUNT_ID"
            exit 1
          fi
          echo "Both secrets are present."

      - name: Deploy docoga-pass
        uses: cloudflare/wrangler-action@v4
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: 'worker'
          command: >-
            deploy
            ${{ inputs.dry_run && '--dry-run --outdir /tmp/dryrun' || '' }}

      - name: Verify the worker answers
        if: ${{ !inputs.dry_run }}
        env:
          WORKER: https://docoga-pass.johnazani.workers.dev
        run: |
          set -u
          echo "########## /activate (bogus code -> expect JSON, not the empty page) ##########"
          curl -sS -i --max-time 25 "$WORKER/activate?code=BOGUSTEST123" \
            -w '\nhttp_code=%{http_code}\n' | head -30
          echo
          echo "########## /verify (bogus ref -> expect JSON, not the empty page) ##########"
          curl -sS -i --max-time 25 "$WORKER/verify?ref=TESTREF123" \
            -w '\nhttp_code=%{http_code}\n' | head -30

      - name: Post result as a PR comment
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v8
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: context.issue.number,
              body: '<!-- deploy-pass -->\nDeploy run: ' +
                    `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
