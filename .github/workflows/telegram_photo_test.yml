name: DocOga Telegram Photo Post Test

on:
  workflow_dispatch:

jobs:
  send-photo:
    name: Send Photo Post to Telegram
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Install requests
        run: python3 -m pip install requests
      
      - name: Send photo to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python3 << 'PYEOF'
          import requests, os

          BOT_TOKEN = os.environ["TELEGRAM_BOT_TOKEN"]
          CHAT_ID = os.environ["TELEGRAM_CHAT_ID"]

          caption = """🏠 *DAILY DOCUMENT TIP* 🏠

Renting in Lagos? Here is what you MUST know about *Caution Fees*:

💡 Many landlords charge ₦50k–₦200k as caution fee but refuse to refund when you move out!

✅ *How to Protect Yourself:*
1️⃣ Get a written receipt
2️⃣ Include it in your tenancy agreement
3️⃣ Take photos of the apartment before moving in
4️⃣ Request a move-out inspection

📋 *Need proper documents?*
DocOga has templates for:
• Tenancy Agreements
• Rent Receipts
• Notice to Quit
• Caution Fee Receipts

👉 Visit: https://docoga.com.ng

🔔 *Subscribe for daily tips!*"""

          with open("brand/official-logo-transparent.png", "rb") as photo:
              resp = requests.post(
                  f"https://api.telegram.org/bot{BOT_TOKEN}/sendPhoto",
                  data={"chat_id": CHAT_ID, "caption": caption, "parse_mode": "Markdown"},
                  files={"photo": photo},
                  timeout=30
              )

          result = resp.json()
          if result.get("ok"):
              print(f"✅ Photo sent! Message ID: {result['result']['message_id']}")
          else:
              print(f"❌ Error: {result.get('description', 'Unknown')}")
          PYEOF