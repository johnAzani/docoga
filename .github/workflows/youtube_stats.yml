name: YouTube stats — weekly snapshot

# Pulls the channel's numbers (views, likes, comments, and — once the token carries the
# analytics scope — watch time, retention, impressions, traffic sources) into
# logs/youtube_stats.json + docs/YOUTUBE_PERFORMANCE.md, so what to make next is decided on
# data. Read-only: never touches a video. Cost: ~3–5 Data API quota units a run.

on:
  schedule:
    - cron: '0 5 * * 1'          # Mondays 06:00 WAT
  workflow_dispatch:
    inputs:
      days:
        description: 'Analytics window in days'
        required: false
        default: '28'
        type: string

permissions:
  contents: write

concurrency:
  group: youtube-stats
  cancel-in-progress: false

env:
  TZ: Africa/Lagos

jobs:
  stats:
    name: Snapshot the channel
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --quiet "requests>=2.31,<3"
      - name: Pull the numbers
        id: pull
        env:
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          DAYS: ${{ inputs.days }}
        run: |
          set -o pipefail
          python3 tools/yt_stats.py --days "${DAYS:-28}" 2>&1 | tee /tmp/yt_stats.log
      - name: Put the report in the run summary
        if: always()
        run: |
          if [ -f docs/YOUTUBE_PERFORMANCE.md ]; then cat docs/YOUTUBE_PERFORMANCE.md >> "$GITHUB_STEP_SUMMARY"; else tail -n 20 /tmp/yt_stats.log >> "$GITHUB_STEP_SUMMARY"; fi
      - name: Commit the snapshot
        continue-on-error: true
        env:
          BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase --autostash origin "$BRANCH" || { echo "::warning title=Stats not committed::could not rebase on $BRANCH"; exit 1; }
          git add logs/youtube_stats.json docs/YOUTUBE_PERFORMANCE.md
          git diff --staged --quiet || { git commit -m "Auto: YouTube stats snapshot $(date +%F) [skip ci]" && git push origin "HEAD:$BRANCH"; }
