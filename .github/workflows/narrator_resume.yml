name: Narrator — warm up and resume at the quota reset

# Owner, 15 Oct 2026: "I want to automatically know when the voice over resets
# and automatically continue at that time instead of a retry cron three hours
# after. I want it to be knowledgeable."
#
# Gemini's free daily buckets refill at midnight Pacific time. This workflow runs
# a few minutes after that moment and does two things:
#
#   1. WARM UP — synthesise and cache today's Shorts/Reels narration (six lines,
#      the locked narrator) while the bucket is full, so the evening Short and
#      the morning Reel need no fresh quota at all.
#   2. RESUME — if a scheduled Short or Reel is owed (its slot passed and nothing
#      has been published since — usually because the narrator's bucket was
#      empty and the lane paused rather than ship voiceless), dispatch that lane
#      now, for the day it was owed.
#
# Two cron lines because "midnight Pacific" is 07:00 UTC in summer and 08:00 UTC
# in winter. `tools/gemini_quota.py just-reset` computes the real reset from the
# America/Los_Angeles zone and lets exactly one of the two runs proceed; the other
# stands down in seconds. No hour is hard-coded in the code.
#
# 4 Nov 2026 — the Short waits for the evening. The reset run used to dispatch an
# owed Short at once: the 3 Nov Short (lost to a render fault) went out at 9:16am on
# 4 Nov as a Reel on the Page fourteen minutes before the 9:30am card, which then
# stood down as "already posted today". Now the reset run only REPORTS an owed
# Short; the third cron line (5:30pm WAT, every day) makes it up — rendered then,
# public on YouTube at 6:00pm, one hour before the day's own Short so a series stays
# in order, and never in the morning card's hour. A Reel owed (its slot IS the
# morning) is still resumed at the reset.

on:
  schedule:
    - cron: '12 7 * * *'    # 00:12 Pacific daylight time (= 08:12 WAT)
    - cron: '12 8 * * *'    # 00:12 Pacific standard time (= 09:12 WAT)
    - cron: '30 16 * * *'   # 5:30pm WAT daily — make up an owed Short at the evening slot
  workflow_dispatch:
    inputs:
      force:
        description: 'Run even if a Pacific midnight did not just pass (warm the cache now; resume anything owed — the Short too, at once)'
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  actions: write      # dispatches the Shorts / Reels workflows when one is owed

concurrency:
  group: narrator-resume
  cancel-in-progress: false

jobs:
  resume:
    name: Reset check → warm the narrator → resume what is owed
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out the repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      # Which run is this? `go=yes` = the reset minute (warm the lines, resume a Reel);
      # `makeup=yes` = the 5:30pm make-up slot (resume a Short, public at 6pm). The clock
      # worker dispatches both lines as workflow_dispatch, so the minute is read from the
      # clock, never from `github.event.schedule`.
      - name: Did a Pacific midnight just pass?
        id: reset
        env:
          IN_FORCE: ${{ inputs.force }}
        run: |
          set +e
          python3 tools/gemini_quota.py just-reset --window 45
          code=$?
          python3 tools/gemini_quota.py makeup-slot --window 45
          mcode=$?
          set -e
          if [ "$code" -eq 0 ] || [ "$IN_FORCE" = "true" ]; then
            echo "go=yes" >> "$GITHUB_OUTPUT"
          else
            echo "go=no" >> "$GITHUB_OUTPUT"
          fi
          if [ "$mcode" -eq 0 ] || [ "$IN_FORCE" = "true" ]; then
            echo "makeup=yes" >> "$GITHUB_OUTPUT"
          else
            echo "makeup=no" >> "$GITHUB_OUTPUT"
          fi
          if [ "$code" -ne 0 ] && [ "$mcode" -ne 0 ] && [ "$IN_FORCE" != "true" ]; then
            echo "neither the reset minute for this season's clocks nor the 5:30pm make-up slot. Standing down."
          fi

      - name: Install MotionStudio deps (ffmpeg + Inter) and the renderer's libraries
        if: steps.reset.outputs.go == 'yes'
        run: |
          bash tools/install_motionstudio_deps.sh
          bash tools/install_wordsync_deps.sh   # Vosk word times for kinetic captions (best effort)
          python3 -m pip install --quiet -r requirements-youtube.txt

      - name: Restore the narrator's cached clips and the quota ledger
        if: steps.reset.outputs.go == 'yes'
        uses: actions/cache/restore@v5
        with:
          path: assets/shorts_voice
          key: shorts-voice-v2-${{ github.run_id }}
          restore-keys: shorts-voice-v2-

      - name: Warm up — today's narration into the cache (no render, no publish)
        id: warm
        if: steps.reset.outputs.go == 'yes'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_TTS_MODEL: ${{ vars.GEMINI_TTS_MODEL }}
          NARRATOR_LANE: warm-up
          SHORTS_VOICE: optional     # a warm-up that cannot speak is a line in the summary, not a red run
        run: |
          set +e
          python3 tools/shorts_sound.py warm 2>&1 | tee /tmp/warm.log
          code=${PIPESTATUS[0]}
          set -e
          echo "ok=$([ "$code" -eq 0 ] && echo yes || echo no)" >> "$GITHUB_OUTPUT"
          [ "$code" -eq 0 ] || echo "::warning title=Warm-up could not speak::$(tail -1 /tmp/warm.log)"

      # Saved here, before anything is dispatched, so the lanes that start next
      # restore a cache that already holds today's lines.
      - name: Save the narrator's cached clips and the quota ledger
        if: steps.reset.outputs.go == 'yes'
        uses: actions/cache/save@v5
        with:
          path: assets/shorts_voice
          key: shorts-voice-v2-${{ github.run_id }}

      - name: What is owed? (a slot passed, nothing published since)
        id: owed
        if: steps.reset.outputs.go == 'yes' || steps.reset.outputs.makeup == 'yes'
        run: python3 tools/gemini_quota.py owed | tee /tmp/owed.log

      # The reset run only says so; the 5:30pm run (or a forced dispatch) does it.
      - name: An owed Short waits for the evening slot
        if: steps.reset.outputs.go == 'yes' && steps.reset.outputs.makeup != 'yes' && steps.owed.outputs.owed_shorts == 'yes'
        run: |
          FOR_DATE=$(sed -n 's/^shorts //p' /tmp/owed.log | tail -1)
          echo "::notice title=Short owed — made up this evening::The Short of $FOR_DATE has no publish. It is rendered at 5:30pm WAT and goes public at 6:00pm, an hour before today's own — not now, in the morning card's hour."

      - name: Resume the Short that is owed
        if: steps.reset.outputs.makeup == 'yes' && steps.owed.outputs.owed_shorts == 'yes'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ github.event.repository.default_branch }}
          PUBLISH_AT: ${{ steps.reset.outputs.publish_at }}
        run: |
          FOR_DATE=$(sed -n 's/^shorts //p' /tmp/owed.log | tail -1)
          gh workflow run youtube_scheduled.yml --ref "$BRANCH" -f for_date="$FOR_DATE" -f publish_at="${PUBLISH_AT:-18:00}"
          echo "dispatched youtube_scheduled.yml for the Short of $FOR_DATE — public at ${PUBLISH_AT:-18:00} WAT"

      - name: Resume the Reel that is owed
        if: steps.reset.outputs.go == 'yes' && steps.owed.outputs.owed_reel == 'yes'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          FOR_DATE=$(sed -n 's/^reel //p' /tmp/owed.log | tail -1)
          gh workflow run facebook_autopost.yml --ref "$BRANCH" -f mode=reel -f for_date="$FOR_DATE"
          echo "dispatched facebook_autopost.yml (mode=reel) for the Reel of $FOR_DATE"

      - name: Run summary
        if: always()
        env:
          GO: ${{ steps.reset.outputs.go }}
          MAKEUP: ${{ steps.reset.outputs.makeup }}
          WARM_OK: ${{ steps.warm.outputs.ok }}
          OWED_SHORTS: ${{ steps.owed.outputs.owed_shorts }}
          OWED_REEL: ${{ steps.owed.outputs.owed_reel }}
        run: |
          {
            echo "## Narrator — $(date -u +%FT%TZ)"
            echo
            if [ "$GO" != "yes" ] && [ "$MAKEUP" != "yes" ]; then
              echo "- ⏭ neither the reset minute for this season's clocks nor the 5:30pm make-up slot — stood down"
            elif [ "$GO" != "yes" ]; then
              echo "- 🌆 5:30pm make-up slot · owed Short: ${OWED_SHORTS:-no}$([ "$OWED_SHORTS" = "yes" ] && echo ' — dispatched, public at 6:00pm WAT; see the Shorts lane'"'"'s own run')"
            else
              echo "- $(python3 tools/gemini_quota.py status 2>/dev/null || echo 'narrator bucket: unknown')"
              echo "- warm-up: $([ "$WARM_OK" = "yes" ] && echo '✅ today'"'"'s lines are cached' || echo '⚠️ could not speak — see the warning')"
              echo "- owed Reel: ${OWED_REEL:-no}$([ "$OWED_REEL" = "yes" ] && echo ' — dispatched; see the lane'"'"'s own run')"
              echo "- owed Short: ${OWED_SHORTS:-no}$([ "$OWED_SHORTS" = "yes" ] && [ "$MAKEUP" != "yes" ] && echo ' — waits for the 5:30pm make-up slot (public 6:00pm), never the morning')$([ "$OWED_SHORTS" = "yes" ] && [ "$MAKEUP" = "yes" ] && echo ' — dispatched now (forced)')"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
