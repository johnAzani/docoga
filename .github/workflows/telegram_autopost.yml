name: DocOga Telegram Auto-Post

# Posts daily content to the @docogadaily Telegram channel
# Runs at 9 AM Nigeria time (UTC+1 = 8 AM UTC)
#
# Hardened 11 Oct 2026 after four days of silent failure (7–10 Oct). The post
# itself was failing on a MarkdownV2 escaping bug, but the reason nobody knew
# was structural, and those three gaps are what this workflow now closes:
#   1. a preflight that asks Telegram whether the bot may post at all, and says
#      which of token / chat / permissions is wrong (tools/telegram_preflight.py),
#   2. the poster's own words on stderr captured to a file, so the exact API
#      error lands in the issue instead of only in the run log,
#   3. a labelled issue when a run fails, so a broken day is not just a red dot.
#
# `workflow_dispatch` also accepts dry_run=true: the preflight still runs (and
# still opens an issue if the token, chat or permissions are wrong), but
# nothing is generated and nothing is posted. That answers "can the bot post?"
# without publishing to the channel.
#
# Ledger added 13 Oct 2026, for two reasons at once. The channel carried the same
# caution-fee paragraph four times in four hours on 3 Oct, because five runs (one
# scheduled, four dispatches) each began with no idea what was already posted — so the
# poster now checks `logs/telegram_sent.json` by content, before it sends. And the lane
# had no durable record of publishing at all: `logs/social_media.log` is gitignored
# scratch, which is how "nothing has succeeded in 9 days" and "the channel got a post
# on 7 Oct" were both true and checkable by nobody. `force=true` re-posts anyway.

on:
  schedule:
    - cron: '0 8 * * *'  # 8 AM UTC = 9 AM Nigeria time (UTC+1)
  workflow_dispatch:     # Allow manual triggering
    inputs:
      dry_run:
        description: 'Check credentials and permissions only — do not post anything'
        required: false
        default: false
        type: boolean
      force:
        description: 'Post even if this exact content is already in the ledger'
        required: false
        default: false
        type: boolean

permissions:
  # `write`, and for one path only: the publish ledger this job commits back after a
  # successful post. The comment step still gets its issue via `issues: write`. A
  # monitor or publisher that can push must be able to say what it pushes.
  contents: write
  issues: write          # a failed run opens (or comments on) a visible issue

jobs:
  generate-and-post:
    name: Generate Content & Post to Telegram
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      TZ: Africa/Lagos

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      # Runs before any dependency install: it is stdlib-only, and a dead token
      # or a demoted bot should cost seconds, not a whole run. Each failure
      # names the cause instead of leaving an unexplained red X.
      - name: Preflight — may the bot post to the channel?
        run: |
          set -o pipefail
          python3 tools/telegram_preflight.py 2>&1 | tee /tmp/telegram_preflight.log

      - name: Install dependencies
        if: ${{ !inputs.dry_run }}
        run: |
          pip install requests Pillow numpy
          # The photo post is the brand card (tools/social_card.py) set in Inter.
          bash tools/install_brand_fonts.sh   # Inter, or a named warning — never a silent DejaVu

      - name: Dry run — stopping before anything is generated or posted
        if: ${{ inputs.dry_run }}
        run: |
          echo "::notice title=Dry run::The preflight above is the whole test — nothing was generated and nothing was posted."

      - name: Generate Telegram content
        if: ${{ !inputs.dry_run }}
        run: python3 scripts/generate_telegram_content.py

      - name: Post to Telegram
        if: ${{ !inputs.dry_run }}
        env:
          LEDGER_LABEL: Telegram publish ledger
          TELEGRAM_FORCE: ${{ inputs.force }}
        run: |
          set -o pipefail
          python3 scripts/post_telegram.py 2>&1 | tee /tmp/telegram_post.log
          # The poster's own counters, in the run summary as well as the log: "3 sent"
          # and "0 sent, 3 already published" look identical in a green tick, and they
          # mean opposite things.
          SENT=$(sed -n 's/^TELEGRAM_SENT=//p' /tmp/telegram_post.log | tail -1)
          SKIPPED=$(sed -n 's/^TELEGRAM_SKIPPED=//p' /tmp/telegram_post.log | tail -1)
          GUARD=$(sed -n 's/^TELEGRAM_CHANNEL_GUARD=//p' /tmp/telegram_post.log | tail -1)
          {
            echo "### Telegram post"
            echo
            echo "- sent: ${SENT:-?} · already on the channel (skipped): ${SKIPPED:-?}"
            echo "- duplicate guard: ${GUARD:-not reported} — the ledger, plus the channel's own page when it is public"
            echo "- ledger: \`logs/telegram_sent.json\`"
          } >> "$GITHUB_STEP_SUMMARY"

      # Bookkeeping must never turn a successful publish red, so the job stays green
      # when this fails — with one honest difference from silence: the warning names the
      # consequence, which is that a re-run can now post the same thing twice.
      - name: Commit the publish ledger
        if: ${{ !inputs.dry_run }}
        continue-on-error: true
        env:
          BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [ ! -f logs/telegram_sent.json ]; then
            echo "No ledger file was written (nothing was posted, or the poster was stopped early)."
            exit 0
          fi
          if [ -z "$(git status --porcelain -- logs/telegram_sent.json)" ]; then
            echo "Ledger unchanged — nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if ! git pull --rebase --autostash origin "$BRANCH"; then
            echo "::warning title=Telegram ledger not committed::the post is on the channel but this run is not recorded, so a re-run could publish the same text again."
            exit 1
          fi
          git add logs/telegram_sent.json
          if git diff --staged --quiet; then
            echo "Ledger unchanged after rebase — nothing to commit."
            exit 0
          fi
          git commit -m "Auto: record Telegram post $(date -u +%F) [skip ci]"
          if ! git push origin "HEAD:$BRANCH"; then
            echo "::warning title=Telegram ledger not pushed::the post is live but the entry did not reach $BRANCH — a re-run could publish it again."
            exit 1
          fi
          echo "✅ Ledger pushed to $BRANCH."

      # A red run in a repo nobody opens is the same as silence. This makes the
      # failure land where the owner will actually see it, carrying Telegram's
      # own error text so triage does not need the run log.
      - name: Open a visible issue if the run failed
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          RUN_DATE="$(date +%F)"

          PREFLIGHT_TAIL=$(tail -n 20 /tmp/telegram_preflight.log 2>/dev/null || echo "(preflight produced no output)")
          POST_TAIL=$(tail -n 30 /tmp/telegram_post.log 2>/dev/null || echo "(the poster never ran — the preflight stopped the run)")

          gh label create telegram-automation --color 229ED9 \
            --description "Unattended Telegram channel pipeline" >/dev/null 2>&1 || true

          cat > /tmp/issue_body.md <<BODY
          The unattended Telegram post for **$RUN_DATE** failed. **Nothing was published to @docogadaily.**

          - Run: $RUN_URL

          ### What the preflight said

          \`\`\`
          $PREFLIGHT_TAIL
          \`\`\`

          ### What the poster said

          \`\`\`
          $POST_TAIL
          \`\`\`

          ### Reading it

          - \`can't parse entities: Character '…' is reserved\` — the message markup is
            wrong. Escape the character (see \`tools/telegram_mdv2.py\`); the poster
            retries as plain text, and this line says whether that retry worked.
          - \`getMe failed: … Unauthorized\` — the bot token is revoked. Reissue it with
            @BotFather and update \`TELEGRAM_BOT_TOKEN\`.
          - \`getMe failed: … Not Found\` or \`is not a token\` — a paste problem, not a
            revoked bot: the secret does not have the shape \`<digits>:<35 characters>\`.
            @BotFather → /mybots → the bot → API Token, and paste exactly that.
          - \`chat not found\` / \`bot is not a member\` — the channel ID moved or the bot
            was removed. Re-check \`TELEGRAM_CHAT_ID\` and the channel's admin list.
          - \`not enough rights\` / \`can_post_messages\` — re-grant the bot "Post messages"
            in the channel's administrator settings.
          - \`429 Too Many Requests\` — flood limit; the next scheduled run is unaffected.
          BODY

          # One issue per *cause*, not per day. While a repair is outstanding the lane has
          # nothing new to say, and an inbox of identical failures trains you to ignore it —
          # so a later failure with the same cause becomes a comment on the open issue, and
          # only a new cause opens a new one. `setup` means the lane was never configured,
          # which is not an outage and must not read like one.
          TAIL=$(cat /tmp/telegram_preflight.log /tmp/telegram_post.log 2>/dev/null || true)
          case "$TAIL" in
            *"secrets missing"*) CAUSE=setup ;;
            *Unauthorized*|*"invalid client"*|*invalid_grant*) CAUSE=credentials ;;
            *"chat not found"*|*"bot is not a member"*|*"bot not in the chat"*) CAUSE=chat ;;
            *"have no rights"*|*"not enough rights"*|*can_post_messages*) CAUSE=rights ;;
            *) CAUSE=run ;;
          esac

          # Newest match wins (`max`), so once a tagged issue exists the legacy one beside it
          # stops collecting comments. `#16`/`#12` were filed before titles carried a cause: a
          # lane that folds them in keeps one story per problem instead of two.
          EXISTING=$(CAUSE_TAG="[$CAUSE]" LEGACY_PREFIX="Telegram post failed — " \
            gh issue list --label telegram-automation --state open --limit 100 --json number,title \
            --jq "[.[] | select((.title | contains(\$ENV.CAUSE_TAG)) or ((.title | contains(\$ENV.LEGACY_PREFIX)) and (.title | contains(\"[\") | not))) | .number] | max // empty")
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body-file /tmp/issue_body.md || true
            echo "Same cause as issue #$EXISTING — commented instead of filing a second one"
          else
            gh issue create --title "Telegram post failed — $RUN_DATE [$CAUSE]" \
              --label telegram-automation --body-file /tmp/issue_body.md \
              || echo "::warning title=Issue not created::bookkeeping failed; the run log still carries the cause"
          fi
