name: DocOga Telegram Auto-Post

# This workflow posts daily content to Telegram automatically
# Runs at 9 AM Nigeria time (UTC+1 = 8 AM UTC)

on:
  schedule:
    - cron: '0 8 * * *'  # 8 AM UTC = 9 AM Nigeria time (UTC+1)
  workflow_dispatch:     # Allow manual triggering

jobs:
  generate-and-post:
    name: Generate Content & Post to Telegram
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      
      - name: Install dependencies
        run: python3 -m pip install requests
      
      - name: List files (debug)
        run: ls -la
      
      - name: List scripts directory (debug)
        run: ls -la scripts/
      
      - name: Generate Telegram content
        env:
          TZ: Africa/Lagos
        run: python3 scripts/generate_telegram_content.py
      
      - name: Post to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TZ: Africa/Lagos
        run: python3 scripts/post_telegram.py
