name: DocOga Telegram Auto-Post

# This workflow posts daily content to Telegram automatically
# Runs at 9 AM Nigeria time (UTC+1 = 8 AM UTC)

on:
  schedule:
    - cron: '0 8 * * *'  # 8 AM UTC = 9 AM Nigeria time (UTC+1)
  workflow_dispatch:     # Allow manual triggering

jobs:
  generate-and-post:
    name: Generate Content & Post to Telegram
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      
      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install requests
          python3 -c "import requests; print('requests OK')"
      
      - name: Debug - Check files
        run: |
          echo "=== Current directory ==="
          pwd
          echo "=== All files ==="
          ls -la
          echo "=== Scripts directory ==="
          ls -la scripts/ || echo "scripts/ not found"
      
      - name: Debug - Check Python
        run: |
          which python3
          python3 --version
          python3 -c "import sys; print(sys.executable)"
      
      - name: Debug - Check environment variables
        run: |
          echo "TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:+SET}"
          echo "TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:+SET}"
      
      - name: Generate Telegram content
        env:
          TZ: Africa/Lagos
        run: python3 scripts/generate_telegram_content.py
      
      - name: Post to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TZ: Africa/Lagos
        run: python3 scripts/post_telegram.py
