name: DocOga Telegram Auto-Post

# Posts daily content to the @docogadaily Telegram channel
# Runs at 9 AM Nigeria time (UTC+1 = 8 AM UTC)

on:
  schedule:
    - cron: '0 8 * * *'  # 8 AM UTC = 9 AM Nigeria time (UTC+1)
  workflow_dispatch:     # Allow manual triggering

jobs:
  generate-and-post:
    name: Generate Content & Post to Telegram
    runs-on: ubuntu-latest

    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      TZ: Africa/Lagos

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Generate Telegram content
        run: python3 scripts/generate_telegram_content.py

      - name: Post to Telegram
        run: python3 scripts/post_telegram.py
