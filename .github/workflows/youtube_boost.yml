name: YouTube boost — playlist + first comment sweep

# Twenty minutes after the public slot (19:00 WAT, vars.YT_PUBLISH_HOUR_WAT), every video the
# publish ledgers know gets what it still lacks (tools/yt_boost.py): its series playlist, and —
# now that it is public — the channel's first comment with the question and the Deep-Dive link.
# The Shorts and Deep-Dive lanes do the playlist at upload time; this is the sweep that posts
# the comment once a scheduled video has gone live, and that catches up older videos a few a
# night. ≤160 Data API units a video, ₦0, read/write only on the channel's own videos.

on:
  schedule:
    - cron: '20 18 * * *'        # 19:20 WAT — after the 19:00 WAT publish slot
  workflow_dispatch:
    inputs:
      max:
        description: 'Videos to touch this run'
        required: false
        default: '4'
        type: string

permissions:
  contents: write

concurrency:
  group: youtube-boost
  cancel-in-progress: false

env:
  TZ: Africa/Lagos

jobs:
  sweep:
    name: Playlist + first comment
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: python -m pip install --quiet "requests>=2.31,<3" cryptography
      - name: Sweep
        id: sweep
        env:
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          SOCIAL_TOKEN_KEY: ${{ secrets.SOCIAL_TOKEN_KEY }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          MAX: ${{ inputs.max }}
        run: |
          set -o pipefail
          python3 tools/yt_boost.py run --max "${MAX:-4}" 2>&1 | tee /tmp/yt_boost.log
          {
            echo "## YouTube boost sweep"
            echo '```'
            grep -v '^::' /tmp/yt_boost.log | tail -n 20
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Commit the boost ledger
        continue-on-error: true
        env:
          BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase --autostash origin "$BRANCH" || { echo "::warning title=Boost ledger not committed::could not rebase on $BRANCH"; exit 1; }
          git add -f logs/youtube_boosts.json 2>/dev/null || true
          git diff --staged --quiet || { git commit -m "Auto: YouTube boost sweep $(date +%F) [skip ci]" && git push origin "HEAD:$BRANCH"; }
