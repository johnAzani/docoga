name: DocOga Live

# The brain of the always-on stream — minutes a day, never the stream itself.
#
# Owner, 26 Oct 2026, 4:20am: "go — I want live stream to always be on for life, pulling in
# watch time, subscribers etc." Then, the same morning, after the research: "I don't want to
# run it on GitHub, I don't want to take that risk. Let's do it in Oracle." GitHub's Actions
# terms (27 Aug 2026) allow Actions only to develop, test, deploy and publish the project and
# forbid using it as a content delivery network; a 24/7 relay on the runners would put the
# whole machine at risk for one stream. So no video is ever pushed from here.
#
# What this lane does, four times a day (and after every Short, which banks itself):
#   1. prepare — read the library from the releases (Deep-Dive masters on deepdive-<ep>, banked
#      Shorts on live-library), normalise only what is new to one 1080p30 profile, bank the
#      segments and loop.json (the running order) on the live-library release;
#   2. ensure  — keep one public broadcast alive (auto-start on, auto-stop OFF) bound to the one
#      reusable stream key; the first run creates it and sets the cover;
#   3. health  — is data arriving from the streaming machine? If not (and it once was), Telegram the owner.
# Any Ubuntu box (deploy/live/ — Oracle, RackNerd, Hetzner, a laptop) pulls loop.json and streams it with ffmpeg -c copy.
# The broadcast is only created once data arrives on the key, so no public 'waiting' placeholder sits on the channel.
# Kill switch: repository variable DOCOGA_LIVE=off ends the broadcast and stops the banking.

on:
  schedule:
    # Control runs every six hours; one line per hour so every clock and heartbeat reader
    # parses it the same way.
    - cron: '5 0 * * *'
    - cron: '5 6 * * *'
    - cron: '5 12 * * *'
    - cron: '5 18 * * *'
  workflow_dispatch:
    inputs:
      skip_health:
        description: 'Do not DM the owner about an off-air stream this run (e.g. the machine is being set up)'
        required: false
        default: false
        type: boolean

permissions:
  contents: write   # logs/youtube_live.json (the broadcast ledger) + release assets (the library)
  issues: write     # a control run that failed opens one visible issue

concurrency:
  group: docoga-live
  cancel-in-progress: false

env:
  LIVE_RELEASE: live-library

jobs:
  control:
    name: Prepare the loop, keep the broadcast, check the air
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
      SOCIAL_TOKEN_KEY: ${{ secrets.SOCIAL_TOKEN_KEY }}
      YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
      YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install the dependencies (requests, the vault, Pillow for the card)
        run: python3 -m pip install --quiet "requests>=2.31,<3" cryptography "Pillow>=10"

      # DOCOGA_LIVE=off: end the broadcast and go home green.
      - name: Honour the kill switch
        id: switch
        env:
          DOCOGA_LIVE: ${{ vars.DOCOGA_LIVE }}
        run: |
          if [ "${DOCOGA_LIVE:-on}" = "off" ]; then
            python3 tools/yt_live.py off 2>&1 | tee /tmp/live_off.log || true
            echo "### DocOga Live — switched off (DOCOGA_LIVE=off)" >> "$GITHUB_STEP_SUMMARY"
            echo "on=no" >> "$GITHUB_OUTPUT"
          else
            echo "on=yes" >> "$GITHUB_OUTPUT"
          fi

      - name: Install ffmpeg and Inter
        if: steps.switch.outputs.on == 'yes'
        run: bash tools/install_motionstudio_deps.sh

      - name: Read the library
        if: steps.switch.outputs.on == 'yes'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -o pipefail
          gh release view "$LIVE_RELEASE" >/dev/null 2>&1 || \
            gh release create "$LIVE_RELEASE" --prerelease --title "DocOga Live library" \
              --notes "Banked Shorts (short-<date>.mp4), normalised loop segments (norm-*.mp4) and loop.json for the always-on stream. Managed by youtube_live.yml; streamed by the host machine (deploy/live)."
          # One page of 100 releases is the whole shelf for years (one release per Deep-Dive).
          gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            | python3 -c 'import json,sys; rels=json.load(sys.stdin); json.dump([{"release": r["tag_name"], "name": a["name"], "size": a["size"]} for r in rels for a in r.get("assets", [])], open("/tmp/assets.json", "w"))'

      - name: Prepare the loop (normalise what is new, bank the segments and loop.json)
        if: steps.switch.outputs.on == 'yes'
        id: loop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -o pipefail
          python3 tools/yt_live.py backdrop --out /tmp/backdrop.jpg
          python3 tools/yt_live.py cover --out /tmp/live-cover.jpg
          python3 tools/yt_live.py prepare --assets /tmp/assets.json --lib /tmp/lib --backdrop /tmp/backdrop.jpg 2>&1 | tee /tmp/prepare.log
          echo "segments=$(sed -n 's/^LIVE_SEGMENTS=//p' /tmp/prepare.log | tail -1)" >> "$GITHUB_OUTPUT"

      # The broadcast and its key. The key is masked before anything else can print it; the
      # ingest file is 0600 in /tmp and is deleted at the end of the step — the VM has its own copy.
      - name: Keep the broadcast
        if: steps.switch.outputs.on == 'yes'
        id: live
        run: |
          set -o pipefail
          python3 tools/yt_live.py ensure --out /tmp/live.json --cover /tmp/live-cover.jpg 2>&1 | tee /tmp/ensure.log
          echo "::add-mask::$(python3 -c 'import json; print(json.load(open("/tmp/live.json"))["stream_key"])')"
          echo "url=$(sed -n 's/^LIVE_URL=//p' /tmp/ensure.log | tail -1)" >> "$GITHUB_OUTPUT"
          echo "created=$(sed -n 's/^LIVE_CREATED=//p' /tmp/ensure.log | tail -1)" >> "$GITHUB_OUTPUT"
          rm -f /tmp/live.json

      - name: Commit the broadcast ledger
        if: steps.live.outputs.created == 'yes'
        continue-on-error: true
        env:
          BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          for path in logs/youtube_live.json; do
            if [ -e "$path" ]; then git add "$path"; fi
          done
          if git diff --staged --quiet; then echo "Ledger unchanged."; exit 0; fi
          git commit -q -m "Auto: DocOga Live broadcast $(date -u +%F) [skip ci]"
          git pull --rebase --autostash origin "$BRANCH" >/dev/null 2>&1 || true
          git push origin "HEAD:$BRANCH" || echo "::warning title=Ledger not pushed::the broadcast exists; its row did not reach $BRANCH"

      - name: Check the air (DM the owner if the streaming machine has gone quiet)
        if: steps.switch.outputs.on == 'yes'
        id: health
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          IN_SKIP: ${{ inputs.skip_health }}
        run: |
          set -o pipefail
          ARGS=()
          [ "${IN_SKIP:-false}" = "true" ] || ARGS+=(--dm)
          python3 tools/yt_live.py health "${ARGS[@]}" 2>&1 | tee /tmp/health.log
          echo "state=$(sed -n 's/^LIVE_HEALTH=//p' /tmp/health.log | tail -1)" >> "$GITHUB_OUTPUT"

      - name: Summary
        if: always()
        env:
          URL: ${{ steps.live.outputs.url }}
          SEGMENTS: ${{ steps.loop.outputs.segments }}
          STATE: ${{ steps.health.outputs.state }}
          ON: ${{ steps.switch.outputs.on }}
        run: |
          {
            echo "### DocOga Live — control run $(date -u +%FT%TZ)"
            echo
            echo "- switch: ${ON:-?}"
            echo "- broadcast: ${URL:-(none)}"
            echo "- loop: ${SEGMENTS:-?} segment(s) in loop.json"
            echo "- air: ${STATE:-?} (a separate machine streams; this lane only checks)"
            echo
            echo '```'
            tail -n 20 /tmp/prepare.log 2>/dev/null || echo "(no output)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Open a visible issue if the control run failed
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -uo pipefail
          TITLE="DocOga Live: a control run failed"
          TAIL=$(tail -n 30 /tmp/ensure.log 2>/dev/null || tail -n 30 /tmp/prepare.log 2>/dev/null || echo "(no output)")
          BODY=$(printf 'Run: %s\n\nThe streaming machine, if any, keeps pushing the last loop it fetched; the next control run tries again. Last lines:\n\n```\n%s\n```\n' "$RUN_URL" "$TAIL")
          EXISTING=$(gh issue list --state open --search "\"$TITLE\" in:title" --json number -q '.[0].number' 2>/dev/null || true)
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body "$BODY" || true
          else
            gh issue create --title "$TITLE" --label youtube-automation --body "$BODY" || gh issue create --title "$TITLE" --body "$BODY" || true
          fi
