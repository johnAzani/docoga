name: DocOga Live

# The channel's always-on stream (owner, 26 Oct 2026, 4:20am: "go — I want live stream to
# always be on for life, pulling in watch time, subscribers etc").
#
# How a ₦0 stack stays live for life: one public YouTube broadcast with auto-stop OFF, fed
# by a chain of six-hour windows. Each window queues its successor the moment it starts
# (the `docoga-live` concurrency group holds that successor until this one ends), streams
# the channel's own banked episodes on a loop for LIVE_MINUTES (5h45m), and exits. The
# hand-over is roughly a minute of "reconnecting" inside the same broadcast. The clock
# (workers/clock) also dispatches this lane every six hours as a backstop, so a window that
# died at setup is replaced within the hour — and a second pending run in the group simply
# replaces the first. Kill switch: repository variable DOCOGA_LIVE=off ends the broadcast
# and stops the chain. Everything else is tools/yt_live.py.
#
# The library: every Deep-Dive master on its `deepdive-<ep>` release and every weekday Short
# the Shorts lane banks on the `live-library` release (short-<date>.mp4). Clips are normalised
# once (one size, one codec profile, keyframe every 2 s) and the normalised copies are banked
# on the same release, so a window only encodes what is new and streams with `-c copy`.

on:
  schedule:
    # Backstop every six hours (the chain itself keeps the stream up); one line per hour so
    # every clock and heartbeat reader parses it the same way.
    - cron: '5 0 * * *'
    - cron: '5 6 * * *'
    - cron: '5 12 * * *'
    - cron: '5 18 * * *'
  workflow_dispatch:
    inputs:
      minutes:
        description: 'Minutes to stream in this window (default 345 = 5h45m)'
        required: false
        default: ''
        type: string

permissions:
  contents: write   # logs/youtube_live.json (the broadcast ledger) + release assets (the library)
  actions: write    # each window queues the next one
  issues: write     # a window that could not stream opens one visible issue

concurrency:
  group: docoga-live
  cancel-in-progress: false

env:
  LIVE_RELEASE: live-library

jobs:
  live:
    name: Stream the next window
    runs-on: ubuntu-24.04
    timeout-minutes: 358
    env:
      YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
      SOCIAL_TOKEN_KEY: ${{ secrets.SOCIAL_TOKEN_KEY }}
      YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
      YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install the dependencies (requests, the vault, Pillow for the card)
        run: python3 -m pip install --quiet "requests>=2.31,<3" cryptography "Pillow>=10"

      # DOCOGA_LIVE=off: end the broadcast, queue nothing, go home green.
      - name: Honour the kill switch
        id: switch
        env:
          DOCOGA_LIVE: ${{ vars.DOCOGA_LIVE }}
        run: |
          if [ "${DOCOGA_LIVE:-on}" = "off" ]; then
            python3 tools/yt_live.py off 2>&1 | tee /tmp/live_off.log || true
            echo "### DocOga Live — switched off (DOCOGA_LIVE=off)" >> "$GITHUB_STEP_SUMMARY"
            echo "on=no" >> "$GITHUB_OUTPUT"
          else
            echo "on=yes" >> "$GITHUB_OUTPUT"
          fi

      # The successor waits in the concurrency group until this window ends; a window that
      # fails later still leaves a successor behind, which is how the chain heals itself.
      - name: Queue the next window
        if: steps.switch.outputs.on == 'yes'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run youtube_live.yml --ref "${GITHUB_REF_NAME:-main}"

      - name: Install ffmpeg and Inter
        if: steps.switch.outputs.on == 'yes'
        run: bash tools/install_motionstudio_deps.sh

      - name: Read the library
        if: steps.switch.outputs.on == 'yes'
        id: library
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -o pipefail
          gh release view "$LIVE_RELEASE" >/dev/null 2>&1 || \
            gh release create "$LIVE_RELEASE" --prerelease --title "DocOga Live library" \
              --notes "Banked Shorts (short-<date>.mp4) and normalised loop segments (norm-*.mp4) for the always-on stream. Managed by youtube_live.yml."
          # One page of 100 releases is the whole shelf for years (one release per Deep-Dive).
          gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            | python3 -c 'import json,sys; rels=json.load(sys.stdin); json.dump([{"release": r["tag_name"], "name": a["name"], "size": a["size"]} for r in rels for a in r.get("assets", [])], open("/tmp/assets.json", "w"))'
          set +e
          python3 tools/yt_live.py plan --assets /tmp/assets.json --out /tmp/plan.json 2>&1 | tee /tmp/plan.log
          CODE=${PIPESTATUS[0]}
          set -e
          echo "clips=$(sed -n 's/^LIVE_CLIPS=//p' /tmp/plan.log | tail -1)" >> "$GITHUB_OUTPUT"
          if [ "$CODE" != "0" ]; then
            echo "::error title=Nothing to stream::no Deep-Dive master or banked Short was found on the releases"
            exit "$CODE"
          fi

      - name: Prepare the loop (normalise what is new, concatenate the reel)
        if: steps.switch.outputs.on == 'yes'
        id: reel
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -o pipefail
          python3 tools/yt_live.py backdrop --out /tmp/backdrop.jpg
          python3 tools/yt_live.py cover --out /tmp/live-cover.jpg
          python3 tools/yt_live.py build --plan /tmp/plan.json --lib /tmp/lib --reel /tmp/reel.mp4 \
            --backdrop /tmp/backdrop.jpg 2>&1 | tee /tmp/build.log
          echo "segments=$(sed -n 's/^LIVE_SEGMENTS=//p' /tmp/build.log | tail -1)" >> "$GITHUB_OUTPUT"

      # The broadcast and its key. The key is masked before anything else can print it; the
      # ingest file is 0600 in /tmp and never leaves the runner.
      - name: Find or create the broadcast
        if: steps.switch.outputs.on == 'yes'
        id: live
        run: |
          set -o pipefail
          python3 tools/yt_live.py ensure --out /tmp/live.json --cover /tmp/live-cover.jpg 2>&1 | tee /tmp/ensure.log
          echo "::add-mask::$(python3 -c 'import json; print(json.load(open("/tmp/live.json"))["stream_key"])')"
          echo "url=$(sed -n 's/^LIVE_URL=//p' /tmp/ensure.log | tail -1)" >> "$GITHUB_OUTPUT"
          echo "created=$(sed -n 's/^LIVE_CREATED=//p' /tmp/ensure.log | tail -1)" >> "$GITHUB_OUTPUT"

      - name: Commit the broadcast ledger
        if: steps.live.outputs.created == 'yes'
        continue-on-error: true
        env:
          BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          for path in logs/youtube_live.json; do
            if [ -e "$path" ]; then git add "$path"; fi
          done
          if git diff --staged --quiet; then echo "Ledger unchanged."; exit 0; fi
          git commit -q -m "Auto: DocOga Live broadcast $(date -u +%F) [skip ci]"
          git pull --rebase --autostash origin "$BRANCH" >/dev/null 2>&1 || true
          git push origin "HEAD:$BRANCH" || echo "::warning title=Ledger not pushed::the broadcast exists; its row did not reach $BRANCH"

      - name: Stream this window
        if: steps.switch.outputs.on == 'yes'
        id: push
        env:
          IN_MINUTES: ${{ inputs.minutes }}
        run: |
          set -o pipefail
          ARGS=(--reel /tmp/reel.mp4 --ingest /tmp/live.json)
          case "${IN_MINUTES:-}" in
            ''|*[!0-9]*) ;;
            *) ARGS+=(--minutes "$IN_MINUTES") ;;
          esac
          python3 tools/yt_live.py stream "${ARGS[@]}" 2>&1 | tee /tmp/stream.log

      - name: Summary
        if: always()
        env:
          URL: ${{ steps.live.outputs.url }}
          CLIPS: ${{ steps.library.outputs.clips }}
          SEGMENTS: ${{ steps.reel.outputs.segments }}
          ON: ${{ steps.switch.outputs.on }}
        run: |
          {
            echo "### DocOga Live — window $(date -u +%FT%TZ)"
            echo
            echo "- switch: ${ON:-?}"
            echo "- broadcast: ${URL:-(none)}"
            echo "- clips in the loop: ${CLIPS:-?} planned, ${SEGMENTS:-?} prepared"
            echo
            echo '```'
            tail -n 20 /tmp/stream.log 2>/dev/null || tail -n 20 /tmp/build.log 2>/dev/null || echo "(no stream output)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Open a visible issue if the window could not stream
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -uo pipefail
          TITLE="DocOga Live: a window could not stream"
          TAIL=$(tail -n 30 /tmp/stream.log 2>/dev/null || tail -n 30 /tmp/ensure.log 2>/dev/null || tail -n 30 /tmp/build.log 2>/dev/null || echo "(no output)")
          BODY=$(printf 'Run: %s\n\nThe next window is already queued and will try again; the broadcast stays open. Last lines:\n\n```\n%s\n```\n' "$RUN_URL" "$TAIL")
          EXISTING=$(gh issue list --state open --search "\"$TITLE\" in:title" --json number -q '.[0].number' 2>/dev/null || true)
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body "$BODY" || true
          else
            gh issue create --title "$TITLE" --label youtube-automation --body "$BODY" || gh issue create --title "$TITLE" --body "$BODY" || true
          fi
