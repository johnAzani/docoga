name: Cloudflare build check

# Why this exists
# --------------
# Workers Builds ("docoga-git") FAILS on the PR branch but SUCCEEDS on main.
# The build log lives on the Cloudflare dashboard, which the sandbox cannot
# reach, so the failure was undiagnosable.
#
# This reproduces what Cloudflare does — `wrangler deploy --dry-run` performs
# the full build (asset collection, size checks, worker bundling) without
# publishing. If it fails here, it fails on Cloudflare for the same reason.
#
# Unlike net-probe.yml this runs on push, so it works on a feature branch
# (workflow_dispatch only registers workflows from the default branch).

# Minutes budget (17 Oct 2026, see verify.yml): pull requests always; pushes only on
# main and only when something the Cloudflare build actually consumes changed.
on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "wrangler.jsonc"
      - "worker/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/build-check.yml"
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  # Needed to post the build result back, because the sandbox cannot download
  # run logs: results-receiver.actions.githubusercontent.com is not in its
  # egress allowlist. A PR comment IS readable through api.github.com.
  pull-requests: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Show what Cloudflare would publish
        run: |
          echo "########## wrangler.jsonc ##########"
          cat wrangler.jsonc
          echo
          echo "########## site/ asset count and size ##########"
          echo "files: $(find site -type f | wc -l)"
          echo "bytes: $(du -sb site | cut -f1)"
          echo
          echo "########## largest assets ##########"
          find site -type f -printf '%s\t%p\n' | sort -rn | head -10
          echo
          echo "########## root package.json (drives build detection) ##########"
          cat package.json 2>/dev/null || echo "(none)"

      - name: Reproduce the Cloudflare build
        env:
          # --dry-run must not need real credentials; these keep wrangler quiet
          # if it insists on an account before building.
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || '' }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || '' }}
        run: |
          set -u
          BUILD_LOG="$RUNNER_TEMP/build.log"
          : > "$BUILD_LOG"
          {
            echo "########## wrangler version ##########"
            npx --yes wrangler@latest --version 2>&1
            echo
            echo "########## wrangler deploy --dry-run ##########"
          } | tee -a "$BUILD_LOG"
          set +e
          npx --yes wrangler@latest deploy --dry-run --outdir .cloudflare-build > >(tee -a "$BUILD_LOG") 2>&1
          WEXIT=$?
          set -e
          echo "wrangler_exit=$WEXIT" | tee -a "$BUILD_LOG"
          echo "BUILD_LOG=$BUILD_LOG" >> "$GITHUB_ENV"

      - name: Inspect build output
        if: always()
        run: |
          echo "########## built output ##########"
          if [ -d .cloudflare-build ]; then
            find .cloudflare-build -maxdepth 2 | head -30
            echo
            echo "size: $(du -sh .cloudflare-build 2>/dev/null | cut -f1)"
          else
            echo "(no output directory — the build did not complete)"
          fi

      - name: Post the result where the agent can read it
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('fs');
            const log = (process.env.BUILD_LOG && fs.existsSync(process.env.BUILD_LOG))
              ? fs.readFileSync(process.env.BUILD_LOG, 'utf8')
              : '(no build log captured)';
            // Cap the body — PR comments have a 65536 char limit.
            const body = [
              '## Cloudflare build check (wrangler deploy --dry-run)',
              '',
              'Reproduces what Workers Builds does, so the sandbox can see the',
              'failure without access to the Cloudflare dashboard.',
              '',
              '```',
              log.slice(-14000),
              '```',
            ].join('\n');
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number,
            });
            const marker = '<!-- build-check -->';
            const existing = comments.find(c => c.body && c.body.includes(marker));
            const full = marker + '\n' + body;
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner, repo: context.repo.repo, comment_id: existing.id, body: full,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, body: full,
              });
            }
