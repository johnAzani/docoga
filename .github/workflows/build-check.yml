name: Cloudflare build check

# Why this exists
# --------------
# Workers Builds ("docoga-git") FAILS on the PR branch but SUCCEEDS on main.
# The build log lives on the Cloudflare dashboard, which the sandbox cannot
# reach, so the failure was undiagnosable.
#
# This reproduces what Cloudflare does — `wrangler deploy --dry-run` performs
# the full build (asset collection, size checks, worker bundling) without
# publishing. If it fails here, it fails on Cloudflare for the same reason.
#
# Unlike net-probe.yml this runs on push, so it works on a feature branch
# (workflow_dispatch only registers workflows from the default branch).

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Show what Cloudflare would publish
        run: |
          echo "########## wrangler.jsonc ##########"
          cat wrangler.jsonc
          echo
          echo "########## site/ asset count and size ##########"
          echo "files: $(find site -type f | wc -l)"
          echo "bytes: $(du -sb site | cut -f1)"
          echo
          echo "########## largest assets ##########"
          find site -type f -printf '%s\t%p\n' | sort -rn | head -10
          echo
          echo "########## root package.json (drives build detection) ##########"
          cat package.json 2>/dev/null || echo "(none)"

      - name: Reproduce the Cloudflare build
        env:
          # --dry-run must not need real credentials; these keep wrangler quiet
          # if it insists on an account before building.
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || '' }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || '' }}
        run: |
          set -u
          echo "########## wrangler version ##########"
          npx --yes wrangler@latest --version
          echo
          echo "########## wrangler deploy --dry-run ##########"
          npx --yes wrangler@latest deploy --dry-run --outdir .cloudflare-build 2>&1 \
            | tail -60
          echo "wrangler_exit=${PIPESTATUS[0]}"

      - name: Inspect build output
        if: always()
        run: |
          echo "########## built output ##########"
          if [ -d .cloudflare-build ]; then
            find .cloudflare-build -maxdepth 2 | head -30
            echo
            echo "size: $(du -sh .cloudflare-build 2>/dev/null | cut -f1)"
          else
            echo "(no output directory — the build did not complete)"
          fi
