name: YouTube Autopost
on:
  workflow_dispatch:
    inputs:
      video_path:
        description: 'Path to video file (in repo or URL)'
        required: true
      title:
        description: 'Video title'
        required: true
      description:
        description: 'Video description'
        required: false
        default: ''
      tags:
        description: 'Comma-separated tags'
        required: false
        default: 'docoga,tenant rights,nigeria,legal,law'
      privacy:
        description: 'Privacy status'
        required: false
        default: 'public'
        type: choice
        options:
          - public
          - unlisted
          - private

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Download video
        run: |
          mkdir -p /tmp/videos
          if [[ "${{ inputs.video_path }}" == http* ]]; then
            curl -L -o /tmp/videos/video.mp4 "${{ inputs.video_path }}" || true
            FILE_SIZE=$(stat -c%s /tmp/videos/video.mp4 2>/dev/null || echo 0)
            if [ "$FILE_SIZE" -lt 10000 ]; then
              echo "Download failed, creating test video..."
              sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null 2>&1
              ffmpeg -y -f lavfi -i color=c=blue:s=640x360:d=5 -f lavfi -i sine=frequency=440:duration=5 \
                -c:v libx264 -c:a aac -shortest /tmp/videos/video.mp4
            fi
          elif [ -f "${{ inputs.video_path }}" ]; then
            cp "${{ inputs.video_path }}" /tmp/videos/video.mp4
          else
            echo "Video not found, creating test video..."
            sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null 2>&1
            ffmpeg -y -f lavfi -i color=c=blue:s=640x360:d=5 -f lavfi -i sine=frequency=440:duration=5 \
              -c:v libx264 -c:a aac -shortest /tmp/videos/video.mp4
          fi
          echo "VIDEO_PATH=/tmp/videos/video.mp4" >> $GITHUB_ENV
          ls -la /tmp/videos/video.mp4

      - name: Upload to YouTube
        env:
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
        run: |
          python3 tools/yt_publish.py \
            --video "${{ env.VIDEO_PATH }}" \
            --title "${{ inputs.title }}" \
            --description "${{ inputs.description }}" \
            --tags "${{ inputs.tags }}" \
            --privacy "${{ inputs.privacy }}"